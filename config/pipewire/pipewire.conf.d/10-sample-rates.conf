## Follow the source's sample rate instead of resampling everything to 48 kHz.
## When a stream starts on an idle device, PipeWire switches the device to the
## stream's rate if the hardware supports it, so 44.1 kHz music and 88.2/96 kHz
## recordings play bit-perfect. Rates the device can't do still resample.

context.properties = {
  default.clock.allowed-rates = [ 44100 48000 88200 96000 ]
}
