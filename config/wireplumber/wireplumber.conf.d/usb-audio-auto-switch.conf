## Auto-switch to USB audio devices (USB-C headphones, DACs, headsets) when
## they are connected. The Lua hook is shipped in default/wireplumber/scripts/
## and copied into WirePlumber's data dir by install/user/wireplumber.sh and by
## the migration that introduces this config.

wireplumber.components = [
  {
    name = "usb-audio-auto-switch.lua"
    type = "script/lua"
    provides = hooks.default-nodes.usb-audio-auto-switch
  }
]

## WirePlumber only loads a component when a profile feature wants it, so opt
## our hook into the default-nodes policy alongside the stock hooks.
wireplumber.components.rules = [
  {
    matches = [
      {
        provides = "policy.default-nodes"
      }
    ]
    actions = {
      merge = {
        wants = [
          hooks.default-nodes.find-selected,
          hooks.default-nodes.find-best,
          hooks.default-nodes.state,
          hooks.default-nodes.usb-audio-auto-switch
        ]
      }
    }
  }
]
