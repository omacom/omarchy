## Auto-connect the A2DP playback profile on Bluetooth speakers and receivers.
## This helps speakers and receivers expose their audio profiles without
## requiring manual PipeWire/WirePlumber recovery.
##
## Deliberately not on headphones, headsets, hands-free devices or phones.
## WirePlumber connects a paired, trusted device without knowing it is in use
## on another host, so matching those takes a single-link headset away from
## the device it is already playing to (#15456).
##
## Deliberately not a2dp_source anywhere: that connects a phone as an audio
## source, and a transport BlueZ refuses there has been seen to leave
## WirePlumber unable to link any stream until it restarts (#12642).

monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "~bluez_card.*"
        device.form-factor = "!~^(headphone|headset|hands-free|phone)$"
      }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ a2dp_sink ]
      }
    }
  }
]
