## Auto-connect remote A2DP sinks (speakers/headphones) and sources (phones).
## a2dp_source lets this machine receive media audio; HFP/HSP handles calls.
## See the troubleshooting manual to opt out for a device that breaks audio.

monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ a2dp_sink a2dp_source ]
      }
    }
  }
]
