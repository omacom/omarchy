# Keep audio where it is while the displays are blanked (lock, idle), instead of
# letting a dark HDMI/DP monitor look unplugged and audio jump to the speakers.
# omarchy-brightness-display sets omarchy.displays-blanked around the blanking.
wireplumber.settings.schema = {
  omarchy.displays-blanked = {
    name = "Displays blanked"
    description = "Hold card profiles and default audio devices while the displays are blanked"
    type = "bool"
    default = false
  }
}

wireplumber.components = [
  {
    name = /usr/share/omarchy/default/wireplumber/scripts/hold-outputs-while-blanked.lua, type = script/lua
    provides = hooks.omarchy.hold-outputs-while-blanked
  }
  # Only wanted, never required, so a missing script cannot keep audio from starting.
  {
    type = virtual, provides = policy.omarchy
    wants = [ hooks.omarchy.hold-outputs-while-blanked ]
  }
]

wireplumber.profiles = {
  main = {
    policy.omarchy = required
  }
}
