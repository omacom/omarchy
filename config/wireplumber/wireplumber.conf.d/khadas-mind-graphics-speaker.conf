## Ignore the incorrect dB scale reported by the Khadas Mind Graphics Speaker.
## The ALSA PCM volume range works correctly, but the reported dB range causes
## WirePlumber to map normal volume levels to PCM 0.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.usb-KhadasCorp._Khadas_Mind_Graphics_Speaker.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.ignore-dB = true
      }
    }
  }
]
