## Disable Bluetooth hardware volume so saved volume is restored on connect
##
## Some Bluetooth earbuds report AVRCP absolute volume at max (127) on connect.
## WirePlumber applies that over the volume it saved for the device, so the earbuds
## come up at 100% regardless of the last level.
##
## This drop-in tells WirePlumber to ignore the Bluetooth device's own (AVRCP)
## volume so its saved volume wins on connect.
monitor.bluez.properties = {
  bluez5.enable-hw-volume = false
}