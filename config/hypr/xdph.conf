screencopy {
    allow_token_by_default = true
    custom_picker_binary = hyprland-preview-share-picker
    # Chromium/Electron's WebRTC portal client only requests metadata cursor
    # mode, which xdph does not advertise, so it omits cursor_mode and keeps
    # xdph's default (hidden). Default unspecified clients to embedded (2);
    # clients that explicitly request a cursor_mode still get what they asked for.
    cursor_mode = 2
}
