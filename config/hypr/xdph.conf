screencopy {
    allow_token_by_default = true
    custom_picker_binary = hyprland-preview-share-picker
    # The session default for clients that ask for no cursor mode of their own.
    # Chromium's WebRTC portal client prefers metadata cursors, and since xdph
    # advertises only hidden and embedded it sends no mode at all — which left
    # every browser share without a pointer. 2 embeds the cursor; a client that
    # does request hidden or embedded still gets the mode it asked for.
    cursor_mode = 2
}
