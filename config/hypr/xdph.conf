screencopy {
    allow_token_by_default = true
    custom_picker_binary = hyprland-preview-share-picker
    # Chromium's WebRTC portal client only ever asks for metadata cursor mode,
    # which xdph does not offer, so the session would keep xdph's hidden
    # default and viewers of a browser share never see the pointer. Make the
    # unspecified-client default embedded instead (2 = embedded).
    cursor_mode = 2
}
