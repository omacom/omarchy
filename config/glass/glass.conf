# Remove the include below to disconnect glass from Omarchy's theming system.
include ~/.local/state/omarchy/current/theme/glass.conf

# Settings below override the theme. One setting a line; glass reloads this
# file when it gets SIGUSR1, which omarchy-restart-terminal sends.
# Learn more: https://github.com/newjordan/glass

# Font
font_family JetBrainsMono Nerd Font
font_size 9

# Window padding
window_padding_width 14
