# The palette is generated separately by Omarchy's template system.
font=JetBrainsMono Nerd Font
# Follow the shell's effective Hyprland rounding, live.
# Use 0 for square corners or a positive pixel radius for a fixed override.
corner_radius=-1
# Delete cycles auto/always/never; F10 pins or unpins controls.
visibility=auto
# Appearance > Toolbar reveal changes the current player.
# Set together here to reveal both toolbars when either edge is hovered.
reveal_mode=separate
# Hide controls after inactivity, even while paused.
hide_timeout=2.5

# Appearance button > Toolbar background or Ctrl+F9 changes the current window.
# Set surface_mode below for the startup default: solid (Opaque), translucent, or gradient.
# Native menus remain solid.
surface_mode=gradient
surface_opacity=0.55
gradient_inner_opacity=0.05
gradient_outer_opacity=0.55

# Light palettes need a light backing to keep dark text readable over video.
light_surface_opacity=0.92
light_gradient_inner_opacity=0.82
light_gradient_outer_opacity=0.97
