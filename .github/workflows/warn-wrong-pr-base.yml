name: Warn on wrong PR base

env:
  DEFAULT_BRANCH: quattro

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum number of PRs to warn per run (up to 500)
        required: false
        default: "500"
        type: string
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  warn:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - if: github.event.pull_request.base.ref != env.DEFAULT_BRANCH
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `This pull request targets \`${context.payload.pull_request.base.ref}\`. Please open it against \`${process.env.DEFAULT_BRANCH}\` instead.\n\n<!-- omarchy-wrong-pr-base -->`,
            });

  backfill:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- omarchy-wrong-pr-base -->";
            const requestedLimit = Number.parseInt(context.payload.inputs.limit, 10);
            const limit = Math.min(Math.max(requestedLimit || 500, 1), 500);
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            let warned = 0;

            for (const pull of pulls) {
              if (warned >= limit) break;
              if (pull.base.ref === process.env.DEFAULT_BRANCH) continue;

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pull.number,
                per_page: 100,
              });
              if (comments.some(comment => comment.user?.login === "github-actions[bot]" && comment.body?.includes(marker))) continue;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pull.number,
                body: `This pull request targets \`${pull.base.ref}\`. Please open it against \`${process.env.DEFAULT_BRANCH}\` instead.\n\n${marker}`,
              });
              warned += 1;
              await new Promise(resolve => setTimeout(resolve, 1000));
            }

            core.notice(`Warned ${warned} pull request(s).`);
