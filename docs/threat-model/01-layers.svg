<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="800" viewBox="0 0 1180 800" role="img" aria-label="Ward — trust layers">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#81c6d9"/></marker></defs>
<rect width="1180" height="800" fill="#101b28"/>
<g font-family="DejaVu Sans, sans-serif"><text x="40" y="48" fill="#ffffff" font-size="30"><tspan x="40" dy="0">Ward — trust layers</tspan></text><text x="40" y="80" fill="#a9bacb" font-size="16"><tspan x="40" dy="0">Current review model • host authority is separate from worker requests</tspan></text><text x="40" y="123" fill="#81c6d9" font-size="16"><tspan x="40" dy="0">L0  TRUSTED DESKTOP</tspan></text><rect x="40" y="145" width="350" height="130" rx="10" fill="#26394b" stroke="#536a80"/><text x="60" y="177" fill="#ffffff" font-size="20"><tspan x="60" dy="0">Loader and host policy</tspan></text><text x="60" y="208" fill="#d9e2ed" font-size="17"><tspan x="60" dy="0">Monotonic isolation identity</tspan><tspan x="60" dy="25">Slots, summons, clips and focus</tspan><tspan x="60" dy="25">Explicit visual / pointer roaming</tspan></text><rect x="415" y="145" width="350" height="130" rx="10" fill="#26394b" stroke="#536a80"/><text x="435" y="177" fill="#ffffff" font-size="20"><tspan x="435" dy="0">Reviewer and store</tspan></text><text x="435" y="208" fill="#d9e2ed" font-size="17"><tspan x="435" dy="0">Exact revision + selected grants</tspan><tspan x="435" dy="25">Protected keys / authority paths</tspan><tspan x="435" dy="25">Signed epoch + denial markers</tspan></text><rect x="790" y="145" width="350" height="130" rx="10" fill="#26394b" stroke="#536a80"/><text x="810" y="177" fill="#ffffff" font-size="20"><tspan x="810" dy="0">Host effects / Qt importer</tspan></text><text x="810" y="208" fill="#d9e2ed" font-size="17"><tspan x="810" dy="0">Approved CLI keeps its authority</tspan><tspan x="810" dy="25">Sealed DATA file inputs</tspan><tspan x="810" dy="25">Bounded per-output GPU imports</tspan></text><path d="M205 279 L205 305" fill="none" stroke="#81c6d9" stroke-width="2" marker-end="url(#arrow)"/><path d="M588 279 L588 305" fill="none" stroke="#81c6d9" stroke-width="2" marker-end="url(#arrow)"/><path d="M960 305 L960 279" fill="none" stroke="#81c6d9" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="326" fill="#81c6d9" font-size="16"><tspan x="40" dy="0">L1  SUPERVISED PER-PLUGIN CONTROLLER</tspan></text><rect x="40" y="350" width="535" height="150" rx="10" fill="#26394b" stroke="#536a80"/><text x="60" y="382" fill="#ffffff" font-size="20"><tspan x="60" dy="0">Admission, broker and private compositor</tspan></text><text x="60" y="413" fill="#d9e2ed" font-size="17"><tspan x="60" dy="0">Live epoch / unit checks; typed bounded requests</tspan><tspan x="60" dy="25">Smithay parses untrusted worker Wayland</tspan><tspan x="60" dy="25">Controller produces buffers; host projects input</tspan><tspan x="60" dy="25">Only selected media / audio / network adapters</tspan></text><rect x="600" y="350" width="540" height="150" rx="10" fill="#26394b" stroke="#536a80"/><text x="620" y="382" fill="#ffffff" font-size="20"><tspan x="620" dy="0">Kernel isolation and supervision</tspan></text><text x="620" y="413" fill="#d9e2ed" font-size="17"><tspan x="620" dy="0">Descriptor mounts; namespaces; caps dropped</tspan><tspan x="620" dy="25">Landlock + seccomp + cgroup ceilings</tspan><tspan x="620" dy="25">No host display/session socket handed to worker</tspan><tspan x="620" dy="25">DRM render-node access remains a driver surface</tspan></text><path d="M205 505 L205 528" fill="none" stroke="#81c6d9" stroke-width="2" marker-end="url(#arrow)"/><path d="M590 529 L590 505" fill="none" stroke="#81c6d9" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="548" fill="#e6b277" font-size="16"><tspan x="40" dy="0">L2  UNTRUSTED WORKER</tspan></text><rect x="40" y="572" width="1100" height="120" rx="10" fill="#3b302d" stroke="#536a80"/><text x="60" y="604" fill="#ffffff" font-size="20"><tspan x="60" dy="0">Plugin QML/native code on a private display</tspan></text><text x="60" y="635" fill="#d9e2ed" font-size="17"><tspan x="60" dy="0">Read-only revision + projected grants/context; selected mounts and per-plugin writable storage</tspan><tspan x="60" dy="25">Masks, layer-shell focus and panel-open messages are requests — they do not grant host input</tspan></text><text x="40" y="735" fill="#e6b277" font-size="17"><tspan x="40" dy="0">Residual trust: kernel / GPU driver / private Wayland parser / Qt importer / approved CLI dependencies.</tspan><tspan x="40" dy="25">First-party and explicitly trusted local plugins run outside this worker boundary.</tspan></text></g>
</svg>
