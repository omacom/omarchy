<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="800" viewBox="0 0 1180 800" role="img" aria-label="Ward — nine trust boundaries">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#81c6d9"/></marker></defs>
<rect width="1180" height="800" fill="#101b28"/>
<g font-family="DejaVu Sans, sans-serif"><text x="40" y="48" fill="#ffffff" font-size="30"><tspan x="40" dy="0">Ward — nine trust boundaries</tspan></text><text x="40" y="80" fill="#a9bacb" font-size="16"><tspan x="40" dy="0">Controls are not a blanket low-risk rating; test scope and release gaps are tracked separately</tspan></text><rect x="40" y="125" width="350" height="160" rx="10" fill="#26394b" stroke="#536a80"/><text x="60" y="157" fill="#ffffff" font-size="20"><tspan x="60" dy="0">TB-0  Installation</tspan></text><text x="60" y="188" fill="#d9e2ed" font-size="17"><tspan x="60" dy="0">Host-owned isolation identity</tspan><tspan x="60" dy="25">No editable-manifest fallback</tspan><tspan x="60" dy="25">CLI + registry regressions</tspan></text><rect x="415" y="125" width="350" height="160" rx="10" fill="#26394b" stroke="#536a80"/><text x="435" y="157" fill="#ffffff" font-size="20"><tspan x="435" dy="0">TB-1  Approval</tspan></text><text x="435" y="188" fill="#d9e2ed" font-size="17"><tspan x="435" dy="0">Explicit signed revision / grants</tspan><tspan x="435" dy="25">Authority paths and aliases denied</tspan><tspan x="435" dy="25">Real store + CLI tests</tspan></text><rect x="790" y="125" width="350" height="160" rx="10" fill="#26394b" stroke="#536a80"/><text x="810" y="157" fill="#ffffff" font-size="20"><tspan x="810" dy="0">TB-2  Live authority</tspan></text><text x="810" y="188" fill="#d9e2ed" font-size="17"><tspan x="810" dy="0">Epoch / unit / pending denial</tspan><tspan x="810" dy="25">Stop before disabled-state signing</tspan><tspan x="810" dy="25">Missing-key service-stop test</tspan></text><rect x="40" y="310" width="350" height="160" rx="10" fill="#26394b" stroke="#536a80"/><text x="60" y="342" fill="#ffffff" font-size="20"><tspan x="60" dy="0">TB-3  Supervision</tspan></text><text x="60" y="373" fill="#d9e2ed" font-size="17"><tspan x="60" dy="0">Selected controller authentication</tspan><tspan x="60" dy="25">Invalid peers retried within deadline</tspan><tspan x="60" dy="25">Cgroups + bounded queues</tspan></text><rect x="415" y="310" width="350" height="160" rx="10" fill="#26394b" stroke="#536a80"/><text x="435" y="342" fill="#ffffff" font-size="20"><tspan x="435" dy="0">TB-4  Worker sandbox</tspan></text><text x="435" y="373" fill="#d9e2ed" font-size="17"><tspan x="435" dy="0">Namespaces / Landlock / seccomp</tspan><tspan x="435" dy="25">Only descriptor-selected resources</tspan><tspan x="435" dy="25">Residual: kernel + DRM ioctls</tspan></text><rect x="790" y="310" width="350" height="160" rx="10" fill="#26394b" stroke="#536a80"/><text x="810" y="342" fill="#ffffff" font-size="20"><tspan x="810" dy="0">TB-5  Broker</tspan></text><text x="810" y="373" fill="#d9e2ed" font-size="17"><tspan x="810" dy="0">Peer checks + typed records</tspan><tspan x="810" dy="25">Per-kind budgets + live rechecks</tspan><tspan x="810" dy="25">Real requests + decoder tests</tspan></text><rect x="40" y="495" width="350" height="160" rx="10" fill="#26394b" stroke="#536a80"/><text x="60" y="527" fill="#ffffff" font-size="20"><tspan x="60" dy="0">TB-6  Host input / graphics</tspan></text><text x="60" y="558" fill="#d9e2ed" font-size="17"><tspan x="60" dy="0">Slots + authorized own panel</tspan><tspan x="60" dy="25">Roaming pixels ≠ pointer ≠ keys</tspan><tspan x="60" dy="25">Residual: Wayland + Qt parsing</tspan></text><rect x="415" y="495" width="350" height="160" rx="10" fill="#26394b" stroke="#536a80"/><text x="435" y="527" fill="#ffffff" font-size="20"><tspan x="435" dy="0">TB-7  Mediated services</tspan></text><text x="435" y="558" fill="#d9e2ed" font-size="17"><tspan x="435" dy="0">MPRIS selected read/control calls</tspan><tspan x="435" dy="25">Separate audio / network grants</tspan><tspan x="435" dy="25">Independent opt-in test suites</tspan></text><rect x="790" y="495" width="350" height="160" rx="10" fill="#26394b" stroke="#536a80"/><text x="810" y="527" fill="#ffffff" font-size="20"><tspan x="810" dy="0">TB-8  Host effects</tspan></text><text x="810" y="558" fill="#d9e2ed" font-size="17"><tspan x="810" dy="0">Complete selected argv leaves</tspan><tspan x="810" dy="25">Sealed DATA read-only file inputs</tspan><tspan x="810" dy="25">Residual: approved CLI semantics</tspan></text><text x="40" y="718" fill="#e6b277" font-size="17"><tspan x="40" dy="0">Current evidence: review-regressions.md and pen-test/findings.md.</tspan><tspan x="40" dy="25">Open release work: native distribution, transactional startup and installed / physical acceptance.</tspan></text></g>
</svg>
