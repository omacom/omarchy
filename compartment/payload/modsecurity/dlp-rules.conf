# dlp-rules.conf — ModSecurity rules for the context firewall.
# Deterministic signature matching on OUR secrets only (keys, seeds, PII
# denylist). No semantic injection detection — that class of defense is
# unreliable per 2026 literature; containment comes from the sandbox.
#
# Deploy: include from /etc/nginx/modsec/main.conf after the CRS base.

# BIP39 seed phrases — heuristic only: 18+ consecutive lowercase words is
# seed-shaped but also matches prose, so this LOGS (audit) without blocking.
# Real seed protection = literal strings in pii-denylist.txt.
SecRule REQUEST_BODY "@rx (?:[a-z]{3,9} ){17,}[a-z]{3,9}" \
    "id:8000001,phase:2,log,auditlog,pass,\
    msg:'DLP: seed-phrase-shaped run in model context (advisory)',tag:'dlp',severity:'4'"

# Private key material
SecRule REQUEST_BODY "@rx (?i)(BEGIN [A-Z ]*PRIVATE KEY|xprv[1-9A-HJ-NP-Za-km-z]{20,}|0x[0-9a-fA-F]{64})" \
    "id:8000002,phase:2,deny,status:403,log,auditlog,\
    msg:'DLP: private-key material in model context',tag:'dlp',severity:'2'"

# SSH private keys / age keys / common secret formats
SecRule REQUEST_BODY "@rx (?i)(-----BEGIN OPENSSH PRIVATE|AGE-SECRET-KEY-[0-9A-Z]+|aws_secret_access_key)" \
    "id:8000003,phase:2,deny,status:403,log,auditlog,\
    msg:'DLP: secret-format match in model context',tag:'dlp',severity:'2'"

# User PII denylist — literal strings maintained per-VM (root-owned 0600,
# generated from the host-side personal denylist at provision time)
SecRule REQUEST_BODY "@pmFromFile /etc/modsecurity/dlp/pii-denylist.txt" \
    "id:8000010,phase:2,deny,status:403,log,auditlog,\
    msg:'DLP: denylisted PII string in model context',tag:'dlp',severity:'2'"

# Canarytoken contents — any canary string reaching the model means the
# agent read a honeypot file
SecRule REQUEST_BODY "@pmFromFile /etc/modsecurity/dlp/canary-sigs.txt" \
    "id:8000020,phase:2,deny,status:403,log,auditlog,\
    msg:'CANARY: honeypot content reached model context',tag:'canary',severity:'1'"
