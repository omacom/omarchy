# /etc/apache2/conf-available/context-firewall.conf
# Apache + mod_security2 as the DLP revproxy 127.0.0.1:8081 -> llama :8080
Listen 127.0.0.1:8081

<IfModule mod_security2.c>
    SecRuleEngine On
    SecRequestBodyAccess On
    SecResponseBodyAccess Off
    SecAuditEngine RelevantOnly
    SecAuditLog /var/log/apache2/modsec-audit.log
    Include /etc/modsecurity/dlp/dlp-rules.conf
</IfModule>

<VirtualHost 127.0.0.1:8081>
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8080/ nocanon
    ProxyPassReverse / http://127.0.0.1:8080/
    ProxyTimeout 600
    # SSE/streaming passthrough
    SetEnv proxy-sendchunked 1
</VirtualHost>
