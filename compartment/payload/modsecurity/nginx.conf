# nginx revproxy: context firewall 127.0.0.1:8081 -> llama-server 127.0.0.1:8080
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /run/nginx-fw.pid;

events { worker_connections 128; }

http {
    include /etc/nginx/mime.types;
    modsecurity on;
    modsecurity_rules_file /etc/modsecurity/dlp-rules.conf;

    # generous timeouts: LLM requests are long
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    client_max_body_size 64m;

    server {
        listen 127.0.0.1:8081;
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;      # stream SSE through
            proxy_cache off;
        }
    }
}
