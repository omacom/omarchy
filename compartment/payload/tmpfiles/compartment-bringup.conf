# Bring up the first-boot provisioner: virt-customize uploads cannot create
# systemd wants symlinks, so tmpfiles (always enabled) links the unit in.
d /etc/systemd/system/multi-user.target.wants 0755 root root -
L /etc/systemd/system/multi-user.target.wants/bootstrap-firstboot.service - - - - /etc/systemd/system/bootstrap-firstboot.service
