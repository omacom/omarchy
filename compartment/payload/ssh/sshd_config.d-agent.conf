# /etc/ssh/sshd_config.d/50-agent.conf — in-VM sshd hardening for coordinator
PasswordAuthentication no
PermitRootLogin no
AllowUsers agent

# forced command lives in authorized_keys; these constrain what the key
# can do even if command= is bypassed or tunnel requests arrive:
AllowTcpForwarding local
PermitOpen 127.0.0.1:8765        # only the hermes backend port forwards
X11Forwarding no
AllowAgentForwarding no
PermitTunnel no
GatewayPorts no
MaxSessions 8
