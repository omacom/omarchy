# /etc/usbguard/rules.d/ — deploy AFTER whitelisting current devices.
# Generate baseline: usbguard generate-policy > /etc/usbguard/rules.conf
# Policy: allow present devices, block everything new by default.
# Install usbguard, then run:
#   sudo usbguard generate-policy | sudo tee /etc/usbguard/rules.conf
#   sudo systemctl enable --now usbguard
# New devices then require: sudo usbguard allow-device <id>
