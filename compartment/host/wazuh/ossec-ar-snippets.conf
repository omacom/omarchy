# ossec-ar-snippets.conf — wazuh-agent config additions for the host.
# Merge into /var/ossec/etc/ossec.conf once wazuh-agent is installed on the host.

# command: define host-seal as an active-response command
<command>
  <name>compartment-seal</name>
  <executable>host-seal.sh</executable>
  <timeout_allowed>no</timeout_allowed>
</command>

# active-response: fire seal on high-severity compartment alerts
<active-response>
  <command>compartment-seal</command>
  <location>local</location>
  <level>12</level>
  <rules_group>compartment,authentication_failures,rootcheck,canary</rules_group>
  <timeout>0</timeout>
</active-response>

# file-integrity watch on compartment artifacts
<syscheck>
  <directories check_all="yes" report_changes="yes">/var/lib/libvirt/images/whonix</directories>
  <directories check_all="yes">__COMPARTMENT__/payload</directories>
  <directories check_all="yes">__HOME__/.config/vmctl</directories>
</syscheck>
