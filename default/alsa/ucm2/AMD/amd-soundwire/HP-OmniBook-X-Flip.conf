# HP OmniBook X Flip 16-cc0xxx (board 8EA2): dual TI TAS2783 speaker amps,
# Realtek RT712 headset jack and internal DMICs on AMD SoundWire. The kernel
# reports "spk:tas2783 hs:rt712 mic:rt712", and alsa-ucm-conf 1.2.16.1 has no
# sof-soundwire/tas2783.conf, so the generic amd-soundwire profile fails to load
# and the card offers no speaker or microphone. Upstream added TAS2783 in
# 182d0122a7 (after 1.2.16.1); drop this override once an alsa-ucm-conf with it
# ships. It lives under its own name so it never collides with that package.

Syntax 8

Define {
	SpeakerCodec1 "tas2783"
	HeadsetCodec1 "rt712"
	MicCodec1 "rt712"
}

SectionUseCase."HiFi" {
	File "/AMD/amd-soundwire/HP-OmniBook-X-Flip-HiFi.conf"
	Comment "Play HiFi quality Music"
}

Include.led.File "/common/ctl/led.conf"
Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.rt712-init.File "/codecs/rt712/init.conf"

# Stock rt712/init.conf sets internal DMIC capture gain (FU1E) to 47 (+18 dB),
# which clips normal speech on this board. Unity gain (23 / 0 dB) with 0 dB
# boost records cleanly.
BootSequence [
	cset "name='rt712 FU1E Capture Volume' 23"
	cset "name='rt712 FU15 Boost Volume' 0"
]
