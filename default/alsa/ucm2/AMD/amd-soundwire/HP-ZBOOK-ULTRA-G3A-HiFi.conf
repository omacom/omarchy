SectionVerb {
	EnableSequence [
		disdevall ""
	]

	Value.TQ "HiFi"
}

# Headphones, headset microphone and the internal microphones on the RT712.
Include.rt712.File "/sof-soundwire/rt712.conf"

SectionDevice."Speaker" {
	Comment "Speaker"

	# The amps come up at 12 of 20 on their analog gain (17 of 21 dB), which
	# leaves the speakers quiet even at full volume. The amps' own speaker
	# protection runs in the firmware they load, so take them to full gain
	# each time the speaker opens, after that firmware is in.
	EnableSequence [
		cset "name='tas2783-1 Amp Volume' 20"
		cset "name='tas2783-2 Amp Volume' 20"
		cset "name='tas2783-3 Amp Volume' 20"
		cset "name='tas2783-4 Amp Volume' 20"
		cset "name='Left Spk Switch' on"
		cset "name='Right Spk Switch' on"
		cset "name='Left Spk2 Switch' on"
		cset "name='Right Spk2 Switch' on"
	]

	DisableSequence [
		cset "name='Left Spk Switch' off"
		cset "name='Right Spk Switch' off"
		cset "name='Left Spk2 Switch' off"
		cset "name='Right Spk2 Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},2"
	}
}
