SectionVerb {
	EnableSequence [
		disdevall ""
	]

	Value.TQ "HiFi"
}

# Headphones, headset microphone and internal DMICs on the RT712.
Include.rt712.File "/sof-soundwire/rt712.conf"

# Stock rt712.conf toggles rt712 FU0F Capture Switch but omits the board's
# Headset Mic Switch.
SectionDevice."Headset" {
	EnableSequence [
		cset "name='Headset Mic Switch' on"
		cset "name='rt712 FU0F Capture Switch' on"
	]

	DisableSequence [
		cset "name='Headset Mic Switch' off"
		cset "name='rt712 FU0F Capture Switch' off"
	]
}

SectionDevice."Speaker" {
	Comment "Speaker"

	EnableSequence [
		cset "name='Left Spk Switch' on"
		cset "name='Right Spk Switch' on"
	]

	DisableSequence [
		cset "name='Left Spk Switch' off"
		cset "name='Right Spk Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},2"
	}
}
