# Use case Configuration for the mt8901-soundwire card

SectionVerb {
	EnableSequence [
		disdevall ""

		# The AFE interconnect and the SoundWire data ports are fixed by the
		# board's firmware DP allocation:
		#   DL0 -> PDI2 -> DP2 -> rt1320 amps
		#   DL1 -> PDI5 -> DP5 -> rt713 headphone
		#   rt713 DP8 (DP13) -> PDI8 -> UL0 (internal microphones)
		#   rt713 DP4 (DP12) -> PDI7 -> UL1 (headset microphone)
		cset "name='O150 I032 Switch' on"
		cset "name='O151 I033 Switch' on"
		cset "name='PDI2 Demux' DP2"

		cset "name='O156 I034 Switch' on"
		cset "name='O157 I035 Switch' on"
		cset "name='PDI5 Demux' DP5"

		cset "name='PDI8 Mux' DP13"
		cset "name='O018 I170 Switch' on"
		cset "name='O019 I171 Switch' on"

		cset "name='PDI7 Mux' DP12"
		cset "name='O020 I168 Switch' on"
		cset "name='O021 I169 Switch' on"
	]

	Value.TQ "HiFi"
}

SectionDevice."Speaker" {
	Comment "Speaker"

	EnableSequence [
		cset "name='rt1320-1 RX Channel Select' L,L"
		cset "name='rt1320-2 RX Channel Select' R,R"
		cset "name='rt1320-1 OT23 L Switch' 1"
		cset "name='rt1320-1 OT23 R Switch' 1"
		cset "name='rt1320-2 OT23 L Switch' 1"
		cset "name='rt1320-2 OT23 R Switch' 1"
		cset "name='Speaker Switch' on"
	]

	DisableSequence [
		cset "name='Speaker Switch' off"
		cset "name='rt1320-1 OT23 L Switch' 0"
		cset "name='rt1320-1 OT23 R Switch' 0"
		cset "name='rt1320-2 OT23 L Switch' 0"
		cset "name='rt1320-2 OT23 R Switch' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "${var:SpeakerMixerElem}"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	EnableSequence [
		cset "name='Headphone Switch' on"
	]

	DisableSequence [
		cset "name='Headphone Switch' off"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "rt713 FU05"
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic" {
	Comment "Microphones"

	EnableSequence [
		cset "name='rt713 FU1E Capture Switch' 1"
	]

	DisableSequence [
		cset "name='rt713 FU1E Capture Switch' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},7"
		CaptureMixer "default:${CardId}"
		CaptureMixerElem "rt713 FU1E"
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"

	EnableSequence [
		cset "name='Headset Mic Switch' on"
		cset "name='rt713 FU0F Capture Switch' 1"
	]

	DisableSequence [
		cset "name='rt713 FU0F Capture Switch' 0"
		cset "name='Headset Mic Switch' off"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},8"
		CaptureMixer "default:${CardId}"
		CaptureMixerElem "rt713 FU0F"
		JackControl "Headset Mic Jack"
	}
}
