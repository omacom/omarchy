Syntax 8

# Dell XPS 16 DX16263 (NVIDIA N1x): MediaTek MT8901 SoundWire card with two
# rt1320 speaker amplifiers on link 0, and an rt713 on link 1 for the headset
# jack and the internal microphones.

SectionUseCase."HiFi" {
	File "/Omarchy/dell-xps16-n1x/HiFi.conf"
	Comment "Play HiFi quality Music"
}

Include.led.File "/common/ctl/led.conf"
Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"

Define.SpeakerAmps1 "0"

DefineRegex.SpeakerAmps {
	Regex "cfg-amp:([0-9]+)"
	String "${CardComponents}"
}

Define.SpeakerAmps "${var:SpeakerAmps1}"
Define.SpeakerCodec1 "rt1320"
Define.MicCodec1 "rt713"

Include.spk.File "/codecs/rt1320/init.conf"
Include.hs.File "/codecs/rt713/init.conf"
