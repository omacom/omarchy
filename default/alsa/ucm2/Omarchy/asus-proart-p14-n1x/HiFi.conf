# Use case Configuration for the mt8901-soundwire card

SectionVerb {
	EnableSequence [
		disdevall ""

		# The AFE interconnect and the SoundWire data ports are fixed by the
		# board's firmware DP allocation:
		#   DL0 -> PDI2 -> DP3 -> cs35l56 amps
		#   DL1 -> PDI5 -> DP5 -> cs42l43 headphone
		#   cs42l43 DP1 (DP7) -> PDI8 -> UL0 (internal microphones)
		#   cs42l43 DP2 (DP8) -> PDI7 -> UL1 (headset microphone)
		cset "name='O150 I032 Switch' on"
		cset "name='O151 I033 Switch' on"
		cset "name='PDI2 Demux' DP3"

		cset "name='O156 I034 Switch' on"
		cset "name='O157 I035 Switch' on"
		cset "name='PDI5 Demux' DP5"

		cset "name='PDI8 Mux' DP7"
		cset "name='O018 I170 Switch' on"
		cset "name='O019 I171 Switch' on"

		cset "name='PDI7 Mux' DP8"
		cset "name='O020 I168 Switch' on"
		cset "name='O021 I169 Switch' on"
	]

	Value.TQ "HiFi"
}

SectionDevice."Speaker" {
	Comment "Speaker"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "cs35l56 Speaker"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	EnableSequence [
		cset "name='cs42l43 Headphone L Input 1' 'DP5RX1'"
		cset "name='cs42l43 Headphone R Input 1' 'DP5RX2'"
	]

	DisableSequence [
		cset "name='cs42l43 Headphone L Input 1' 'None'"
		cset "name='cs42l43 Headphone R Input 1' 'None'"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackVolume "cs42l43 Headphone Digital Volume"
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic" {
	Comment "Microphones"

	ConflictingDevice [
		"Headset"
	]

	EnableSequence [
		cset "name='cs42l43 DP1TX1 Input' 'Decimator 3'"
		cset "name='cs42l43 DP1TX2 Input' 'Decimator 4'"
	]

	DisableSequence [
		cset "name='cs42l43 DP1TX1 Input' 'None'"
		cset "name='cs42l43 DP1TX2 Input' 'None'"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},7"
		CaptureMixer "default:${CardId}"
		CaptureMixerElem "cs42l43 Microphone"
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"

	EnableSequence [
		cset "name='cs42l43 ADC1 Input' 'IN1'"
		cset "name='cs42l43 Decimator 1 Mode' 'ADC'"
		cset "name='cs42l43 DP2TX1 Input' 'Decimator 1'"
		cset "name='cs42l43 DP2TX2 Input' 'Decimator 1'"
	]

	DisableSequence [
		cset "name='cs42l43 DP2TX1 Input' 'None'"
		cset "name='cs42l43 DP2TX2 Input' 'None'"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},8"
		CaptureMixer "default:${CardId}"
		CaptureMixerElem "cs42l43 Headset Microphone"
		JackControl "Headset Mic Jack"
	}
}
