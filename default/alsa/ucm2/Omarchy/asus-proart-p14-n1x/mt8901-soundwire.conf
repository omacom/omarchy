Syntax 8

# ASUS ProArt P14 H7407BA (NVIDIA N1x): MediaTek MT8901 SoundWire card with a
# cs42l43 headset/microphone codec and two cs35l56 speaker amplifiers.

SectionUseCase."HiFi" {
	File "/Omarchy/asus-proart-p14-n1x/HiFi.conf"
	Comment "Play HiFi quality Music"
}

Include.led.File "/common/ctl/led.conf"
Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"

Define.SpeakerAmps1 "0"

DefineRegex.SpeakerAmps {
	Regex "cfg-amp:([0-9]+)"
	String "${CardComponents}"
}

Define.SpeakerAmps "${var:SpeakerAmps1}"

Include.spk.File "/codecs/cs35l56/init.conf"
Include.hs.File "/codecs/cs42l43/init.conf"
Include.mic.File "/codecs/cs42l43-dmic/init.conf"
