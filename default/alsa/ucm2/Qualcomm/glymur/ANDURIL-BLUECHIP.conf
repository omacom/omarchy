Syntax 4

# Anduril BlueChip (Snapdragon X2, Glymur): the left WSA8845 woofer and
# tweeter and four digital microphones. The right pair never attaches on this
# board, so linux-omarchy-aarch64 7.3-27 links the left pair alone; with the
# CRD's four-amplifier link every stream fails. alsa-ucm-conf's glymur.conf
# picks a profile by DMI and has none for this board, so PipeWire offered only
# a dummy output. The card's long name carries the BIOS version (V0.04), so a
# firmware update needs another link in conf.d/glymur.

SectionUseCase."HiFi" {
	File "/Qualcomm/glymur/ANDURIL-BLUECHIP-HiFi.conf"
	Comment "HiFi quality Music."
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wsam-init.File "/codecs/qcom-lpass/wsa-macro/two-speakers/init.conf"

LibraryConfig.remap.Config {
	ctl.default.map {
		"name='Speakers Volume'" {
			"name='WooferLeft PA Volume'".vindex.0 0
			"name='TweeterLeft PA Volume'".vindex.1 0
		}
	}
}
