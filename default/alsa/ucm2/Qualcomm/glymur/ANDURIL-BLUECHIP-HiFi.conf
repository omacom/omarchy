SectionVerb {
	EnableSequence [
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 1"
	]

	Include.wsm1e.File "/codecs/qcom-lpass/wsa-macro/Wsa1SpeakerEnableSeq.conf"

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	Include.wsmspk1e.File "/codecs/qcom-lpass/wsa-macro/Wsa1SpeakerEnableSeq.conf"
	Include.wsmspk1d.File "/codecs/qcom-lpass/wsa-macro/Wsa1SpeakerDisableSeq.conf"

	EnableSequence [
		cset "name='WooferLeft COMP Switch' 1"
		cset "name='WooferLeft BOOST Switch' 1"
		cset "name='WooferLeft DAC Switch' 1"
		cset "name='WooferLeft PBR Switch' 1"
		cset "name='WooferLeft VISENSE Switch' 0"
		cset "name='WooferLeft WSA MODE' 0"
		cset "name='WooferLeft PA Volume' 6"
		cset "name='TweeterLeft COMP Switch' 1"
		cset "name='TweeterLeft BOOST Switch' 1"
		cset "name='TweeterLeft DAC Switch' 1"
		cset "name='TweeterLeft PBR Switch' 1"
		cset "name='TweeterLeft VISENSE Switch' 0"
		cset "name='TweeterLeft WSA MODE' 0"
		cset "name='TweeterLeft PA Volume' 6"
	]

	DisableSequence [
		cset "name='WooferLeft COMP Switch' 0"
		cset "name='WooferLeft BOOST Switch' 0"
		cset "name='WooferLeft DAC Switch' 0"
		cset "name='WooferLeft PBR Switch' 0"
		cset "name='TweeterLeft COMP Switch' 0"
		cset "name='TweeterLeft BOOST Switch' 0"
		cset "name='TweeterLeft DAC Switch' 0"
		cset "name='TweeterLeft PBR Switch' 0"
	]

	# The machine driver fixes the WSA link at four channels. The woofer
	# takes the first and the tweeter the second, so stereo plays on the
	# left pair; the last two have no amplifier until the right pair works.
	Value {
		PlaybackChannels 4
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "Speakers"
	}
}

SectionDevice."Mic" {
	Comment "Internal microphones"

	Include.vadm0e.File "/codecs/qcom-lpass/va-macro/DMIC0EnableSeq.conf"
	Include.vadm0d.File "/codecs/qcom-lpass/va-macro/DMIC0DisableSeq.conf"
	Include.vadm1e.File "/codecs/qcom-lpass/va-macro/DMIC1EnableSeq.conf"
	Include.vadm1d.File "/codecs/qcom-lpass/va-macro/DMIC1DisableSeq.conf"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
	}
}
