Syntax 4

SectionVerb {
  Value.TQ "HiFi"
}

If.hdmi1 {
  Condition {
    Type ControlExists
    Control "iface=CARD,name='HDMI/DP,pcm=0 Jack'"
  }
  True.SectionDevice."HDMI1" {
    Comment "HDMI / DisplayPort 1 Output"

    Value {
      PlaybackPriority 1100
      PlaybackPCM "hw:${CardId},0"
      JackControl "HDMI/DP,pcm=0 Jack"
    }
  }
}

