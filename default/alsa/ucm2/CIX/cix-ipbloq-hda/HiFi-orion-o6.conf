Syntax 4

SectionVerb {
  EnableSequence [
    disdevall ""
  ]

  Value.TQ "HiFi"
}

SectionDevice."Speaker" {
  Comment "Speaker"

  ConflictingDevice [
    "Headphones"
    "Line"
  ]

  EnableSequence [
    cset "name='Speaker Playback Switch' on"
  ]

  DisableSequence [
    cset "name='Speaker Playback Switch' off"
  ]

  Value {
    PlaybackPriority 100
    PlaybackPCM "hw:${CardId},0"
    PlaybackMixerElem "Speaker"
    PlaybackMasterElem "Master"
    PlaybackVolume "Speaker Playback Volume"
    PlaybackSwitch "Speaker Playback Switch"
  }
}

SectionDevice."Line" {
  Comment "Line Output"

  ConflictingDevice [
    "Speaker"
    "Headphones"
  ]

  EnableSequence [
    cset "name='Line Out Playback Switch' on"
  ]

  DisableSequence [
    cset "name='Line Out Playback Switch' off"
  ]

  Value {
    PlaybackPriority 500
    PlaybackPCM "hw:${CardId},0"
    PlaybackMixerElem "Headphone+LO"
    PlaybackMasterElem "Master"
    PlaybackVolume "Headphone+LO Playback Volume"
    PlaybackSwitch "Line Out Playback Switch"
    JackControl "Front Line Out Jack"
  }
}

SectionDevice."Headphones" {
  Comment "Headphones"

  ConflictingDevice [
    "Speaker"
    "Line"
  ]

  EnableSequence [
    cset "name='Headphone Playback Switch' on"
  ]

  DisableSequence [
    cset "name='Headphone Playback Switch' off"
  ]

  Value {
    PlaybackPriority 2000
    PlaybackPCM "hw:${CardId},0"
    PlaybackMixerElem "Headphone+LO"
    PlaybackMasterElem "Master"
    PlaybackVolume "Headphone+LO Playback Volume"
    PlaybackSwitch "Headphone Playback Switch"
    JackControl "Headphone Jack"
  }
}

SectionDevice."Mic1" {
  Comment "Headset Microphone"

  EnableSequence [
    cset "name='Input Source' 'Rear Mic'"
    cset "name='Capture Switch' on"
  ]

  DisableSequence [
    cset "name='Capture Switch' off"
  ]

  Value {
    CapturePriority 300
    CapturePCM "hw:${CardId},0"
    CaptureMixerElem "Capture"
    CaptureMasterElem "Rear Mic Boost"
    CaptureVolume "Capture Volume"
    CaptureSwitch "Capture Switch"
    JackControl "Rear Mic Jack"
  }
}

SectionDevice."Mic2" {
  Comment "Front Microphone"

  EnableSequence [
    cset "name='Input Source',index=1 'Front Mic'"
    cset "name='Capture Switch',index=1 on"
  ]

  DisableSequence [
    cset "name='Capture Switch',index=1 off"
  ]

  Value {
    CapturePriority 200
    CapturePCM "hw:${CardId},2"
    CaptureMixerElem "Capture,1"
    CaptureMasterElem "Front Mic Boost"
    CaptureVolume "Capture Volume,1"
    CaptureSwitch "Capture Switch,1"
    JackControl "Front Mic Jack"
  }
}
