# SPDX-License-Identifier: BSD-3-Clause

Syntax 4
Comment "CIX Sky1 HDA Analog Audio"

If.orion {
  Condition {
    Type RegexMatch
    Regex "^CIX SKY1 ORION O6"
    String "${CardName}"
  }
  True {
    SectionUseCase."HiFi" {
      File "/CIX/cix-ipbloq-hda/HiFi-orion-o6.conf"
      Comment "Play HiFi quality Music"
    }

    BootSequence [
      cset "name='Auto-Mute Mode' 'Disabled'"
      cset "name='Master Playback Volume' 80%"
      cset "name='Master Playback Switch' on"
      cset "name='Headphone+LO Playback Volume' 80%"
      cset "name='Headphone Playback Switch' off"
      cset "name='Line Out Playback Switch' off"
      cset "name='Speaker Playback Volume' 80%"
      cset "name='Speaker Playback Switch' off"
      cset "name='Capture Volume' 80%"
      cset "name='Capture Switch' off"
      cset "name='Capture Volume',index=1 80%"
      cset "name='Capture Switch',index=1 off"
      cset "name='Rear Mic Boost Volume' 2"
      cset "name='Front Mic Boost Volume' 2"
    ]

    Include.card-init.File "/lib/card-init.conf"
  }
}
