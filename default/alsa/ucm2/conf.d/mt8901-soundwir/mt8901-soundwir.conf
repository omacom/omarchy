Syntax 8

# NVIDIA N1x MediaTek MT8901 SoundWire cards without a profile linked by their
# full long name. Dell's long name ends in the DMI product version, which Dell
# sets to the BIOS version, so its boards are matched by name prefix instead.

Define.Done ""

If.dell_xps16 {
	Condition {
		Type RegexMatch
		Regex "DellInc\\.-XPS16DX16263-.*"
		String "${CardLongName}"
	}
	True {
		Define.Done y
		Include.board.File "/Omarchy/dell-xps16-n1x/mt8901-soundwire.conf"
	}
}

If.err {
	Condition {
		Type String
		Empty "${var:Done}"
	}
	True.Error "UCM is not supported for this MT8901 board (${CardLongName})"
}
