#
# RTX Spark board with 2x RT1321 on link 0 and RT713 on link 1.
# PCMs: 0=speakers 1=jack 8=UL1 capture (internal DMICs via RT713 FU1E).
# Speakers, jack and internal microphones board-validated by acoustic
# loopback. Note: the RT1321 output unmute latches only while a stream
# is running, so the amplifier unmutes take effect once playback starts.
# Headset capture (jack microphone) is not declared on this platform.

SectionVerb {
	EnableSequence [
		cset "name='O150 I032 Switch' 1"
		cset "name='O151 I033 Switch' 1"
		cset "name='PDI2 Demux' DP2"
		cset "name='O156 I034 Switch' 1"
		cset "name='O157 I035 Switch' 1"
		cset "name='PDI5 Demux' DP5"
		cset "name='PDI13 Mux' DP13"
		cset "name='O020 I180 Switch' 1"
		cset "name='O021 I181 Switch' 1"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Internal speakers"
	EnableSequence [
		cset "name='rt1320-1 OT23 L Switch' 1"
		cset "name='rt1320-1 OT23 R Switch' 1"
		cset "name='rt1320-2 OT23 L Switch' 1"
		cset "name='rt1320-2 OT23 R Switch' 1"
		cset "name='rt1320-1 FU21 Playback Volume' 87,87"
		cset "name='rt1320-2 FU21 Playback Volume' 87,87"
	]
	DisableSequence [
		cset "name='rt1320-1 OT23 L Switch' 0"
		cset "name='rt1320-1 OT23 R Switch' 0"
		cset "name='rt1320-2 OT23 L Switch' 0"
		cset "name='rt1320-2 OT23 R Switch' 0"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Headphones" {
	Comment "Headphone jack"
	EnableSequence [
		cset "name='Headphone Switch' 1"
		cset "name='rt713 FU05 Playback Switch' 1"
		cset "name='rt713 FU05 Playback Volume' 87,87"
	]
	DisableSequence [
		cset "name='rt713 FU05 Playback Switch' 0"
		cset "name='Headphone Switch' 0"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackChannels 2
		PlaybackMixerElem "rt713 FU05"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Mic" {
	Comment "Internal microphone array"
	EnableSequence [
		cset "name='rt713 FU1E Capture Switch' 1"
		cset "name='rt713 FU1E Capture Volume' 63,63,63,63"
	]
	DisableSequence [
		cset "name='rt713 FU1E Capture Switch' 0"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},8"
		CaptureChannels 2
	}
}
