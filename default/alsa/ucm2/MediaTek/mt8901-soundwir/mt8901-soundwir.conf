Syntax 4
Comment "NVIDIA RTX Spark MT8901 SoundWire audio"

# Dispatch by codec topology. The card exposes no component string, so the
# board is identified by which SoundWire peripherals enumerated, through the
# sysfs device names the SoundWire core creates:
#   /sys/bus/soundwire/devices/sdw:<bus>:<link>:<mfg>:<part>:<class>:<uid>
# Cirrus mfg 0x01fa (CS42L43 0x4243, CS35L56 0x3556), Realtek mfg 0x025d
# (RT712 0x0712, RT713 0x0713, RT1320 0x1320, RT1321 0x1321). The core adds
# the unique id only when several peripherals share manufacturer and part
# on the bus, so single codecs have no trailing field. One peripheral that
# exists only on that topology selects each profile. Profiles are named by
# codec topology.
# RT713 jack codec on link 1: 2x RT1321 (link 0) + RT713
If.rt1321x2_rt713 {
	Condition {
		Type Path
		Mode exist
		Path "/sys/bus/soundwire/devices/sdw:0:1:025d:0713:01"
	}
	True {
		SectionUseCase."HiFi" {
			File "/MediaTek/mt8901-soundwir/HiFi-rt1321x2-rt713.conf"
			Comment "Play HiFi quality music"
		}
	}
}
# RT1320 unique id 2 on link 0: the reference board (amps at uid 0 and 2)
If.rt1320x2_rt712_refboard {
	Condition {
		Type Path
		Mode exist
		Path "/sys/bus/soundwire/devices/sdw:0:0:025d:1320:01:2"
	}
	True {
		SectionUseCase."HiFi" {
			File "/MediaTek/mt8901-soundwir/HiFi-rt1320x2-rt712-refboard.conf"
			Comment "Play HiFi quality music"
		}
	}
}
# RT1320 unique id 1 on link 0: 2x RT1320 (uid 0,1) + RT712
If.rt1320x2_rt712 {
	Condition {
		Type Path
		Mode exist
		Path "/sys/bus/soundwire/devices/sdw:0:0:025d:1320:01:1"
	}
	True {
		SectionUseCase."HiFi" {
			File "/MediaTek/mt8901-soundwir/HiFi-rt1320x2-rt712.conf"
			Comment "Play HiFi quality music"
		}
	}
}
# CS35L56 on link 0: 4x CS35L56 (link 0) + CS42L43 (link 1)
If.cs35l56x4_cs42l43 {
	Condition {
		Type Path
		Mode exist
		Path "/sys/bus/soundwire/devices/sdw:0:0:01fa:3556:01:0"
	}
	True {
		SectionUseCase."HiFi" {
			File "/MediaTek/mt8901-soundwir/HiFi-cs35l56x4-cs42l43.conf"
			Comment "Play HiFi quality music"
		}
	}
}
# a CS35L56 beyond the first two on link 1 (this board numbers its amplifiers
# 0, 1, 4, 5): CS42L43 + 4x CS35L56, all on link 1
If.cs42l43_cs35l56x4 {
	Condition {
		Type Path
		Mode exist
		Path "/sys/bus/soundwire/devices/sdw:0:1:01fa:3556:01:4"
	}
	True {
		SectionUseCase."HiFi" {
			File "/MediaTek/mt8901-soundwir/HiFi-cs42l43-cs35l56x4.conf"
			Comment "Play HiFi quality music"
		}
	}
}
# otherwise a CS42L43 on link 1: CS42L43 + 2x CS35L56, all on link 1
If.cs42l43_cs35l56x2 {
	Condition {
		Type Path
		Mode exist
		Path "/sys/bus/soundwire/devices/sdw:0:1:01fa:4243:01"
	}
	True {
		SectionUseCase."HiFi" {
			File "/MediaTek/mt8901-soundwir/HiFi-cs42l43-cs35l56x2.conf"
			Comment "Play HiFi quality music"
		}
	}
}
