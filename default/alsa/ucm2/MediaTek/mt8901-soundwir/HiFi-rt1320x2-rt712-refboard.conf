#
# RTX Spark reference board, Realtek audio board (2x RT1320 uid
# 0x30/0x32 on link 0 + RT712 on link 1). PCMs: 0=speakers 1=jack
# 8=UL1 capture. Speakers, headphone jack and capture board-validated.

SectionVerb {
	EnableSequence [
		cset "name='O150 I032 Switch' 1"
		cset "name='O151 I033 Switch' 1"
		cset "name='PDI2 Demux' DP2"
		cset "name='O156 I034 Switch' 1"
		cset "name='O157 I035 Switch' 1"
		cset "name='PDI5 Demux' DP5"
		# default capture route (internal mic): without an enabled route
		# the capture PCM fails to open at profile probe and PipeWire
		# drops the whole verb (no audio devices at all)
		cset "name='PDI13 Mux' DP13"
		cset "name='O020 I180 Switch' 1"
		cset "name='O021 I181 Switch' 1"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers (amplifier outputs; not fitted on all units)"
	EnableSequence [
		cset "name='Speaker Switch' 1"
		cset "name='rt1320-1 OT23 L Switch' 1"
		cset "name='rt1320-1 OT23 R Switch' 1"
		cset "name='rt1320-2 OT23 L Switch' 1"
		cset "name='rt1320-2 OT23 R Switch' 1"
		cset "name='rt1320-1 FU21 Playback Volume' 87,87"
		cset "name='rt1320-2 FU21 Playback Volume' 87,87"
	]
	DisableSequence [
		cset "name='rt1320-1 OT23 L Switch' 0"
		cset "name='rt1320-1 OT23 R Switch' 0"
		cset "name='rt1320-2 OT23 L Switch' 0"
		cset "name='rt1320-2 OT23 R Switch' 0"
		cset "name='Speaker Switch' 0"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Headphones" {
	Comment "Headphone jack"
	EnableSequence [
		cset "name='Headphone Switch' 1"
		cset "name='rt712 FU05 Playback Switch' 1"
		cset "name='rt712 FU05 Playback Volume' 87,87"
		cset "name='rt712 OT23 L Switch' 1"
		cset "name='rt712 OT23 R Switch' 1"
	]
	DisableSequence [
		cset "name='rt712 OT23 L Switch' 0"
		cset "name='rt712 OT23 R Switch' 0"
		cset "name='rt712 FU05 Playback Switch' 0"
		cset "name='Headphone Switch' 0"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackChannels 2
		PlaybackMixerElem "rt712 FU05"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Mic" {
	Comment "Internal microphone (rt712 SDCA DMIC)"
	ConflictingDevice [
		"Headset"
	]
	EnableSequence [
		cset "name='rt712 FU1E Capture Switch' 1"
		cset "name='rt712 FU1E Capture Volume' 63,63,63,63"
		cset "name='PDI13 Mux' DP13"
		cset "name='O020 I180 Switch' 1"
		cset "name='O021 I181 Switch' 1"
	]
	DisableSequence [
		cset "name='rt712 FU1E Capture Switch' 0"
		# hand the shared O020/O021 inputs to the Headset route: the
		# probe/switch order can run this after the other enable, and
		# leaving no route enabled breaks the capture PCM open
		cset "name='O020 I180 Switch' 0"
		cset "name='O021 I181 Switch' 0"
		cset "name='PDI12 Mux' DP12"
		cset "name='O020 I178 Switch' 1"
		cset "name='O021 I179 Switch' 1"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},8"
		CaptureChannels 2
	}
}

SectionDevice."Headset" {
	Comment "Headset microphone (jack)"
	ConflictingDevice [
		"Mic"
	]
	EnableSequence [
		cset "name='Headset Mic Switch' 1"
		cset "name='rt712 FU0F Capture Switch' 1"
		# 23 (the chip default) records ~30dB too low; board-tuned
		cset "name='rt712 FU0F Capture Volume' 58,58"
		cset "name='PDI12 Mux' DP12"
		cset "name='O020 I178 Switch' 1"
		cset "name='O021 I179 Switch' 1"
	]
	DisableSequence [
		cset "name='rt712 FU0F Capture Switch' 0"
		cset "name='Headset Mic Switch' 0"
		# hand the shared O020/O021 inputs to the Mic route (see above)
		cset "name='O020 I178 Switch' 0"
		cset "name='O021 I179 Switch' 0"
		cset "name='PDI13 Mux' DP13"
		cset "name='O020 I180 Switch' 1"
		cset "name='O021 I181 Switch' 1"
	]
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},8"
		CaptureChannels 2
		CaptureMixerElem "rt712 FU0F"
		JackControl "Headset Mic Jack"
	}
}
