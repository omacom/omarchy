#
# ASUS ProArt P14 H7407BA (SoundWire subsystem 1043:33a1).
# Based on NVIDIA's MT8901 CS42L43 + 2x CS35L56 UCM profile.
# DL0 feeds the CS35L56 pair; DL1 feeds the CS42L43 DP5 playback path.
# The two frontends share a clock. Copy stereo to both for speaker playback;
# headphones conflict with Speaker because their PCM also uses DL1.
#
# Keep the combined PCM inside UCM's private ALSA configuration.
LibraryConfig.p14.SubstiConfig {
  pcm.p14_speakers {
    type route
    slave {
      pcm {
        type multi
        slaves.cs35l56 {
          pcm { type hw card "${CardId}" device 0 rate 48000 }
          channels 2
        }
        slaves.cs42l43 {
          pcm { type hw card "${CardId}" device 1 rate 48000 }
          channels 2
        }
        bindings.0 { slave cs35l56 channel 0 }
        bindings.1 { slave cs35l56 channel 1 }
        bindings.2 { slave cs42l43 channel 0 }
        bindings.3 { slave cs42l43 channel 1 }
      }
      channels 4
      format S24_LE
    }
    ttable.0.0 1
    ttable.1.1 1
    ttable.0.2 1
    ttable.1.3 1
  }
}

SectionVerb {
  EnableSequence [
    # speakers: DL0 -> O152/O153 -> PDI3 -> DP3 -> SDW1_Playback1
    cset "name='O152 I032 Switch' 1"
    cset "name='O153 I033 Switch' 1"
    cset "name='PDI3 Demux' DP3"
    # jack: DL1 -> O156/O157 -> PDI5 -> DP5 (sdw-jack-pin kernel)
    cset "name='O156 I034 Switch' 1"
    cset "name='O157 I035 Switch' 1"
    cset "name='PDI5 Demux' DP5"
    cset "name='PDI6 Demux' DP6"
    cset "name='cs42l43 Headphone L Input 1' DP5RX1"
    cset "name='cs42l43 Headphone R Input 1' DP5RX2"
    # capture: UL1 <- O020/O021 <- PDI13 <- host DP7
    cset "name='PDI13 Mux' DP7"
    cset "name='O020 I180 Switch' 1"
    cset "name='O021 I181 Switch' 1"
  ]
  Value {
    TQ "HiFi"
  }
}

SectionDevice."Speaker" {
  Comment "Internal speakers"
  ConflictingDevice [ "Headphones" ]
  EnableSequence [
    cset "name='Speaker Switch' 1"
    cset "name='AMP1 Speaker Switch' 1"
    cset "name='AMP2 Speaker Switch' 1"
    # P14: the CS42L43 is also part of the speaker assembly.
    # Feed its speaker outputs through its hardware EQ. Coefficients
    # come from ASUS 33A1 codec configuration (offset 0xa0, 60 bytes).
    # a1_dflt_33a1_codec_cfg.bin, SHA256:
    # 4a03ddda08588a0ed50ea6aeee0fedbcc3def364f73e7c6147e27bcc1f46a5d9
    cset "name='cs42l43 Speaker Digital Switch' 0,0"
    cset "name='cs42l43 EQ Coefficients' 0x78,0xf0,0x73,0x30,0x10,0x1f,0x18,0x9f,0xb1,0x53,0x12,0x5d,0xd0,0x91,0x42,0xdb,0x78,0xf0,0x73,0x30,0x78,0xf0,0x73,0x30,0x10,0x1f,0x18,0x9f,0xb1,0x53,0x12,0x5d,0xd0,0x91,0x42,0xdb,0x78,0xf0,0x73,0x30,0x00,0x00,0x00,0x40,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00"
    cset "name='cs42l43 EQ1 Input 1' DP5RX1"
    cset "name='cs42l43 EQ2 Input 1' DP5RX2"
    cset "name='cs42l43 Speaker L Input 1' EQ1"
    cset "name='cs42l43 Speaker R Input 1' EQ2"
    cset "name='cs42l43 EQ Switch' 1,1"
    cset "name='cs42l43 Speaker Digital Volume' 104,104"
    cset "name='cs42l43 Speaker Digital Switch' 1,1"
  ]
  DisableSequence [
    cset "name='cs42l43 Speaker Digital Switch' 0,0"
    cset "name='cs42l43 Speaker L Input 1' None"
    cset "name='cs42l43 Speaker R Input 1' None"
    cset "name='cs42l43 EQ1 Input 1' None"
    cset "name='cs42l43 EQ2 Input 1' None"
    cset "name='AMP1 Speaker Switch' 0"
    cset "name='AMP2 Speaker Switch' 0"
    cset "name='Speaker Switch' 0"
  ]
  Value {
    PlaybackPriority 100
    PlaybackPCM "p14_speakers"
    PlaybackChannels 2
  }
}

SectionDevice."Headphones" {
  Comment "Headphone jack"
  ConflictingDevice [ "Speaker" ]
  EnableSequence [
    cset "name='Headphone Switch' 1"
    cset "name='cs42l43 Headphone Digital Volume' 229,229"
  ]
  DisableSequence [
    cset "name='Headphone Switch' 0"
  ]
  Value {
    PlaybackPriority 200
    PlaybackPCM "hw:${CardId},1"
    PlaybackChannels 2
    PlaybackMixerElem "cs42l43 Headphone Digital"
    JackControl "Headphone Jack"
    JackHWMute "Speaker"
  }
}

SectionDevice."Mic" {
  Comment "Internal microphone array"
  ConflictingDevice [
    "Headset"
  ]
  EnableSequence [
    cset "name='cs42l43 DP1TX1 Input' 'Decimator 3'"
    cset "name='cs42l43 DP1TX2 Input' 'Decimator 4'"
    cset "name='cs42l43 Decimator 3 Switch' 1"
    cset "name='cs42l43 Decimator 4 Switch' 1"
    cset "name='cs42l43 Decimator 3 Volume' 176"
    cset "name='cs42l43 Decimator 4 Volume' 176"
  ]
  DisableSequence [
    cset "name='cs42l43 Decimator 3 Switch' 0"
    cset "name='cs42l43 Decimator 4 Switch' 0"
    # hand the shared DP1TX inputs to the Headset device: PipeWire
    # ACP probes/switches conflicting devices in an order that can
    # run this disable after the other device's enable
    cset "name='cs42l43 DP1TX1 Input' 'Decimator 1'"
    cset "name='cs42l43 DP1TX2 Input' 'Decimator 1'"
  ]
  Value {
    CapturePriority 100
    CapturePCM "hw:${CardId},8"
    CaptureChannels 2
  }
}

SectionDevice."Headset" {
  Comment "Headset microphone (jack)"
  ConflictingDevice [
    "Mic"
  ]
  EnableSequence [
    cset "name='Headset Mic Switch' 1"
    cset "name='cs42l43 Decimator 1 Mode' ADC"
    cset "name='cs42l43 DP1TX1 Input' 'Decimator 1'"
    cset "name='cs42l43 DP1TX2 Input' 'Decimator 1'"
    cset "name='cs42l43 Decimator 1 Switch' 1"
  ]
  DisableSequence [
    cset "name='cs42l43 Decimator 1 Switch' 0"
    cset "name='Headset Mic Switch' 0"
    # hand the shared DP1TX inputs to the Mic device
    cset "name='cs42l43 DP1TX1 Input' 'Decimator 3'"
    cset "name='cs42l43 DP1TX2 Input' 'Decimator 4'"
  ]
  Value {
    CapturePriority 200
    CapturePCM "hw:${CardId},8"
    CaptureChannels 2
    JackControl "Headset Mic Jack"
  }
}
