#
# RTX Spark board with CS42L43 and 4x CS35L56, all on link 1.
# Mirrors HiFi-cs42l43-cs35l56x2.conf (same all-link1 topology, 2 amps
# -> 4), which is board-verified. On all-link1 boards the jack backend
# (SDW1_Playback0, codec DP5) is only reachable from DL0 (see that
# profile header for the full explanation), so Speaker and Headphones
# share DL0 as conflicting devices. Not yet verified on this board; the
# topology and machine entry are identical to the two-amplifier one.

SectionVerb {
	EnableSequence [
		# speakers: DL0 -> O152/O153 -> PDI3 -> DP3 -> SDW1_Playback1
		cset "name='O152 I032 Switch' 1"
		cset "name='O153 I033 Switch' 1"
		cset "name='PDI3 Demux' DP3"
		# jack: DL1 -> O156/O157 -> PDI5 -> DP5 (needs the
		# sdw-jack-pin kernel change; on older kernels this PCM
		# fails to open and PipeWire drops the whole verb)
		cset "name='O156 I034 Switch' 1"
		cset "name='O157 I035 Switch' 1"
		cset "name='PDI5 Demux' DP5"
		cset "name='PDI6 Demux' DP6"
		cset "name='cs42l43 Headphone L Input 1' DP5RX1"
		cset "name='cs42l43 Headphone R Input 1' DP5RX2"
		# capture: UL1 <- O020/O021 <- PDI13 <- host DP7
		cset "name='PDI13 Mux' DP7"
		cset "name='O020 I180 Switch' 1"
		cset "name='O021 I181 Switch' 1"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Internal speakers"
	EnableSequence [
		cset "name='Speaker Switch' 1"
		cset "name='AMP1 Speaker Switch' 1"
		cset "name='AMP2 Speaker Switch' 1"
		cset "name='AMP3 Speaker Switch' 1"
		cset "name='AMP4 Speaker Switch' 1"
	]
	DisableSequence [
		cset "name='AMP1 Speaker Switch' 0"
		cset "name='AMP2 Speaker Switch' 0"
		cset "name='AMP3 Speaker Switch' 0"
		cset "name='AMP4 Speaker Switch' 0"
		cset "name='Speaker Switch' 0"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Headphones" {
	Comment "Headphone jack"
	EnableSequence [
		cset "name='Headphone Switch' 1"
		cset "name='cs42l43 Headphone Digital Volume' 229,229"
	]
	DisableSequence [
		cset "name='Headphone Switch' 0"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackChannels 2
		PlaybackMixerElem "cs42l43 Headphone Digital"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Mic" {
	Comment "Internal microphone array"
	ConflictingDevice [
		"Headset"
	]
	EnableSequence [
		cset "name='cs42l43 DP1TX1 Input' 'Decimator 3'"
		cset "name='cs42l43 DP1TX2 Input' 'Decimator 4'"
		cset "name='cs42l43 Decimator 3 Switch' 1"
		cset "name='cs42l43 Decimator 4 Switch' 1"
		cset "name='cs42l43 Decimator 3 Volume' 176"
		cset "name='cs42l43 Decimator 4 Volume' 176"
	]
	DisableSequence [
		cset "name='cs42l43 Decimator 3 Switch' 0"
		cset "name='cs42l43 Decimator 4 Switch' 0"
		# hand the shared DP1TX inputs to the Headset device: PipeWire
		# ACP probes/switches conflicting devices in an order that can
		# run this disable after the other device's enable
		cset "name='cs42l43 DP1TX1 Input' 'Decimator 1'"
		cset "name='cs42l43 DP1TX2 Input' 'Decimator 1'"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},8"
		CaptureChannels 2
	}
}

SectionDevice."Headset" {
	Comment "Headset microphone (jack)"
	ConflictingDevice [
		"Mic"
	]
	EnableSequence [
		cset "name='Headset Mic Switch' 1"
		cset "name='cs42l43 Decimator 1 Mode' ADC"
		cset "name='cs42l43 DP1TX1 Input' 'Decimator 1'"
		cset "name='cs42l43 DP1TX2 Input' 'Decimator 1'"
		cset "name='cs42l43 Decimator 1 Switch' 1"
	]
	DisableSequence [
		cset "name='cs42l43 Decimator 1 Switch' 0"
		cset "name='Headset Mic Switch' 0"
		# hand the shared DP1TX inputs to the Mic device (see above)
		cset "name='cs42l43 DP1TX1 Input' 'Decimator 3'"
		cset "name='cs42l43 DP1TX2 Input' 'Decimator 4'"
	]
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},8"
		CaptureChannels 2
		JackControl "Headset Mic Jack"
	}
}
