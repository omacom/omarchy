# Omarchy transfer configuration.
#
# This file controls what `omarchy transfer export` puts into the archive you carry to a new install.
# Open it with Super + Space > Setup > Transfer > Export (Open Config File at the bottom), where you can also tick
# folders and options with a click.
# Preview the result at any time with `omarchy transfer export --dry-run`.
#
# Rules
# - Paths in [include] are relative to your home folder. No absolute paths and no `..`.
# - To switch an entry off, put a # directly in front of the path, like `#Pictures`.
#   A # followed by a space is an ordinary comment.
# - To add your own folder or file, add a new line with its path under [include].
# - Missing paths are skipped silently.
# - A line is only a comment when it starts with #. Do not add comments after a value.
# - [exclude] takes tar glob patterns, one per line. They apply to everything that is included.
# - Secrets (.ssh, .gnupg, .password-store, .local/share/keyrings) are only exported when encrypt = yes.
# - Saved Wi-Fi networks are only exported when wifi = yes AND encrypt = yes, and need sudo.
# - Keep the passphrase safe. Without it an encrypted archive cannot be restored.

[options]
# Save lists of installed official and AUR packages so the new install can reinstall them.
packages = yes
# Save Wi-Fi networks (NetworkManager or iwd). Needs sudo and encrypt = yes.
wifi = no
# Encrypt the archive with an age passphrase. Required for secrets and Wi-Fi.
encrypt = yes

[include]
# Application, desktop and theme settings.
.config
# Desktop entries for your own applications.
.local/share/applications
# Fonts you installed.
.local/share/fonts
# Icon themes you installed.
.local/share/icons
# Saved keyrings (secret, needs encrypt = yes).
.local/share/keyrings
# Bash settings.
.bashrc
.bash_profile
# Zsh settings.
.zshrc
# Login shell settings.
.profile
# Readline settings.
.inputrc
# Git identity and settings.
.gitconfig
# SSH keys and config (secret, needs encrypt = yes).
.ssh
# GnuPG keys (secret, needs encrypt = yes).
.gnupg
# Your documents.
Documents
# Your pictures.
Pictures
# Your development folder.
Dev
# Your projects folder.
Projects

[exclude]
# Caches can always be rebuilt.
.cache
*/.cache
# Dependencies are restored by your package manager.
node_modules
# Browser and app caches.
*/Cache
*/cache2
*/Code Cache
*/GPUCache
# Deleted files.
.local/share/Trash
# Python bytecode and virtual environments.
__pycache__
.venv
venv
.mypy_cache
.pytest_cache
# Build tool caches.
.gradle
.next
# Mail and browser profiles are large and sync through your accounts. Remove a line to include it.
.config/thunderbird
.config/chromium
.config/google-chrome
.config/BraveSoftware
.config/vivaldi
.config/zen
# More browser data that is downloaded again on demand.
*/component_crx_cache
*/extensions_crx_cache
*/screen_ai
*/GPUPersistentCache
*/ShaderCache
*/GrShaderCache
*/Crash Reports
*/BrowserMetrics
*/Service Worker/CacheStorage
# Disk images and installers are large and can be downloaded again.
*.iso
*.vdi
*.vmdk
*.qcow2
