# Omarchy's kernel parameters on machines that boot systemd-boot, read by
# omarchy-boot-sync after /etc/kernel/cmdline and before /etc/cmdline.d/*.conf.
# Keep in step with etc/limine-entry-tool.d/omarchy-defaults.conf, which
# carries the same parameters, and their reasons, for Limine.
quiet splash loglevel=0 systemd.show_status=false rd.udev.log_level=0 vt.global_cursor_default=0
initramfs_async=0
systemd.tty.term.console=dumb
