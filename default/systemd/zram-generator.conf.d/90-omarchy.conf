# Compressed swap in RAM, capped at the smaller of half of RAM and 8 GiB.
# Browser-heavy desktops and local AI model buffers compress closer to
# 1.6-1.9:1 than 3:1; sizing zram to all of RAM lets it pin over half of
# physical memory in unswappable pools and stall the desktop in direct
# reclaim. Capping at 8 GiB bounds zram's footprint to ~4 GiB while the disk
# swapfile at pri=0 absorbs cold overflow. lzo-rle cuts swap latency
# several-fold over zstd with a better ratio than lz4 on mixed pages.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = lzo-rle

# Above the pri=0 that omarchy-hibernation-setup gives the disk swapfile.
swap-priority = 100

# Default "discard" implies discard=once, which scans and discards the entire
# empty zram device synchronously during swapon at boot (1s+ on high-RAM
# machines, blocking swap.target). discard=pages still frees swapped pages at
# runtime without paying that boot cost.
options = discard=pages
