[Unit]
# D-Bus activation starts this portal as soon as anything on the session bus
# asks. At login that is often a user service on default.target, a few seconds
# before uwsm imports WAYLAND_DISPLAY. QT_QPA_PLATFORM arrives later, when
# Hyprland's autostart imports the compositor environment and restarts this
# unit. The stock After=graphical-session.target does not
# wait for a target that is not in that transaction, so the process keeps the
# empty environment it started with. It then stays active, and the later
# session does not replace it: Wants= does not restart a unit that is already
# running. Every program it launches (a magnet link, a file association)
# inherits that environment, and a Qt app aborts in
# QGuiApplicationPrivate::createPlatformIntegration because no platform plugin
# can open a display.
#
# The same gate as xdg-desktop-portal-hyprland.service and omarchy-fcitx5:
# skip the start until the compositor's display is in the manager environment.
# A condition miss is not a failure, so the next activation, once uwsm has
# imported the session, starts a portal that has it.
ConditionEnvironment=WAYLAND_DISPLAY
