# Restart the Hyprland screen-share portal whenever PipeWire restarts.
#
# xdg-desktop-portal-hyprland never notices that its PipeWire connection died,
# so after a PipeWire restart (omarchy-restart-audio does one) the next screen
# share hangs the portal at 100% CPU and every app trying to share the screen
# times out until the portal is restarted by hand. Remove this once xdph
# reconnects on its own: hyprwm/xdg-desktop-portal-hyprland#433.
[Unit]
PartOf=pipewire.service
After=pipewire.service
