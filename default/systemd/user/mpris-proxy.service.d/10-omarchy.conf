# Let Bluetooth headsets drive the media player.
#
# Headsets send transport control as AVRCP passthrough: play/pause, next and
# previous from the buttons or stem gestures, and the pause that earbuds with
# in-ear detection emit when one is taken out. bluez only routes those to a
# player registered on org.bluez.Media1, and with nothing registered it drops
# them, so the buttons do nothing and playback runs on into an ear that is no
# longer listening. mpris-proxy is that registration, exporting session MPRIS
# players to bluez.
#
# bluez-utils ships the unit but leaves it disabled, and it carries no
# conditions or Restart=. mpris-proxy exits 1 ("Can't get on system bus") when
# bluetoothd is unreachable at startup, so enabling it as shipped leaves a
# failed unit on every machine without a usable adapter. The two conditions
# mirror bt-agent.service and skip it cleanly there instead.
#
# Restart= covers mpris-proxy itself dying, and nothing more. It does not
# recover a bluetoothd restart: a running proxy survives that without exiting,
# logging "org.bluez disappeared" and then "org.bluez appeared", so systemd is
# never involved. A user unit cannot order itself against the system
# bluetooth.service, so recovering that case is out of reach from here.
[Unit]
ConditionPathIsDirectory=/sys/class/bluetooth

[Service]
ExecCondition=/usr/bin/systemctl is-active --quiet bluetooth.service
Restart=on-failure
RestartSec=2
