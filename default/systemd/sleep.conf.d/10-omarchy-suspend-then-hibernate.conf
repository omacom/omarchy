[Sleep]
# Battery lid-close hibernates after 20min in suspend; AC lid-close stays in
# suspend (see logind HandleLidSwitchExternalPower=suspend). 20min keeps the
# lid-open instant-wake window for short closes while stopping overnight
# drain — the previous static 60min applied to both AC and battery.
HibernateDelaySec=20min
# Safety net for manual `systemctl suspend-then-hibernate` on AC: stay in
# suspend where lid-open wakes. Battery path is unaffected.
HibernateOnACPower=no
