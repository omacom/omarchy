# nordvpnd orders itself after network-online.target, but Omarchy masks
# NetworkManager-wait-online, so that target is reached before Wi-Fi is up and
# auto-connect's first attempt runs into its 30 s timeout. Wait for
# NetworkManager to finish bringing up the network instead (15 s at most).
[Unit]
After=NetworkManager.service

[Service]
ExecStartPre=-/usr/bin/nm-online -s -q -t 15
