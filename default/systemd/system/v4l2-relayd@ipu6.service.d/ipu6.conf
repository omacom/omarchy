[Unit]
# udev starts this when the IPU6 registers its capture nodes.
Requires=ipu6-loopback.service
After=ipu6-loopback.service

[Service]
RestartSec=2
# Only enumerate the IPU6 ("simple") pipeline: a USB webcam would otherwise
# be listed first and libcamerasrc opens the first camera. Naming the camera
# instead would mean escaping its ACPI path (\_SB_.PC00.LNK1) through
# systemd, sh and the GStreamer parser.
Environment=LIBCAMERA_PIPELINES_MATCH_LIST=simple
# The relay runs as root without a display, where libcamera's GPU debayer has
# no EGL device to open and yields no frames; the CPU path does 720p30 fine.
Environment=LIBCAMERA_SOFTISP_MODE=cpu
# The software ISP allocates its frames from udmabuf or a dma-buf heap, which
# the packaged DevicePolicy=closed leaves out.
DeviceAllow=/dev/udmabuf rw
DeviceAllow=char-dma_heap rw
# libcamera runs the camera manager and the IPA on their own threads, which
# the packaged LimitNPROC=1 forbids once the capability set is empty.
LimitNPROC=infinity
