# systemd 262 sets up NvPCRs only from a UKI that embeds a signed PCR policy.
# Omarchy's UKIs carry none, and instead of skipping the NvPCRs systemd fails
# this unit on every boot (systemd/systemd#43848). Accept that failure until
# systemd ships the fix (systemd/systemd#43948), then delete this drop-in.
[Service]
SuccessExitStatus=1
