# Installed for systemd-hibernate, systemd-hybrid-sleep and systemd-suspend-then-hibernate on Macs with the FaceTime HD
# camera: its driver hangs the hibernation freeze, so it is unloaded first, and the sleep fails while it is in use.
[Service]
ExecStartPre=/usr/bin/omarchy-system-sleep-facetimehd pre
ExecStopPost=/usr/bin/omarchy-system-sleep-facetimehd post
