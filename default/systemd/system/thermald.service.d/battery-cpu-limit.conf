[Service]
# thermald snapshots PL1 at startup as its unthrottled RAPL value and writes it
# back after every passive-trip excursion (95C) and on stop. Apply the battery
# CPU cap first so the snapshot is the cap, not the firmware PL1 (100W on a
# MacBookPro16,1). intel-rapl:0 can register late at boot, so wait for it. The
# leading '-' keeps thermald starting even if the helper fails.
ExecStartPre=-/bin/sh -c 'for i in $(seq 50); do [ -e /sys/class/powercap/intel-rapl:0 ] && break; sleep 0.1; done; exec /usr/bin/omarchy-battery-cpu-limit'
