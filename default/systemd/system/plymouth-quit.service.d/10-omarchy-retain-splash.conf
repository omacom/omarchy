[Service]
# GDM-style handoff: Plymouth only deactivates here. It stops drawing and drops
# DRM master but keeps its device open, so its last frame stays scanned out:
# no drm_lastclose console restore flashes in between, and the compositor
# takes that very frame over (Omarchy's aquamarine adopts it with
# AQ_SPLASH_ADOPT, default/uwsm/env.d/10-omarchy). The native TTFX module
# publishes its handoff frame as it deactivates. omarchy-plymouth-reap quits
# the deactivated daemon with --retain-splash as soon as the compositor has
# replaced its frame (multi-user.target waits for it), without holding up
# the login screen; a failed deactivate quits it at once.
ExecStart=
ExecStart=/usr/bin/sh -c '/usr/bin/timeout -k 1s 3s /usr/bin/plymouth deactivate || /usr/bin/timeout -k 1s 3s /usr/bin/plymouth quit --retain-splash'
ExecStartPost=/usr/bin/systemctl start --no-block omarchy-plymouth-reap.service
TimeoutStartSec=15s
