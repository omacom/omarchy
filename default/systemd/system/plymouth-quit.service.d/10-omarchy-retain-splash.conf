[Service]
# Fedora-style seamless handoff: `quit --retain-splash` exits the daemon (which
# drops DRM master on fd close, so the compositor can start immediately) while
# skipping hide_splash/VT-deallocation — Plymouth's last framebuffer stays
# scanned out and the VT stays in graphics mode, so there is no black console
# window between the splash and the compositor's first flip. The compositor
# then flips its first frame directly over the retained splash frame.
# Deactivate first: the initramfs plymouthd lives in init.scope, untracked by
# systemd, and could keep DRM master until it exits, so the compositor's
# first modeset would fail. TTFX has already painted its last frame into
# fbcon, so dropping master here keeps the same pixels on screen.
ExecStartPre=-/usr/bin/timeout -k 1s 3s /usr/bin/plymouth deactivate
ExecStart=
ExecStart=/usr/bin/sh -c '/usr/bin/timeout -k 1s 3s /usr/bin/plymouth quit --retain-splash || /usr/bin/systemctl start omarchy-plymouth-reap.service'
ExecStartPost=/usr/bin/systemctl start omarchy-plymouth-reap.timer
TimeoutStartSec=15s
