[Service]
# The Xiaomi Mi NoteBook Ultra exposes the Bitland MIFS WMI interface that
# bitland-mifs-wmi binds to, but its firmware answers every call with zeros.
# The platform profile it registers always reads balanced and ignores writes,
# and refuses performance outright: that needs a barrel-jack charger, and this
# laptop only charges over USB-C. power-profiles-daemon trusts the profile, so
# performance fails and power-saver snaps back to balanced. Without it, the
# profiles drive intel_pstate alone, which works.
ExecStart=
ExecStart=/usr/lib/power-profiles-daemon --block-driver=platform_profile
