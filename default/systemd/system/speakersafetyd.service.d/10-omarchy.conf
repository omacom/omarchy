# speakersafetyd panics on bad ivsense when something (often a screen
# recording) opens the Asahi speaker path at 96 kHz. The stock unit is
# Restart=on-failure with StartLimitBurst=10 / 60s; after that systemd
# leaves the service dead and the kernel keeps the amps locked. PipeWire
# still reports 100%, so the desktop looks unmuted.
#
# Disable the start limit so the daemon keeps retrying. Once the 96 kHz
# client goes away, the next start succeeds and unlocks the speakers.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=5
