[Login]
# Battery (lid closed on DC power): plain suspend. This is the variant for
# models whose hibernate resume is known-broken, where letting logind reach
# hibernate would cost the session: #11351 (MacBookPro11,5 resumes to a frozen
# lock screen with dead input), #7848 (MacBookPro11,3 resume kills the GPU
# session), plus a bricked MacBookPro11,4 report. omarchy-hibernation-setup and
# the lid-policy migration pick this file over 99-omarchy-lid-sleep.conf on
# those machines; the trade is that an overnight lid-close now drains battery
# instead of losing the session.
HandleLidSwitch=suspend
# AC (ExternalPower): stay in suspend so lid-open always wakes. Same as the
# default policy — waking from true hibernate via lid-open needs firmware LID
# wakeup from S4, which most laptops do not expose.
HandleLidSwitchExternalPower=suspend
# Docked/clamshell (lid closed with external monitors): stay awake. Matches
# omarchy-system-lid-close, which skips the lock when docked because the
# session is still in use on the external display.
HandleLidSwitchDocked=ignore
