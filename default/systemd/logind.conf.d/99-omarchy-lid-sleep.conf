[Login]
# Battery (lid closed on DC power): suspend first so lid-open wakes instantly,
# then hibernate after HibernateDelaySec to stop battery drain.
HandleLidSwitch=suspend-then-hibernate
# AC (ExternalPower): stay in suspend so lid-open always wakes. Waking from
# true hibernate via lid-open needs firmware LID wakeup from S4, which most
# laptops (including the tested HP 250 G9) do not expose — only PWRB wakes
# from S4. Suspend keeps the fast lid-open path on AC where power is free.
HandleLidSwitchExternalPower=suspend
# Docked/clamshell (lid closed with external monitors): stay awake. Matches
# omarchy-system-lid-close, which skips the lock when docked because the
# session is still in use on the external display.
HandleLidSwitchDocked=ignore
