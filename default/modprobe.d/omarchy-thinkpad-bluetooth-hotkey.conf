# ThinkPad ACPI's recommended hotkey mask omits bit 20 on some models (e.g. T490),
# so F10 (KEY_BLUETOOTH) never toggles tpacpi_bluetooth_sw. Widen the mask by that
# bit only — do not use hotkey_all_mask; bits 2/15/16/17 are firmware-handled
# volume/brightness on these machines (#13291).
options thinkpad_acpi hotkey=enable,0xff9c7ffb
