# Installed by omarchy-hibernation-setup on laptops. UPower's Auto action is
# logind's Sleep(), which is suspend-then-hibernate: at the last few percent the
# suspend can drain the battery before the hibernate ever runs. Hibernate
# directly, early enough for the image to be written on battery.
[UPower]
CriticalPowerAction=Hibernate
PercentageCritical=8.0
PercentageAction=5.0
