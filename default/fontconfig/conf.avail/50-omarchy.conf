<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Normalize a private copy so other scripts keep their requested languages. -->
  <match target="pattern">
    <edit name="omarchy_cjk_lang" mode="assign">
      <name>lang</name>
    </edit>
  </match>

  <!-- CJK: fold the language tag onto one tag per Noto CJK variant -->

  <match target="pattern">
    <test name="omarchy_cjk_lang" qual="first" compare="not_eq">
      <minus>
        <name>omarchy_cjk_lang</name>
        <langset><string>zh</string></langset>
      </minus>
    </test>
    <edit name="omarchy_cjk_lang" mode="assign">
      <string>zh-cn</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="omarchy_cjk_lang" qual="first" compare="not_eq">
      <minus>
        <name>omarchy_cjk_lang</name>
        <langset><string>zh-hant</string></langset>
      </minus>
    </test>
    <edit name="omarchy_cjk_lang" mode="assign">
      <string>zh-tw</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="omarchy_cjk_lang" qual="first" compare="contains">
      <string>zh-hant-hk</string>
    </test>
    <edit name="omarchy_cjk_lang" mode="assign">
      <string>zh-hk</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="omarchy_cjk_lang" qual="first" compare="contains">
      <string>zh-hant-mo</string>
    </test>
    <edit name="omarchy_cjk_lang" mode="assign">
      <string>zh-hk</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="omarchy_cjk_lang" qual="first" compare="contains">
      <string>zh-hant</string>
    </test>
    <edit name="omarchy_cjk_lang" mode="assign">
      <string>zh-tw</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="omarchy_cjk_lang" qual="first" compare="contains">
      <string>zh-hans</string>
    </test>
    <edit name="omarchy_cjk_lang" mode="assign">
      <string>zh-cn</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="omarchy_cjk_lang" qual="first" compare="contains">
      <string>zh-sg</string>
    </test>
    <edit name="omarchy_cjk_lang" mode="assign">
      <string>zh-cn</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="omarchy_cjk_lang" qual="first" compare="contains">
      <string>zh-mo</string>
    </test>
    <edit name="omarchy_cjk_lang" mode="assign">
      <string>zh-hk</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="omarchy_cjk_lang" qual="first" compare="not_eq">
      <minus>
        <name>omarchy_cjk_lang</name>
        <langset><string>yue</string></langset>
      </minus>
    </test>
    <edit name="omarchy_cjk_lang" mode="assign">
      <string>zh-hk</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="omarchy_cjk_lang" qual="first" compare="contains">
      <string>yue-hans</string>
    </test>
    <edit name="omarchy_cjk_lang" mode="assign">
      <string>zh-cn</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="omarchy_cjk_lang" qual="first" compare="contains">
      <string>yue-cn</string>
    </test>
    <edit name="omarchy_cjk_lang" mode="assign">
      <string>zh-cn</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="omarchy_cjk_lang" qual="first" compare="contains">
      <string>yue</string>
    </test>
    <edit name="omarchy_cjk_lang" mode="assign">
      <string>zh-hk</string>
    </edit>
  </match>

  <!-- Then append that variant after the generic family it falls back from -->

  <match target="pattern">
    <test name="omarchy_cjk_lang" qual="first" compare="contains">
      <string>zh-cn</string>
    </test>
    <test name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="omarchy_cjk_lang" qual="first" compare="contains">
      <string>zh-cn</string>
    </test>
    <test name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="omarchy_cjk_lang" qual="first" compare="contains">
      <string>zh-cn</string>
    </test>
    <test name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Sans Mono CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="omarchy_cjk_lang" qual="first" compare="contains">
      <string>zh-hk</string>
    </test>
    <test name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Sans CJK HK</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="omarchy_cjk_lang" qual="first" compare="contains">
      <string>zh-hk</string>
    </test>
    <test name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Serif CJK HK</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="omarchy_cjk_lang" qual="first" compare="contains">
      <string>zh-hk</string>
    </test>
    <test name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Sans Mono CJK HK</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="omarchy_cjk_lang" qual="first" compare="contains">
      <string>zh-tw</string>
    </test>
    <test name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Sans CJK TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="omarchy_cjk_lang" qual="first" compare="contains">
      <string>zh-tw</string>
    </test>
    <test name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Serif CJK TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="omarchy_cjk_lang" qual="first" compare="contains">
      <string>zh-tw</string>
    </test>
    <test name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Sans Mono CJK TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="omarchy_cjk_lang" qual="first" compare="contains">
      <langset><string>ja</string></langset>
    </test>
    <test name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="omarchy_cjk_lang" qual="first" compare="contains">
      <langset><string>ja</string></langset>
    </test>
    <test name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Serif CJK JP</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="omarchy_cjk_lang" qual="first" compare="contains">
      <langset><string>ja</string></langset>
    </test>
    <test name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Sans Mono CJK JP</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="omarchy_cjk_lang" qual="first" compare="contains">
      <langset><string>ko</string></langset>
    </test>
    <test name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Sans CJK KR</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="omarchy_cjk_lang" qual="first" compare="contains">
      <langset><string>ko</string></langset>
    </test>
    <test name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Serif CJK KR</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="omarchy_cjk_lang" qual="first" compare="contains">
      <langset><string>ko</string></langset>
    </test>
    <test name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Sans Mono CJK KR</string>
    </edit>
  </match>

  <!-- A request that leads with a generic family, or names none (fontconfig
       then adds sans-serif), gets the generic's face strongly ahead of it, as
       before, and the generic itself strongly: the system default and explicit
       generics are unchanged in every locale. Only a request that leads with a
       named font takes the preference below. -->
  <match target="pattern">
    <test name="family" qual="first">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Liberation Sans</string>
      <string>sans-serif</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="first">
      <string>serif</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Liberation Serif</string>
      <string>serif</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="first">
      <string>monospace</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
      <string>monospace</string>
    </edit>
  </match>

  <!-- Behind a named font, the generic families' faces are preferred ahead of
       each generic rather than assigned in its place. fontconfig appends sans-serif to every request
       that names no generic, so a strong assign answered a request for a font
       that isn't installed ("Della Respira", from CSS's "Della Respira", serif)
       with a strong Liberation Sans, which WebKitGTK takes as that font and
       draws, never reaching the serif or monospace the page asked for next.
       A prefer keeps the binding of the generic it follows: strong where a
       page or app asks for the generic, weak where fontconfig added it. -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Liberation Sans</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Liberation Serif</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
    </prefer>
  </alias>

  <!-- Arabic: prefer Naskh (standard Arabic) over Nastaliq (Urdu style) -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ar</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Naskh Arabic</string>
    </edit>
  </match>

  <!-- Urdu is conventionally set in Nastaliq, so keep it there. Without this
       the untargeted Naskh rule below would capture Urdu too. Appended rather
       than prepended so it only wins the last-resort race against that rule
       and never displaces the family the app actually asked for. -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ur</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Nastaliq Urdu</string>
    </edit>
  </match>

  <!-- Chromium and Electron resolve missing glyphs one character at a time
       without lang on the pattern, so the rules above never fire for them and
       fontconfig falls through to a raw charset scan that lands on Nastaliq
       (or on Kufi, once the latin alias chains have widened the pattern).
       Naming Naskh as a last-resort family covers that path. Appending keeps
       it behind every family the app actually asked for, and charset matching
       outranks family matching, so a font that does not cover the codepoint
       can never be pulled in: Latin, monospace, emoji, Nerd Font glyphs and
       CJK all resolve exactly as before.

       Weak for every request, so it never answers a request for a named font
       that isn't installed: a strong last resort topped the fallback WebKitGTK
       draws such a font with, and Latin text came out in Naskh. Strong only
       when the request's charset holds Arabic, as Chromium's per-character
       request does, where a weak entry lost to Kufi. -->
  <match target="pattern">
    <edit name="family" mode="append" binding="weak">
      <string>Noto Naskh Arabic</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="charset" compare="not_eq">
      <minus>
        <name>charset</name>
        <charset>
          <range><int>0x0600</int><int>0x06ff</int></range>
          <range><int>0x0750</int><int>0x077f</int></range>
          <range><int>0x0870</int><int>0x08ff</int></range>
          <range><int>0xfb50</int><int>0xfdff</int></range>
          <range><int>0xfe70</int><int>0xfeff</int></range>
          <range><int>0x10ec0</int><int>0x10eff</int></range>
        </charset>
      </minus>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Naskh Arabic</string>
    </edit>
  </match>

  <!-- Han with no language, input method or chosen forms takes Japanese forms in every app, rather than
       Korean in some and Japanese in others. Accepted here so a user's chosen forms, loaded later, insert ahead. -->
  <alias>
    <family>sans-serif</family>
    <accept>
      <family>Noto Sans CJK JP</family>
    </accept>
  </alias>

  <alias>
    <family>Liberation Sans</family>
    <accept>
      <family>Noto Sans CJK JP</family>
    </accept>
  </alias>

  <alias>
    <family>serif</family>
    <accept>
      <family>Noto Serif CJK JP</family>
    </accept>
  </alias>

  <alias>
    <family>Liberation Serif</family>
    <accept>
      <family>Noto Serif CJK JP</family>
    </accept>
  </alias>

  <alias>
    <family>monospace</family>
    <accept>
      <family>Noto Sans Mono CJK JP</family>
    </accept>
  </alias>

  <alias>
    <family>JetBrainsMono Nerd Font</family>
    <accept>
      <family>Noto Sans Mono CJK JP</family>
    </accept>
  </alias>

  <alias binding="same">
    <family>system-ui</family>
    <prefer>
      <family>Liberation Sans</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>ui-sans-serif</family>
    <prefer>
      <family>Liberation Sans</family>
    </prefer>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>

  <alias binding="same">
    <family>ui-serif</family>
    <prefer>
      <family>Liberation Serif</family>
    </prefer>
    <default>
      <family>serif</family>
    </default>
  </alias>

  <alias binding="same">
    <family>ui-monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
    </prefer>
    <default>
      <family>monospace</family>
    </default>
  </alias>

  <alias binding="same">
    <family>-apple-system</family>
    <prefer>
      <family>Liberation Sans</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>BlinkMacSystemFont</family>
    <prefer>
      <family>Liberation Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>Liberation Sans</family>
    <accept>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>

  <alias>
    <family>sans-serif</family>
    <accept>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>

  <alias>
    <family>serif</family>
    <accept>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>

  <alias>
    <family>monospace</family>
    <accept>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>
</fontconfig>
