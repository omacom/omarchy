<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Liberation Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>serif</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Liberation Serif</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>monospace</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
    </edit>
  </match>

  <!-- Arabic: prefer Naskh (standard Arabic) over Nastaliq (Urdu style) -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ar</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Naskh Arabic</string>
    </edit>
  </match>

  <!-- Urdu is conventionally set in Nastaliq, so keep it there. Without this
       the untargeted Naskh rule below would capture Urdu too. Appended rather
       than prepended so it only wins the last-resort race against that rule
       and never displaces the family the app actually asked for. -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ur</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Nastaliq Urdu</string>
    </edit>
  </match>

  <!-- Chromium and Electron resolve missing glyphs one character at a time
       without lang on the pattern, so the rules above never fire for them and
       fontconfig falls through to a raw charset scan that lands on Nastaliq
       (or on Kufi, once the latin alias chains have widened the pattern).
       Naming Naskh as a last-resort family covers that path. Appending keeps
       it behind every family the app actually asked for, and charset matching
       outranks family matching, so a font that does not cover the codepoint
       can never be pulled in: Latin, monospace, emoji, Nerd Font glyphs and
       CJK all resolve exactly as before.

       Arabic is not the only script with that problem. Noto ships fonts for
       historic scripts that carry codepoints of a living neighbour — Grantha
       has Tamil's U+0BAA, for one — and the same raw charset scan lands on
       them, after which the rest of the word has no glyphs and renders as
       boxes. Name the living scripts' families last-resort too, so each wins
       the tie against its historic siblings for the codepoints they share.
       The list is every script in current use that noto-fonts covers; the
       historic ones are deliberately absent, since they are what the scan
       must stop landing on. -->
  <match target="pattern">
    <edit name="family" mode="append" binding="strong">
      <string>Noto Naskh Arabic</string>
      <string>Noto Sans Adlam</string>
      <string>Noto Sans Armenian</string>
      <string>Noto Sans Balinese</string>
      <string>Noto Sans Bamum</string>
      <string>Noto Sans Batak</string>
      <string>Noto Sans Bengali</string>
      <string>Noto Sans Buginese</string>
      <string>Noto Sans Canadian Aboriginal</string>
      <string>Noto Sans Chakma</string>
      <string>Noto Sans Cham</string>
      <string>Noto Sans Cherokee</string>
      <string>Noto Sans Devanagari</string>
      <string>Noto Sans Ethiopic</string>
      <string>Noto Sans Georgian</string>
      <string>Noto Sans Gujarati</string>
      <string>Noto Sans Gurmukhi</string>
      <string>Noto Sans Hanifi Rohingya</string>
      <string>Noto Sans Hebrew</string>
      <string>Noto Sans Javanese</string>
      <string>Noto Sans Kannada</string>
      <string>Noto Sans Kayah Li</string>
      <string>Noto Sans Khmer</string>
      <string>Noto Sans Lao</string>
      <string>Noto Sans Lepcha</string>
      <string>Noto Sans Limbu</string>
      <string>Noto Sans Lisu</string>
      <string>Noto Sans Malayalam</string>
      <string>Noto Sans Mandaic</string>
      <string>Noto Sans Meetei Mayek</string>
      <string>Noto Sans Miao</string>
      <string>Noto Sans Mongolian</string>
      <string>Noto Sans Myanmar</string>
      <string>Noto Sans Nag Mundari</string>
      <string>Noto Sans New Tai Lue</string>
      <string>Noto Sans NKo</string>
      <string>Noto Sans Ol Chiki</string>
      <string>Noto Sans Oriya</string>
      <string>Noto Sans Osage</string>
      <string>Noto Sans Pahawh Hmong</string>
      <string>Noto Sans Samaritan</string>
      <string>Noto Sans Saurashtra</string>
      <string>Noto Sans Sinhala</string>
      <string>Noto Sans Sora Sompeng</string>
      <string>Noto Sans Sundanese</string>
      <string>Noto Sans Sunuwar</string>
      <string>Noto Sans Syriac</string>
      <string>Noto Sans Tai Le</string>
      <string>Noto Sans Tai Tham</string>
      <string>Noto Sans Tai Viet</string>
      <string>Noto Sans Tamil</string>
      <string>Noto Sans Tangsa</string>
      <string>Noto Sans Telugu</string>
      <string>Noto Sans Thaana</string>
      <string>Noto Sans Thai</string>
      <string>Noto Sans Tifinagh</string>
      <string>Noto Sans Vai</string>
      <string>Noto Sans Wancho</string>
      <string>Noto Sans Yi</string>
    </edit>
  </match>

  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Liberation Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>ui-monospace</family>
    <default>
      <family>monospace</family>
    </default>
  </alias>

  <alias>
    <family>-apple-system</family>
    <prefer>
      <family>Liberation Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>BlinkMacSystemFont</family>
    <prefer>
      <family>Liberation Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>Liberation Sans</family>
    <accept>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>

  <alias>
    <family>sans-serif</family>
    <accept>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>

  <alias>
    <family>serif</family>
    <accept>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>

  <alias>
    <family>monospace</family>
    <accept>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>
</fontconfig>
