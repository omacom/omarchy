# Installed by `omarchy drive tpm enroll` and removed by `omarchy drive tpm wipe`.
#
# Builds a systemd initramfs, so the root volume unlocks through the TPM2 token
# systemd-cryptenroll wrote. The busybox encrypt hook in Omarchy's baseline
# never reads LUKS2 tokens and always asks for the passphrase. sd-encrypt finds
# the volume through rd.luks.name= in /etc/limine-entry-tool.d, which the same
# command writes, and still asks for the passphrase when the TPM refuses to
# unseal.
#
# Each busybox hook the earlier drop-ins chose becomes its systemd counterpart
# in place, instead of this file setting a HOOKS line of its own. Those drop-ins
# keep deciding everything else, such as omarchy_hooks.conf dropping kms on an
# NVIDIA-only machine. The file is named to sort after omarchy_hooks.conf and
# omarchy_resume.conf for that reason.
#
#   udev                -> systemd
#   keymap consolefont  -> sd-vconsole
#   encrypt             -> sd-encrypt (rd.luks.name=; it ignores cryptdevice=)
#   btrfs-overlayfs     -> sd-btrfs-overlayfs (limine-mkinitcpio-hook ships both)
#   resume              -> dropped: the systemd hook resumes from resume= itself
#
# mkinitcpio sources the drop-ins more than once, and a second pass leaves the
# line as the first one made it.
_omarchy_tpm_hooks=()
for _omarchy_tpm_hook in "${HOOKS[@]}"; do
  case $_omarchy_tpm_hook in
    udev) _omarchy_tpm_hook=systemd ;;
    keymap | consolefont) _omarchy_tpm_hook=sd-vconsole ;;
    encrypt) _omarchy_tpm_hook=sd-encrypt ;;
    btrfs-overlayfs) _omarchy_tpm_hook=sd-btrfs-overlayfs ;;
    resume) continue ;;
  esac
  [[ " ${_omarchy_tpm_hooks[*]} " == *" $_omarchy_tpm_hook "* ]] || _omarchy_tpm_hooks+=("$_omarchy_tpm_hook")
done
HOOKS=("${_omarchy_tpm_hooks[@]}")
unset _omarchy_tpm_hooks _omarchy_tpm_hook
