# Keep the Dell XPS 14 (DA14260) built-in microphone ready instead of letting
# WirePlumber suspend it after five idle seconds. Waking it from suspend takes
# about 700 ms (its codec reports a 500 ms power-up), which clips the first words
# of dictation; an idle source starts in about 50 ms. No audio flows while idle.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_input.pci-0000_00_1f.3-platform-sof_sdw.HiFi__Mic__source"
        media.class = "Audio/Source"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
