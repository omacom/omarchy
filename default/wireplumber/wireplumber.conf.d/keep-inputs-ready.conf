# Let applications keep microphones ready while they run. A client that sets the
# property "session.keep-inputs-ready" = "true" on its PipeWire connection stops
# ALSA capture sources from suspending until it disconnects, so dictation starts
# without the device wake-up delay. See the script for details.
wireplumber.components = [
  {
    name = omarchy/suspend-node.lua, type = script/lua
    provides = hooks.node.suspend.omarchy
  }
]

wireplumber.profiles = {
  main = {
    hooks.node.suspend = disabled
    hooks.node.suspend.omarchy = optional
  }
}

# Nothing wants an optional feature by itself; have the node policy want this
# hook where it wanted the stock one, so it loads whenever that would have.
wireplumber.components.rules = [
  {
    matches = [ { provides = "policy.node" } ]
    actions = { merge = { wants = [ hooks.node.suspend.omarchy ] } }
  }
]
