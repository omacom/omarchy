# Framework Laptop 16 Ryzen AI 300: desktop volume attenuates both channels of
# the "Speaker" mixer while "Bass Speaker" stays at 0 dB, changing tonal balance
# at low volumes. Keep both stereo mixer controls at 0 dB and adjust volume in
# software. The installer gates this rule on the exact Framework model.
# The labels appear swapped acoustically; setting both identically avoids
# depending on that mapping. See docs/framework16-speaker-volume.md.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.*"
        device.vendor.id = "0x1022"
        device.product.id = "0x15e3"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
