[Service]
# Applied after Quadlet generation: never stop or remove a namesake when
# startup fails. The runtime directory and CID belong to this invocation.
ExecStop=
ExecStop=/usr/bin/podman --remote=false stop --ignore --time 120 --cidfile=%t/%N/container.cid
ExecStopPost=
ExecStopPost=-/usr/bin/podman --remote=false rm --force --ignore --cidfile=%t/%N/container.cid
