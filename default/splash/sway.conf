# The splash's compositor: one Quickshell window per output and nothing else.
# The keyboard settings come from vconsole.conf (see default/splash/session).
include /run/omarchy-splash/input.conf

# Pointers stay on: sway's input settings switch a whole device off, and some
# keyboards share theirs with a touchpad. sway hides the cursor after its
# shortest wait, 100 ms; the splash shows it through IPC (ui/Splash.qml).
seat * hide_cursor 1
seat * hide_cursor when-typing enable
# The image carries Adwaita's arrow in each of its sizes, so the pointer scales
# with the output, which wlroots' built-in one doesn't.
seat * xcursor_theme Adwaita

# Taps click, as in Hyprland at the login screen.
input type:touchpad tap enabled

# KEY_POWER: without it the only way out of the unlock prompt is holding the
# button down.
bindcode --no-repeat 124 exec /usr/lib/omarchy-splash/power-button

xwayland disable
swaybg_command -

exec /usr/lib/omarchy-splash/ui-launch
