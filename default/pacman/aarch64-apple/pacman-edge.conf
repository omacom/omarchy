# See the pacman.conf(5) manpage for option and repository directives
# Apple Silicon has edge and rc: its packages reach rc by promotion from edge,
# and its stable template comes with the first Mac stable release.

[options]
Color
ILoveCandy
VerbosePkgLists
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm

# By default, pacman accepts packages signed by keys that its local keyring
# trusts (see pacman-key and its man page), as well as unsigned packages.
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# pacman searches repositories in the order defined here. Omarchy comes first on
# Apple Silicon, so its builds for the Mac (the Aurora kernel, m1n1, U-Boot and
# the Hyprland stack) win over the same names in Asahi ALARM and Arch Linux ARM.
[omarchy]
Server = https://pkgs.omarchy.org/edge/$arch

[asahi-alarm]
Server = https://github.com/asahi-alarm/asahi-alarm/releases/download/aarch64

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist
