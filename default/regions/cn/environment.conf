# Mirrors mainland China reaches where the upstream sources are slow or fail
# (docs/regions.md).

# Node and npm packages from Alibaba's npmmirror: mise's Node builds, every tool
# mise installs from npm, and npm itself.
MISE_NODE_MIRROR_URL=https://npmmirror.com/mirrors/node/
NPM_CONFIG_REGISTRY=https://registry.npmmirror.com/

# Go modules from goproxy.cn.
GOPROXY=https://goproxy.cn,direct

# Rust toolchains from ByteDance's rsproxy, for rustup and its installer.
RUSTUP_DIST_SERVER=https://rsproxy.cn
RUSTUP_UPDATE_ROOT=https://rsproxy.cn/rustup

# Python packages from Alibaba's PyPI mirror, for pip and uv.
PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/
UV_DEFAULT_INDEX=https://mirrors.aliyun.com/pypi/simple/

# Elixir and Erlang packages from Upyun's hex.pm mirror.
HEX_MIRROR=https://hexpm.upyun.com
