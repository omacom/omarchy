# When Omarchy has set up hibernation, critical battery must hibernate
# directly. CriticalPowerAction=Auto follows logind's Sleep(), which is
# suspend-then-hibernate, and fires at PercentageAction=2%. On a draining
# laptop that leaves too little charge to finish writing the hibernation
# image, so the machine hard-powers-off instead.
#
# Installed by omarchy-hibernation-setup (and the matching migration) only
# when the Omarchy resume hook is present; removed by omarchy-hibernation-remove.
# Desktops without hibernation keep the stock Auto policy.
[UPower]
CriticalPowerAction=Hibernate
PercentageCritical=8.0
PercentageAction=5.0
