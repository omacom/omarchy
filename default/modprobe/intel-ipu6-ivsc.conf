# Keep intel_ipu6 from autoloading on PCI match. On laptops whose MIPI webcam
# sits behind a MEI based Intel Visual Sensing Controller, the IPU6 bridge must
# only run once the IVSC firmware has enumerated its CSI client, otherwise it
# wires the camera graph to the wrong device and the sensor never binds.
# /etc/udev/rules.d/90-intel-ipu6-ivsc.rules loads it when that client appears.
blacklist intel_ipu6
