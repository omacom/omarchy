# Intel IPU6 MIPI webcam relayed through libcamera's software ISP as a plain
# v4l2 camera, so browsers, the webcam overlay and everything else that only
# speaks v4l2 get a picture. The v4l2-relayd@ipu6 drop-in limits libcamera to
# the IPU6 pipeline, so the unnamed source is always the internal camera.
# The software ISP has no noise reduction and the sensor sits at its maximum
# analogue gain in normal room light, so a temporal/spatial denoiser follows
# it. hqdn3d at these strengths halves the noise at 720p30; the relay then
# takes about half of one core while an app streams, idle when none does.
VIDEOSRC="libcamerasrc ! video/x-raw,width=1280,height=720 ! videoconvert ! frei0r-filter-hqdn3d spatial=0.3 temporal=0.5 ! videoconvert"
FORMAT=NV12
WIDTH=1280
HEIGHT=720
FRAMERATE=30/1
CARD_LABEL="Built-in Front Camera"
