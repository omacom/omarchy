# Elgato Cam Link 4K relayed as a fixed 16:9 virtual camera. Browser meeting
# apps send 720p at most; raise WIDTH/HEIGHT (up to 3840x2160) for apps that
# can use more.
# The Cam Link offers only the mode its HDMI source sends (2160p25, 1080p50 and
# so on), and v4l2-relayd links this source straight to the output caps below,
# so the source converts frame rate, size and format itself. The leaky queue
# keeps two frames at most for a client that reads slowly.
VIDEOSRC="v4l2src device=/dev/camlink4k ! videorate skip-to-first=true ! videoscale ! videoconvert ! queue max-size-buffers=2 max-size-bytes=0 max-size-time=0 leaky=downstream"
# I420 rather than NV12: the Zoom web client shows NV12 cameras black.
FORMAT=I420
WIDTH=1280
HEIGHT=720
FRAMERATE=30/1
CARD_LABEL="Cam Link 4K"
