# Omarchy: installed for ASUS ROG laptops beside the soft mixer
# (install/user/hardware/asus/fix-audio-mixer.sh).
#
# The soft mixer stops PipeWire from driving the hardware volume and mute of the
# active output, but activating the headphones path still turns this output's
# controls off. This loads the stock path, then pins every element it marks
# "switch = mute" / "volume = merge" to "switch = on" / "volume = zero" (0 dB),
# so activating this path turns its output back on. A section for an element the
# stock path already defines changes only the keys it sets. Master is left alone;
# it is set once at install.

.include /usr/share/alsa-card-profile/mixer/paths/analog-output-speaker.conf

[Element Speaker+LO]
switch = on
volume = zero

[Element Speaker]
switch = on
volume = zero

[Element Desktop Speaker]
switch = on
volume = zero

[Element Front]
switch = on
volume = zero

[Element Front Speaker]
switch = on
volume = zero

[Element Speaker Front]
switch = on
volume = zero

[Element Rear]
switch = on
volume = zero

[Element Surround]
switch = on
volume = zero

[Element Surround Speaker]
switch = on
volume = zero

[Element Speaker Surround]
switch = on
volume = zero

[Element Side]
switch = on
volume = zero

[Element Speaker Side]
switch = on
volume = zero

[Element Center]
switch = on
volume = zero

[Element Center Speaker]
switch = on
volume = zero

[Element LFE]
switch = on
volume = zero

[Element LFE Speaker]
switch = on
volume = zero

[Element Bass Speaker]
switch = on
volume = zero

[Element CLFE]
switch = on
volume = zero

[Element Center/LFE]
switch = on
volume = zero

[Element Speaker CLFE]
switch = on
volume = zero
