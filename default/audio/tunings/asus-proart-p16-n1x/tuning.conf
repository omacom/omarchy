## ASUS ProArt P16 H7607BA (NVIDIA N1x) internal speakers, woofer path.
##
## Four biquads and a lookahead limiter, applied as a PipeWire filter-chain in
## front of the internal speaker sink. The Cirrus amplifiers carry ASUS's speaker
## protection and correction; this adds the part of the voicing ASUS's Dolby
## Atmos layer applies on Windows that the woofers can reproduce. The tweeters,
## on the CS42L43 codec's own amplifier, are not routed yet.

description="ASUS ProArt P16 (H7607BA) speakers"

## The model number names this exact machine; its DMI product SKU is empty, and
## the product family "ProArt P16" is shared with the x86 H7606. The voicing also
## assumes the amplifiers run ASUS's tuning for this laptop, as on Windows: on
## their ROM defaults the speakers sound different underneath and this curve
## would not fit them. So match only once that tuning is installed.
asus_proart_p16_amps_tuned() {
  omarchy-hw-match "H7607BA" &&
    compgen -G "/usr/lib/firmware/cirrus/cs35l56-b0-dsp1-misc-10431484-*" >/dev/null
}
match_command=asus_proart_p16_amps_tuned
## Unescaped dots: this is passed to awk as a string, where a backslash escape
## would be consumed before the regex sees it.
sink_pattern='^alsa_output.*mtk_sdw_mc.*HiFi__Speaker__sink$'

## Provenance. The speaker PEQ and the 20-band audio-optimizer curve of the
## internal-speaker endpoint (dynamic profile) in ASUS's Dolby tuning for this
## laptop, SOUNDWIRE_SDCAFUNCTION_10_MAN_01FA_FUNC_4243_SUBSYS_14841043.xml,
## tuning version 45, from the ASUS Dolby Atmos driver V11.506.650.32 on an
## H7607BA. Only the woofer band: the optimizer bands from 3 kHz up and the 4 kHz
## and 10 kHz PEQ sections are left out (see filter-chain.conf). Not voiced by
## ear. Nothing from the package is redistributed.
derived_from="ASUS Dolby Atmos tuning for SUBSYS_14841043 (driver V11.506.650.32), woofer band"
## Not yet played on a P16: built from the Windows tuning and measured
## electrically only. Fill these in once it has been heard on the machine.
validated_by=""
validated_on=""
validated_hardware="none yet (designed for ProArt P16 H7607BA, BIOS 303)"

## Measured electrically on a copy of this graph feeding a null sink (PipeWire
## 1.6.9, LSP 1.2.35). The graph matches its design to 0.001 dB across the dense
## probe; the figure below is its deviation from the Dolby curve's woofer band,
## level-matched for the 2 dB limiter trim (0.10 dB below 2.4 kHz, 0.6 dB at
## worst at the 3 kHz edge). Against the full Dolby curve it departs by design
## above 3 kHz, by up to 5.3 dB at 14 kHz.
magnitude_rms_db="0.15"
bass_group_delay_swing_ms="0.38"
## On a synthetic hot master (level-stepped pink noise, soft-clipped to -0.1 dBFS
## peaks): peaks reach the -1 dBFS threshold, so the limiter engages on loud
## masters, and loudness range is unchanged (11.1 LU in and out).
limiter_headroom_db="0.0"   ## worst-case peak on a hot master vs -1 dBFS
dynamic_range_delta_lu="0.0"
