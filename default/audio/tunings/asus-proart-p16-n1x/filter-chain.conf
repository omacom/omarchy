# ASUS ProArt P16 H7607BA (NVIDIA N1x) speaker tuning, woofer path.
#
# The P16's speakers are two-way. Its two CS35L56 amplifiers drive the woofers,
# and ASUS's amplifier tuning for this laptop low-passes them at about 3 kHz on
# purpose; the tweeters are on the CS42L43 codec's own amplifier, which the
# MT8901 UCM profile does not route, so they stay silent. This tuning therefore
# carries only the part of ASUS's Windows voicing the woofers can reproduce.
#
# That voicing is the static speaker block of ASUS's Dolby Atmos tuning for this
# laptop, which Windows applies on top of the Cirrus amplifier tuning: the
# speaker PEQ and the 20-band audio-optimizer curve. Below the crossover it is
# used as is -- the 600 Hz PEQ (+2.5 dB, Q 2) exactly, and the optimizer curve
# fitted with three peaking sections, together within 0.15 dB RMS of the Dolby
# curve (0.6 dB at worst, at the 3 kHz edge). From the crossover up it is left
# flat: the optimizer's 3-20 kHz bands and the PEQ's 4 kHz and 10 kHz sections
# voice the tweeters, and boosting them into low-passed woofers would only
# spend limiter headroom on sound that never comes out. The numbers are
# transcribed from the tuning file, not copied from it; see tuning.conf.
#
# It peaks at +5 dB around 610 Hz, so the limiter input is trimmed 2 dB and the
# limiter holds peaks at -1 dBFS.
#
# This assumes the amplifiers run ASUS's Cirrus tuning, as on Windows; on the
# amplifiers' ROM defaults the speakers are voiced differently underneath.
#
# Channels are wired explicitly because the limiter is a stereo plugin; a mono
# graph is duplicated per channel and would limit each side independently,
# shifting the stereo image on transients.

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Laptop Speakers"
      media.name       = "Laptop Speakers"

      filter.graph = {
        nodes = [
          { type = builtin name = s0_l      label = bq_peaking   control = { "Freq" = 342 "Q" = 0.696 "Gain" = 2.7 } }
          { type = builtin name = s1_l      label = bq_peaking   control = { "Freq" = 600 "Q" = 2 "Gain" = 2.5 } }
          { type = builtin name = s2_l      label = bq_peaking   control = { "Freq" = 813.3 "Q" = 2.197 "Gain" = 2.22 } }
          { type = builtin name = s3_l      label = bq_peaking   control = { "Freq" = 1716.5 "Q" = 1.358 "Gain" = 1.72 } }

          { type = builtin name = s0_r      label = bq_peaking   control = { "Freq" = 342 "Q" = 0.696 "Gain" = 2.7 } }
          { type = builtin name = s1_r      label = bq_peaking   control = { "Freq" = 600 "Q" = 2 "Gain" = 2.5 } }
          { type = builtin name = s2_r      label = bq_peaking   control = { "Freq" = 813.3 "Q" = 2.197 "Gain" = 2.22 } }
          { type = builtin name = s3_r      label = bq_peaking   control = { "Freq" = 1716.5 "Q" = 1.358 "Gain" = 1.72 } }
          { type   = lv2
            name   = limiter
            plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = {
              # Both default to enabled: "alr" regulates level toward the
              # threshold and "boost" normalises the threshold up to full
              # scale. A fixed tuning must switch them off or its tone drifts
              # with programme level.
              "alr"   = 0
              "boost" = 0
              "g_in"  = 0.794
              "th"    = 0.891
            }
          }
        ]

        links = [
          { output = "s0_l:Out" input = "s1_l:In" }
          { output = "s1_l:Out" input = "s2_l:In" }
          { output = "s2_l:Out" input = "s3_l:In" }
          { output = "s3_l:Out" input = "limiter:in_l" }
          { output = "s0_r:Out" input = "s1_r:In" }
          { output = "s1_r:Out" input = "s2_r:In" }
          { output = "s2_r:Out" input = "s3_r:In" }
          { output = "s3_r:Out" input = "limiter:in_r" }
        ]

        inputs  = [ "s0_l:In" "s0_r:In" ]
        outputs = [ "limiter:out_l" "limiter:out_r" ]
      }

      audio.channels = 2
      audio.position = [ FL FR ]

      capture.props = {
        node.name   = "omarchy_speaker_tuning"
        media.class = Audio/Sink
      }
      playback.props = {
        node.name     = "omarchy_speaker_tuning_output"
        node.passive  = true
        target.object = "@SPEAKER_SINK@"
        # Pinned for the same reasons as the other tunings: rerouting "all
        # streams" must not drag the processing onto another output, and the
        # output must wait for the speaker sink rather than fall back to
        # whatever default exists when the tuning host starts first.
        node.dont-move = true
        node.dont-fallback = true
        node.linger = true
      }
    }
  }
]
