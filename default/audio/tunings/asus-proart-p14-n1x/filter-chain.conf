# ASUS ProArt P14 H7407BA (NVIDIA N1x) speaker tuning.
#
# Starts from the static speaker voicing in ASUS's Dolby Atmos tuning for this
# laptop, which Windows applies on top of the Cirrus amplifier tuning: the
# speaker PEQ (600 Hz, +3 dB, Q 1.8) and the 20-band audio-optimizer curve,
# fitted with peaking sections to 0.06 dB RMS. The numbers are transcribed from
# the tuning file, not copied from it; see tuning.conf.
#
# That curve alone left vocals muddy here. On Windows, Dolby's dialog enhancer
# and intelligent EQ clear them up adaptively; neither has a static equivalent,
# so the low mids are voiced by ear on this laptop instead: Dolby's 230-300 Hz
# lifts become a 3.5 dB cut at 300 Hz, the 600 Hz bump drops from 3 to 0.5 dB,
# and a broad 2.5 dB lift at 2.5 kHz stands in for dialog enhancement, with the
# 3.8 kHz peak eased from 5 to 3.5 dB to balance it. Above 4 kHz it is Dolby's
# curve. It peaks at +5.5 dB around 3.7 kHz, so the limiter input is trimmed
# 2 dB and the limiter holds peaks at -1 dBFS.
#
# This assumes the amplifiers run ASUS's Cirrus tuning, as on Windows; on the
# amplifiers' ROM defaults the speakers are voiced differently underneath.
#
# Channels are wired explicitly because the limiter is a stereo plugin; a mono
# graph is duplicated per channel and would limit each side independently,
# shifting the stereo image on transients.

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Laptop Speakers"
      media.name       = "Laptop Speakers"

      filter.graph = {
        nodes = [
          { type = builtin name = s0_l      label = bq_peaking   control = { "Freq" = 300 "Q" = 0.9 "Gain" = -3.5 } }
          { type = builtin name = s1_l      label = bq_peaking   control = { "Freq" = 468.6 "Q" = 1.913 "Gain" = -2.29 } }
          { type = builtin name = s2_l      label = bq_peaking   control = { "Freq" = 600 "Q" = 1.8 "Gain" = 0.5 } }
          { type = builtin name = s3_l      label = bq_peaking   control = { "Freq" = 1035.6 "Q" = 3.177 "Gain" = 2.57 } }
          { type = builtin name = s4_l      label = bq_peaking   control = { "Freq" = 2500 "Q" = 0.9 "Gain" = 2.5 } }
          { type = builtin name = s5_l      label = bq_peaking   control = { "Freq" = 3816.2 "Q" = 1.713 "Gain" = 3.5 } }
          { type = builtin name = s6_l      label = bq_peaking   control = { "Freq" = 8999 "Q" = 2.552 "Gain" = 2 } }
          { type = builtin name = s7_l      label = bq_peaking   control = { "Freq" = 9241.9 "Q" = 0.676 "Gain" = 1.47 } }

          { type = builtin name = s0_r      label = bq_peaking   control = { "Freq" = 300 "Q" = 0.9 "Gain" = -3.5 } }
          { type = builtin name = s1_r      label = bq_peaking   control = { "Freq" = 468.6 "Q" = 1.913 "Gain" = -2.29 } }
          { type = builtin name = s2_r      label = bq_peaking   control = { "Freq" = 600 "Q" = 1.8 "Gain" = 0.5 } }
          { type = builtin name = s3_r      label = bq_peaking   control = { "Freq" = 1035.6 "Q" = 3.177 "Gain" = 2.57 } }
          { type = builtin name = s4_r      label = bq_peaking   control = { "Freq" = 2500 "Q" = 0.9 "Gain" = 2.5 } }
          { type = builtin name = s5_r      label = bq_peaking   control = { "Freq" = 3816.2 "Q" = 1.713 "Gain" = 3.5 } }
          { type = builtin name = s6_r      label = bq_peaking   control = { "Freq" = 8999 "Q" = 2.552 "Gain" = 2 } }
          { type = builtin name = s7_r      label = bq_peaking   control = { "Freq" = 9241.9 "Q" = 0.676 "Gain" = 1.47 } }
          { type   = lv2
            name   = limiter
            plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = {
              # Both default to enabled: "alr" regulates level toward the
              # threshold and "boost" normalises the threshold up to full
              # scale. A fixed tuning must switch them off or its tone drifts
              # with programme level.
              "alr"   = 0
              "boost" = 0
              "g_in"  = 0.794
              "th"    = 0.891
            }
          }
        ]

        links = [
          { output = "s0_l:Out" input = "s1_l:In" }
          { output = "s1_l:Out" input = "s2_l:In" }
          { output = "s2_l:Out" input = "s3_l:In" }
          { output = "s3_l:Out" input = "s4_l:In" }
          { output = "s4_l:Out" input = "s5_l:In" }
          { output = "s5_l:Out" input = "s6_l:In" }
          { output = "s6_l:Out" input = "s7_l:In" }
          { output = "s7_l:Out" input = "limiter:in_l" }
          { output = "s0_r:Out" input = "s1_r:In" }
          { output = "s1_r:Out" input = "s2_r:In" }
          { output = "s2_r:Out" input = "s3_r:In" }
          { output = "s3_r:Out" input = "s4_r:In" }
          { output = "s4_r:Out" input = "s5_r:In" }
          { output = "s5_r:Out" input = "s6_r:In" }
          { output = "s6_r:Out" input = "s7_r:In" }
          { output = "s7_r:Out" input = "limiter:in_r" }
        ]

        inputs  = [ "s0_l:In" "s0_r:In" ]
        outputs = [ "limiter:out_l" "limiter:out_r" ]
      }

      audio.channels = 2
      audio.position = [ FL FR ]

      capture.props = {
        node.name   = "omarchy_speaker_tuning"
        media.class = Audio/Sink
      }
      playback.props = {
        node.name     = "omarchy_speaker_tuning_output"
        node.passive  = true
        target.object = "@SPEAKER_SINK@"
        # Pinned for the same reasons as the XPS tuning: rerouting "all
        # streams" must not drag the processing onto another output, and the
        # output must wait for the speaker sink rather than fall back to
        # whatever default exists when the tuning host starts first.
        node.dont-move = true
        node.dont-fallback = true
        node.linger = true
      }
    }
  }
]
