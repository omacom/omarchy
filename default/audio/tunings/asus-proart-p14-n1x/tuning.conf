## ASUS ProArt P14 H7407BA (NVIDIA N1x) internal speakers.
##
## Eight biquads and a lookahead limiter, applied as a PipeWire filter-chain in
## front of the internal speaker sink. The Cirrus amplifiers carry ASUS's speaker
## protection and correction; this adds the voicing ASUS's Dolby Atmos layer
## applies on Windows.

description="ASUS ProArt P14 (H7407BA) speakers"

## The model number names this exact machine; its DMI product SKU is empty. The
## voicing also assumes the amplifiers run ASUS's tuning for this laptop, as on
## Windows: on their ROM defaults the speakers sound different underneath and
## this curve would not fit them. So match only once that tuning is installed.
asus_proart_p14_amps_tuned() {
  omarchy-hw-match "H7407BA" &&
    compgen -G "/usr/lib/firmware/cirrus/cs35l56-b0-dsp1-misc-104333a1-*" >/dev/null
}
match_command=asus_proart_p14_amps_tuned
## Unescaped dots: this is passed to awk as a string, where a backslash escape
## would be consumed before the regex sees it.
sink_pattern='^alsa_output.*mtk_sdw_mc.*HiFi__Speaker__sink$'

## Provenance. The speaker PEQ and the 20-band audio-optimizer curve of the
## internal-speaker endpoint (dynamic profile; music and movie carry the same
## speaker block) in ASUS's Dolby tuning for this laptop,
## SOUNDWIRE_SDCAFUNCTION_10_MAN_01FA_FUNC_4243_SUBSYS_33A11043.xml, tuning
## version 24, from the ASUS Dolby Atmos driver V11.506.650.32 for the H7407BA.
## Fitted with peaking sections to 0.06 dB RMS, then voiced by ear below 4 kHz
## (see filter-chain.conf). Nothing from the package is redistributed.
derived_from="ASUS Dolby Atmos tuning for SUBSYS_33A11043 (driver V11.506.650.32), voiced by ear"
validated_by="ryan"
validated_on="2026-10-02"
validated_hardware="ProArt P14 H7407BA, BIOS 302"

## Measured electrically on a copy of this graph feeding a null sink. The graph
## matches its design to 0.01 dB across the dense probe; the figure below is its
## deliberate departure from the Dolby curve, all of it below 4 kHz.
magnitude_rms_db="2.42"
bass_group_delay_swing_ms="0.61"
## On a synthetic hot master (pink noise, soft-clipped to -0.1 dBFS peaks):
## peaks reach the -1 dBFS threshold, so the limiter engages on loud masters,
## and loudness range drops 0.7 LU.
limiter_headroom_db="0.0"   ## worst-case peak on a hot master vs -1 dBFS
dynamic_range_delta_lu="-0.7"
