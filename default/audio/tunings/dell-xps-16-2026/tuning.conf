## Dell XPS 16 (2026) internal speakers.
##
## Seven biquads, a deep-bass stage and a lookahead limiter, applied as a
## PipeWire filter-chain in front of the internal speaker sink. The XPS 16 shares
## the XPS 14's amplifiers (four Cirrus CS35L57) and codec, but its amps load a
## separate Cirrus tuning project ("Performante 16" against the 14's "Hurracan
## 14"), so it is tuned on its own rather than inheriting the 14's profile.

description="Dell XPS 16 (2026) speakers"
## Matched on the DMI product SKU, which is what Dell keys the Cirrus speaker
## firmware on -- 10280dba for the XPS 16 -- so it identifies the speaker hardware
## itself rather than a marketing name. Compared as a whole value.
match_sku=("0DBA")
## Unescaped dots: this is passed to awk as a string, where a backslash escape
## would be consumed before the regex sees it.
sink_pattern='^alsa_output.*sof_sdw.*HiFi__Speaker__sink$'

## Provenance. Fitted by Omarchy Speaker Calibrator 1.2.0
## (https://github.com/thefreshoffice/omarchy-speaker-calibrator, MIT) from a
## swept-sine measurement at the listening position, neutral voicing, matched
## loudness, full bass. The microphone was a Shure SM7B on flat switches through
## a Focusrite Scarlett 2i2, with no calibration file: good enough to fit the
## broad balance, not a reference measurement. Re-measure with a calibrated
## measurement microphone before treating the figures below as describing the
## speakers rather than this fit.
derived_from="Omarchy Speaker Calibrator 1.2.0, swept-sine, Shure SM7B (uncalibrated)"
validated_by="spencerbull"
validated_on="2026-09-25"
validated_hardware="XPS 16 DA16260 (0DBA)"

## Measured by the calibrator on the rendered chain.
magnitude_rms_db="7.31"   ## against the calibrator's own target, perceptually weighted
bass_group_delay_swing_ms="11.0"
limiter_headroom_db="2.0"   ## pink noise peaking at -0.1 dBFS, against the -1 dBFS threshold
dynamic_range_delta_lu="0.0"
