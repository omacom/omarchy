# Dell XPS 16 (2026) speaker tuning.
#
# Fitted by the Omarchy Speaker Calibrator 1.2.0 from a swept-sine measurement
# of the internal speakers at the listening position: seven sections and a
# lookahead limiter. Cuts are preferred; the one boost, a +3 dB low shelf at
# 185 Hz, is paid for by the input gain, so peaks never exceed what the limiter
# is told to expect. The 50 Hz high-pass sits at the measured knee below which
# these drivers make no usable output. See tuning.conf for how it was measured.
#
# Channels are wired explicitly because the limiter is a stereo plugin; a mono
# graph is duplicated per channel and would limit each side independently,
# shifting the stereo image on bass transients.
#
# The hb_* nodes ahead of the EQ are deep bass: what lies below the knee
# (50 Hz), which these drivers cannot play, is saturated
# (0.976 * 1.45 * tanh(1.75 * x), the tanh written as
# 2/(1 + e^-2u) with exp and log, less a constant the high-pass removes) and
# its harmonics between the knee and three times the knee are added back, so
# the ear hears the note the speaker never made. Built-in nodes only, so the
# tuning needs no add-on beyond the limiter.

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Laptop Speakers"
      media.name       = "Laptop Speakers"

      filter.graph = {
        nodes = [
          { type = builtin name = hb_in_l  label = copy         }
          { type = builtin name = hb_cl_l  label = clamp        control = { "Min" = -10 "Max" = 10 } }
          { type = builtin name = hb_hp_l  label = bq_highpass  control = { "Freq" = 20 "Q" = 0.707 } }
          { type = builtin name = hb_lp_l  label = bq_lowpass   control = { "Freq" = 50 "Q" = 0.707 } }
          { type = builtin name = hb_g_l   label = linear       control = { "Mult" = 3.5 "Add" = 0 } }
          { type = builtin name = hb_e1_l  label = exp          control = { "Base" = 0.367879441 } }
          { type = builtin name = hb_p1_l  label = linear       control = { "Mult" = 1 "Add" = 1 } }
          { type = builtin name = hb_ln_l  label = log          control = { "Base" = 2.718281828 "M1" = 1 "M2" = 1 } }
          { type = builtin name = hb_e2_l  label = exp          control = { "Base" = 0.367879441 } }
          { type = builtin name = hb_out_l label = linear       control = { "Mult" = 2.830895 "Add" = -1.415448 } }
          { type = builtin name = hb_fh_l  label = bq_highpass  control = { "Freq" = 50 "Q" = 0.707 } }
          { type = builtin name = hb_fl_l  label = bq_lowpass   control = { "Freq" = 150 "Q" = 0.707 } }
          { type = builtin name = hb_mix_l label = mixer        control = { "Gain 1" = 1 "Gain 2" = 1 } }
          { type = builtin name = s0_l     label = bq_highpass   control = { "Freq" = 50 "Q" = 0.707 } }
          { type = builtin name = s1_l     label = bq_highpass   control = { "Freq" = 50 "Q" = 0.707 } }
          { type = builtin name = s2_l     label = bq_lowshelf   control = { "Freq" = 290.7 "Q" = 1 "Gain" = -4.63 } }
          { type = builtin name = s3_l     label = bq_lowshelf   control = { "Freq" = 184.9 "Q" = 0.707 "Gain" = 3 } }
          { type = builtin name = s4_l     label = bq_peaking    control = { "Freq" = 1080.1 "Q" = 2.305 "Gain" = -8.97 } }
          { type = builtin name = s5_l     label = bq_peaking    control = { "Freq" = 1588.7 "Q" = 1.143 "Gain" = -6.14 } }
          { type = builtin name = s6_l     label = bq_highshelf  control = { "Freq" = 1666.7 "Q" = 0.721 "Gain" = -14.51 } }

          { type = builtin name = hb_in_r  label = copy         }
          { type = builtin name = hb_cl_r  label = clamp        control = { "Min" = -10 "Max" = 10 } }
          { type = builtin name = hb_hp_r  label = bq_highpass  control = { "Freq" = 20 "Q" = 0.707 } }
          { type = builtin name = hb_lp_r  label = bq_lowpass   control = { "Freq" = 50 "Q" = 0.707 } }
          { type = builtin name = hb_g_r   label = linear       control = { "Mult" = 3.5 "Add" = 0 } }
          { type = builtin name = hb_e1_r  label = exp          control = { "Base" = 0.367879441 } }
          { type = builtin name = hb_p1_r  label = linear       control = { "Mult" = 1 "Add" = 1 } }
          { type = builtin name = hb_ln_r  label = log          control = { "Base" = 2.718281828 "M1" = 1 "M2" = 1 } }
          { type = builtin name = hb_e2_r  label = exp          control = { "Base" = 0.367879441 } }
          { type = builtin name = hb_out_r label = linear       control = { "Mult" = 2.830895 "Add" = -1.415448 } }
          { type = builtin name = hb_fh_r  label = bq_highpass  control = { "Freq" = 50 "Q" = 0.707 } }
          { type = builtin name = hb_fl_r  label = bq_lowpass   control = { "Freq" = 150 "Q" = 0.707 } }
          { type = builtin name = hb_mix_r label = mixer        control = { "Gain 1" = 1 "Gain 2" = 1 } }
          { type = builtin name = s0_r     label = bq_highpass   control = { "Freq" = 50 "Q" = 0.707 } }
          { type = builtin name = s1_r     label = bq_highpass   control = { "Freq" = 50 "Q" = 0.707 } }
          { type = builtin name = s2_r     label = bq_lowshelf   control = { "Freq" = 290.7 "Q" = 1 "Gain" = -4.63 } }
          { type = builtin name = s3_r     label = bq_lowshelf   control = { "Freq" = 184.9 "Q" = 0.707 "Gain" = 3 } }
          { type = builtin name = s4_r     label = bq_peaking    control = { "Freq" = 1080.1 "Q" = 2.305 "Gain" = -8.97 } }
          { type = builtin name = s5_r     label = bq_peaking    control = { "Freq" = 1588.7 "Q" = 1.143 "Gain" = -6.14 } }
          { type = builtin name = s6_r     label = bq_highshelf  control = { "Freq" = 1666.7 "Q" = 0.721 "Gain" = -14.51 } }

          { type   = lv2
            name   = limiter
            plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = {
              # Both default to enabled: "alr" regulates level toward the
              # threshold and "boost" normalises the threshold up to full
              # scale. A fixed tuning must switch them off or its tone drifts
              # with programme level.
              "alr"   = 0
              "boost" = 0
              "g_in"  = 1.7783
              "th"    = 0.891
              # On its default 5 ms the limiter's gain follows a bass cycle
              # and modulates everything played with it; at 15 ms it does not.
              "lk"    = 15.0
              "at"    = 15.0
            }
          }
        ]

        links = [
          { output = "hb_in_l:Out" input = "hb_cl_l:In" }
          { output = "hb_cl_l:Out" input = "hb_hp_l:In" }
          { output = "hb_hp_l:Out" input = "hb_lp_l:In" }
          { output = "hb_lp_l:Out" input = "hb_g_l:In" }
          { output = "hb_g_l:Out" input = "hb_e1_l:In" }
          { output = "hb_e1_l:Out" input = "hb_p1_l:In" }
          { output = "hb_p1_l:Out" input = "hb_ln_l:In" }
          { output = "hb_ln_l:Out" input = "hb_e2_l:In" }
          { output = "hb_e2_l:Out" input = "hb_out_l:In" }
          { output = "hb_out_l:Out" input = "hb_fh_l:In" }
          { output = "hb_fh_l:Out" input = "hb_fl_l:In" }
          { output = "hb_cl_l:Out" input = "hb_mix_l:In 1" }
          { output = "hb_fl_l:Out" input = "hb_mix_l:In 2" }
          { output = "hb_mix_l:Out" input = "s0_l:In" }
          { output = "s0_l:Out" input = "s1_l:In" }
          { output = "s1_l:Out" input = "s2_l:In" }
          { output = "s2_l:Out" input = "s3_l:In" }
          { output = "s3_l:Out" input = "s4_l:In" }
          { output = "s4_l:Out" input = "s5_l:In" }
          { output = "s5_l:Out" input = "s6_l:In" }
          { output = "s6_l:Out" input = "limiter:in_l" }
          { output = "hb_in_r:Out" input = "hb_cl_r:In" }
          { output = "hb_cl_r:Out" input = "hb_hp_r:In" }
          { output = "hb_hp_r:Out" input = "hb_lp_r:In" }
          { output = "hb_lp_r:Out" input = "hb_g_r:In" }
          { output = "hb_g_r:Out" input = "hb_e1_r:In" }
          { output = "hb_e1_r:Out" input = "hb_p1_r:In" }
          { output = "hb_p1_r:Out" input = "hb_ln_r:In" }
          { output = "hb_ln_r:Out" input = "hb_e2_r:In" }
          { output = "hb_e2_r:Out" input = "hb_out_r:In" }
          { output = "hb_out_r:Out" input = "hb_fh_r:In" }
          { output = "hb_fh_r:Out" input = "hb_fl_r:In" }
          { output = "hb_cl_r:Out" input = "hb_mix_r:In 1" }
          { output = "hb_fl_r:Out" input = "hb_mix_r:In 2" }
          { output = "hb_mix_r:Out" input = "s0_r:In" }
          { output = "s0_r:Out" input = "s1_r:In" }
          { output = "s1_r:Out" input = "s2_r:In" }
          { output = "s2_r:Out" input = "s3_r:In" }
          { output = "s3_r:Out" input = "s4_r:In" }
          { output = "s4_r:Out" input = "s5_r:In" }
          { output = "s5_r:Out" input = "s6_r:In" }
          { output = "s6_r:Out" input = "limiter:in_r" }
        ]

        inputs  = [ "hb_in_l:In" "hb_in_r:In" ]
        outputs = [ "limiter:out_l" "limiter:out_r" ]
      }

      audio.channels = 2
      audio.position = [ FL FR ]

      capture.props = {
        node.name   = "omarchy_speaker_tuning"
        media.class = Audio/Sink
      }
      playback.props = {
        node.name     = "omarchy_speaker_tuning_output"
        node.passive  = true
        target.object = "@SPEAKER_SINK@"
        # The filter's output is a movable sink input like any other; pinned so
        # that rerouting "all streams" cannot drag the processing along.
        node.dont-move = true
        # Wait for the named target rather than linking to whatever default
        # exists while the speaker sink is still being discovered.
        node.dont-fallback = true
        node.linger = true
      }
    }
  }
]
