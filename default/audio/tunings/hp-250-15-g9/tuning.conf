## HP 250 15.6 G9 Notebook PC internal speakers.
##
## Five biquads and a lookahead limiter, applied as a PipeWire filter-chain in
## front of the internal speaker sink. There is no vendor tuning to transcribe:
## Windows drives these speakers through Realtek's own DSP layer, so the curve
## is voiced by ear on the machine (see filter-chain.conf).

description="HP 250 15.6 G9 Notebook PC speakers"

## The DMI product name distinguishes the G9 from the 250's other generations
## (G10, G11, ...), which ship different speakers and need their own voicing.
match_dmi=("HP 250 15.6 inch G9")
sink_pattern='^alsa_output.*skl_hda_dsp_generic.HiFi__Speaker__sink$'

## Provenance: nothing transcribable exists for this machine. The voicing is
## by-ear, developed with the user on the validated hardware, so its reference
## is flat rather than a vendor or measured target curve.
derived_from="voiced by ear; Realtek ALC236 on SOF HDA DSP, no vendor tuning available"
validated_by="ansonboby"
validated_on="2026-11-12"
validated_hardware="HP 250 15.6 G9 Notebook PC, board A1XB0LS#ACH"

## Measured electrically on this machine: the tuning rendered with the real
## loader, tones and noise played into it, and the physical speaker sink's
## monitor captured (post-chain, upstream of the volume control) with the
## speakers muted. Per-tone gains track the designed cascade within 0.08 dB
## across 40 Hz-8 kHz.
## Deviation from the flat reference it was voiced to, 20 Hz-20 kHz.
magnitude_rms_db="6.19"
bass_group_delay_swing_ms="4.59"
## Worst measured peak against the -1 dBFS limiter threshold (th = 0.891),
## driven with full-scale 100 Hz and broadband noise: ceiling held at 0.8832.
limiter_headroom_db="-0.08"
## Same noise at -24.8 and -7.9 dBFS through the chain: gain identical
## (-2.43 dB both), so the peak limiter does not compress programme.
dynamic_range_delta_lu="0.0"
