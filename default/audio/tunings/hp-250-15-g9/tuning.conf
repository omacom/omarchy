## HP 250 15.6 G9 Notebook PC internal speakers.
##
## Four biquads and a lookahead limiter, applied as a PipeWire filter-chain in
## front of the internal speaker sink. There is no vendor tuning to transcribe:
## Windows drives these speakers through Realtek's own DSP layer, so the curve
## is voiced by ear on the machine (see filter-chain.conf).

description="HP 250 15.6 G9 Notebook PC speakers"

## The DMI product name distinguishes the G9 from the 250's other generations
## (G10, G11, ...), which ship different speakers and need their own voicing.
match_dmi=("HP 250 15.6 inch G9")
sink_pattern='^alsa_output.*skl_hda_dsp_generic.HiFi__Speaker__sink$'

## Provenance: nothing transcribable exists for this machine. The voicing is
## by-ear, developed with the user on the validated hardware. No figures are
## claimed from a measurement rig.
derived_from="voiced by ear; Realtek ALC236 on SOF HDA DSP, no vendor tuning available"
validated_by="ansonboby"
validated_on="2026-11-12"
validated_hardware="HP 250 15.6 G9 Notebook PC, board A1XB0LS#ACH"
