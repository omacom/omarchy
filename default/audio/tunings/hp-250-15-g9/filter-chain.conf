# HP 250 15.6 G9 Notebook PC (ALC236, sof-hda-dsp) speaker tuning.
#
# No vendor tuning is available for this laptop: Windows runs Realtek's own DSP
# layer invisibly, and Linux feeds the speakers raw, so the stock path is thin,
# quiet, and breaks up when pushed. This curve is voiced by ear on the machine.
#
# The 15.6" 2-way pair booms in the low mids and rolls off below ~110 Hz: a
# high-pass at 90 Hz strips what the drivers cannot deliver anyway (excursion
# and breakup, not output), a +7 dB low shelf at 130 Hz brings the bottom back,
# a 3 dB cut at 300 Hz keeps the boom out of vocals, and 2.5/4 kHz lifts
# restore presence and intelligibility. The shelf and the high-pass overlap
# only in the 110-130 Hz knee, where the shelf still holds +6 dB. The
# cumulative worst case is +3 dB above the knee (the 2.5/4 kHz lifts over the
# 300 Hz cut), so the limiter input is trimmed 3 dB, and the limiter holds
# peaks at -1 dBFS so the volume can be pushed without clipping the DAC or the
# amplifier.
#
# Verified electrically on the machine (capturing the speaker sink's monitor,
# speakers muted): per-tone gains match this cascade within ~0.4 dB across
# 40 Hz-8 kHz, the 40 Hz net cut measures -7.3 dB, and the limiter passes a
# full-scale 40 Hz tone untouched (out peak 0.298, predicted 0.301) while
# holding full-scale 100 Hz and broadband content at 0.883 (-1.06 dBFS).
#
# Channels are wired explicitly because the limiter is a stereo plugin; a mono
# graph is duplicated per channel and would limit each side independently,
# shifting the stereo image on transients.

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Laptop Speakers"
      media.name       = "Laptop Speakers"

      filter.graph = {
        nodes = [
          { type = builtin name = s0_l label = bq_highpass control = { "Freq" = 90 "Q" = 0.7 } }
          { type = builtin name = s1_l label = bq_lowshelf control = { "Freq" = 130 "Q" = 0.8 "Gain" = 7 } }
          { type = builtin name = s2_l label = bq_peaking  control = { "Freq" = 300 "Q" = 1.0 "Gain" = -3 } }
          { type = builtin name = s3_l label = bq_peaking  control = { "Freq" = 2500 "Q" = 1.0 "Gain" = 2 } }
          { type = builtin name = s4_l label = bq_peaking  control = { "Freq" = 4000 "Q" = 1.4 "Gain" = 2 } }

          { type = builtin name = s0_r label = bq_highpass control = { "Freq" = 90 "Q" = 0.7 } }
          { type = builtin name = s1_r label = bq_lowshelf control = { "Freq" = 130 "Q" = 0.8 "Gain" = 7 } }
          { type = builtin name = s2_r label = bq_peaking  control = { "Freq" = 300 "Q" = 1.0 "Gain" = -3 } }
          { type = builtin name = s3_r label = bq_peaking  control = { "Freq" = 2500 "Q" = 1.0 "Gain" = 2 } }
          { type = builtin name = s4_r label = bq_peaking  control = { "Freq" = 4000 "Q" = 1.4 "Gain" = 2 } }

          { type   = lv2
            name   = limiter
            plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = {
              # Both default to enabled: "alr" regulates level toward the
              # threshold and "boost" normalises the threshold up to full
              # scale. A fixed tuning must switch them off or its tone drifts
              # with programme level.
              "alr"   = 0
              "boost" = 0
              "g_in"  = 0.708
              "th"    = 0.891
            }
          }
        ]

        links = [
          { output = "s0_l:Out" input = "s1_l:In" }
          { output = "s1_l:Out" input = "s2_l:In" }
          { output = "s2_l:Out" input = "s3_l:In" }
          { output = "s3_l:Out" input = "s4_l:In" }
          { output = "s4_l:Out" input = "limiter:in_l" }
          { output = "s0_r:Out" input = "s1_r:In" }
          { output = "s1_r:Out" input = "s2_r:In" }
          { output = "s2_r:Out" input = "s3_r:In" }
          { output = "s3_r:Out" input = "s4_r:In" }
          { output = "s4_r:Out" input = "limiter:in_r" }
        ]

        inputs  = [ "s0_l:In" "s0_r:In" ]
        outputs = [ "limiter:out_l" "limiter:out_r" ]
      }

      audio.channels = 2
      audio.position = [ FL FR ]

      capture.props = {
        node.name   = "omarchy_speaker_tuning"
        media.class = Audio/Sink
      }
      playback.props = {
        node.name     = "omarchy_speaker_tuning_output"
        node.passive  = true
        target.object = "@SPEAKER_SINK@"
        # Pinned for the same reasons as the XPS tuning: rerouting "all
        # streams" must not drag the processing onto another output, and the
        # output must wait for the speaker sink rather than fall back to
        # whatever default exists when the tuning host starts first.
        node.dont-move = true
        node.dont-fallback = true
        node.linger = true
      }
    }
  }
]
