# ASUS Zenbook A16 UX3607OA (Snapdragon X2 Elite) speaker tuning.
#
# Per-driver acoustic tuning measured on this machine with a Shure MV7+
# (manual mode, all onboard DSP off, approximate +2.8 dB @ 4.2 kHz capsule
# presence curve compensated). The four WSA8845 amplifiers are exposed as four
# channels -- woofers on FL/FR, tweeters on RL/RR.
#
# A shared 135 Hz 4th-order Linkwitz-Riley high-pass protects the woofers right
# above their ~130 Hz excursion knee, followed by a phase-aligned 2000 Hz
# 4th-order Linkwitz-Riley (LR4) crossover that hands off before the woofers'
# 2.5-2.7 kHz breakup null where the tweeters are already clean (<2% THD at
# 1.5 kHz). Each driver pair gets targeted resonance correction (all positive
# boosts Q <= 2.2) and makeup gain into its own stereo lookahead limiter
# holding peaks at -1 dBFS.

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Laptop Speakers"
      media.name       = "Laptop Speakers"

      filter.graph = {
        nodes = [
          { type = builtin name = hp0_l       label = bq_highpass  control = { "Freq" = 135.0 "Q" = 0.7071 } }
          { type = builtin name = hp1_l       label = bq_highpass  control = { "Freq" = 135.0 "Q" = 0.7071 } }
          { type = builtin name = xlo0_l      label = bq_lowpass   control = { "Freq" = 2000.0 "Q" = 0.7071 } }
          { type = builtin name = xlo1_l      label = bq_lowpass   control = { "Freq" = 2000.0 "Q" = 0.7071 } }
          { type = builtin name = weq0_l      label = bq_peaking   control = { "Freq" = 195.0 "Q" = 0.8000 "Gain" = 4.50 } }
          { type = builtin name = weq1_l      label = bq_peaking   control = { "Freq" = 545.0 "Q" = 2.0000 "Gain" = -4.50 } }
          { type = builtin name = weq2_l      label = bq_peaking   control = { "Freq" = 915.0 "Q" = 2.2000 "Gain" = 5.00 } }
          { type = builtin name = weq3_l      label = bq_peaking   control = { "Freq" = 1220.0 "Q" = 3.0000 "Gain" = -6.00 } }
          { type = builtin name = weq4_l      label = bq_peaking   control = { "Freq" = 1570.0 "Q" = 2.2000 "Gain" = 3.00 } }
          { type = builtin name = xhi0_l      label = bq_highpass  control = { "Freq" = 2000.0 "Q" = 0.7071 } }
          { type = builtin name = xhi1_l      label = bq_highpass  control = { "Freq" = 2000.0 "Q" = 0.7071 } }
          { type = builtin name = teq0_l      label = bq_peaking   control = { "Freq" = 2750.0 "Q" = 2.0000 "Gain" = 2.50 } }
          { type = builtin name = teq1_l      label = bq_peaking   control = { "Freq" = 3950.0 "Q" = 2.2000 "Gain" = -6.00 } }
          { type = builtin name = teq2_l      label = bq_peaking   control = { "Freq" = 5300.0 "Q" = 2.0000 "Gain" = 3.50 } }
          { type = builtin name = teq3_l      label = bq_peaking   control = { "Freq" = 7150.0 "Q" = 3.5000 "Gain" = -7.50 } }
          { type = builtin name = teq4_l      label = bq_highshelf control = { "Freq" = 9200.0 "Q" = 0.7071 "Gain" = 2.50 } }

          { type = builtin name = hp0_r       label = bq_highpass  control = { "Freq" = 135.0 "Q" = 0.7071 } }
          { type = builtin name = hp1_r       label = bq_highpass  control = { "Freq" = 135.0 "Q" = 0.7071 } }
          { type = builtin name = xlo0_r      label = bq_lowpass   control = { "Freq" = 2000.0 "Q" = 0.7071 } }
          { type = builtin name = xlo1_r      label = bq_lowpass   control = { "Freq" = 2000.0 "Q" = 0.7071 } }
          { type = builtin name = weq0_r      label = bq_peaking   control = { "Freq" = 195.0 "Q" = 0.8000 "Gain" = 4.50 } }
          { type = builtin name = weq1_r      label = bq_peaking   control = { "Freq" = 545.0 "Q" = 2.0000 "Gain" = -4.50 } }
          { type = builtin name = weq2_r      label = bq_peaking   control = { "Freq" = 915.0 "Q" = 2.2000 "Gain" = 5.00 } }
          { type = builtin name = weq3_r      label = bq_peaking   control = { "Freq" = 1220.0 "Q" = 3.0000 "Gain" = -6.00 } }
          { type = builtin name = weq4_r      label = bq_peaking   control = { "Freq" = 1570.0 "Q" = 2.2000 "Gain" = 3.00 } }
          { type = builtin name = xhi0_r      label = bq_highpass  control = { "Freq" = 2000.0 "Q" = 0.7071 } }
          { type = builtin name = xhi1_r      label = bq_highpass  control = { "Freq" = 2000.0 "Q" = 0.7071 } }
          { type = builtin name = teq0_r      label = bq_peaking   control = { "Freq" = 2750.0 "Q" = 2.0000 "Gain" = 2.50 } }
          { type = builtin name = teq1_r      label = bq_peaking   control = { "Freq" = 3950.0 "Q" = 2.2000 "Gain" = -6.00 } }
          { type = builtin name = teq2_r      label = bq_peaking   control = { "Freq" = 5300.0 "Q" = 2.0000 "Gain" = 3.50 } }
          { type = builtin name = teq3_r      label = bq_peaking   control = { "Freq" = 7150.0 "Q" = 3.5000 "Gain" = -7.50 } }
          { type = builtin name = teq4_r      label = bq_highshelf control = { "Freq" = 9200.0 "Q" = 0.7071 "Gain" = 2.50 } }

          { type   = lv2
            name   = lim_woofer
            plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = {
              # Both default to enabled and add programme-dependent gain; a
              # fixed tuning switches them off so its tone does not drift.
              "alr"   = 0
              "boost" = 0
              "g_in"  = 1.4500
              "th"    = 0.891
            }
          }
          { type   = lv2
            name   = lim_tweeter
            plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = {
              # Both default to enabled and add programme-dependent gain; a
              # fixed tuning switches them off so its tone does not drift.
              "alr"   = 0
              "boost" = 0
              "g_in"  = 1.4500
              "th"    = 0.891
            }
          }
        ]

        links = [
          { output = "hp0_l:Out" input = "hp1_l:In" }
          { output = "hp1_l:Out" input = "xlo0_l:In" }
          { output = "xlo0_l:Out" input = "xlo1_l:In" }
          { output = "xlo1_l:Out" input = "weq0_l:In" }
          { output = "weq0_l:Out" input = "weq1_l:In" }
          { output = "weq1_l:Out" input = "weq2_l:In" }
          { output = "weq2_l:Out" input = "weq3_l:In" }
          { output = "weq3_l:Out" input = "weq4_l:In" }
          { output = "weq4_l:Out" input = "lim_woofer:in_l" }
          { output = "hp1_l:Out" input = "xhi0_l:In" }
          { output = "xhi0_l:Out" input = "xhi1_l:In" }
          { output = "xhi1_l:Out" input = "teq0_l:In" }
          { output = "teq0_l:Out" input = "teq1_l:In" }
          { output = "teq1_l:Out" input = "teq2_l:In" }
          { output = "teq2_l:Out" input = "teq3_l:In" }
          { output = "teq3_l:Out" input = "teq4_l:In" }
          { output = "teq4_l:Out" input = "lim_tweeter:in_l" }
          { output = "hp0_r:Out" input = "hp1_r:In" }
          { output = "hp1_r:Out" input = "xlo0_r:In" }
          { output = "xlo0_r:Out" input = "xlo1_r:In" }
          { output = "xlo1_r:Out" input = "weq0_r:In" }
          { output = "weq0_r:Out" input = "weq1_r:In" }
          { output = "weq1_r:Out" input = "weq2_r:In" }
          { output = "weq2_r:Out" input = "weq3_r:In" }
          { output = "weq3_r:Out" input = "weq4_r:In" }
          { output = "weq4_r:Out" input = "lim_woofer:in_r" }
          { output = "hp1_r:Out" input = "xhi0_r:In" }
          { output = "xhi0_r:Out" input = "xhi1_r:In" }
          { output = "xhi1_r:Out" input = "teq0_r:In" }
          { output = "teq0_r:Out" input = "teq1_r:In" }
          { output = "teq1_r:Out" input = "teq2_r:In" }
          { output = "teq2_r:Out" input = "teq3_r:In" }
          { output = "teq3_r:Out" input = "teq4_r:In" }
          { output = "teq4_r:Out" input = "lim_tweeter:in_r" }
        ]

        inputs  = [ "hp0_l:In" "hp0_r:In" ]
        outputs = [ "lim_woofer:out_l" "lim_woofer:out_r" "lim_tweeter:out_l" "lim_tweeter:out_r" ]
      }

      capture.props = {
        node.name      = "omarchy_speaker_tuning"
        media.class    = Audio/Sink
        audio.channels = 2
        audio.position = [ FL FR ]
      }
      # The speaker sink is 4 channels: woofers on FL/FR, tweeters on RL/RR.
      playback.props = {
        node.name          = "omarchy_speaker_tuning_output"
        node.passive       = true
        node.dont-move     = true
        # Wait for the speaker sink rather than link to whatever default exists
        # when the host starts first. Both are needed: without linger,
        # WirePlumber destroys the node instead of waiting (see the XPS tuning).
        node.dont-fallback = true
        node.linger        = true
        target.object      = "@SPEAKER_SINK@"
        audio.channels     = 4
        audio.position     = [ FL FR RL RR ]
      }
    }
  }
]
