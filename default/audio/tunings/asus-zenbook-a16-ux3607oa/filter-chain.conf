# ASUS Zenbook A16 UX3607OA (Snapdragon X2 Elite) speaker tuning.
#
# Starts from the static speaker voicing in ASUS's Dolby Atmos tuning for this
# laptop: the speaker PEQ (380 Hz -4 dB, 495 Hz -9.3 dB, 1450 Hz +4 dB, 7900 Hz
# -5 dB) as is, and the 20-band audio-optimizer curve fitted with eight
# peaking/shelf sections to 0.22 dB RMS. The fit's -1.92 dB broadband gain rides
# on the limiters' input gain. The numbers are transcribed from the tuning file,
# not copied from it; see tuning.conf.
#
# Unlike the Cirrus laptops, the four amplifiers here are four channels of the
# speaker sink -- woofers on FL/FR, tweeters on RL/RR -- and on Linux each gets
# the full band. Windows splits them in Qualcomm's DSP with a 3 kHz 4th-order
# Butterworth crossover, read from ASUS's Qualcomm calibration; this graph
# applies the same one after the EQ.
#
# A 100 Hz high-pass leads the chain. ASUS's curve lifts 140-230 Hz by 4-5 dB,
# but the woofers produce almost nothing that low, and the Windows speaker
# protection that guards their excursion there has no Linux counterpart.
#
# Each pair ends in its own stereo lookahead limiter holding peaks at -1 dBFS,
# so the stereo image stays put on transients and every output is limited.

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Laptop Speakers"
      media.name       = "Laptop Speakers"

      filter.graph = {
        nodes = [
          { type = builtin name = eq0_l      label = bq_highpass  control = { "Freq" = 100.0 "Q" = 0.7071 } }
          { type = builtin name = eq1_l      label = bq_peaking   control = { "Freq" = 380.0 "Q" = 5.0000 "Gain" = -4.00 } }
          { type = builtin name = eq2_l      label = bq_peaking   control = { "Freq" = 495.0 "Q" = 5.0000 "Gain" = -9.30 } }
          { type = builtin name = eq3_l      label = bq_peaking   control = { "Freq" = 1450.0 "Q" = 4.0000 "Gain" = 4.00 } }
          { type = builtin name = eq4_l      label = bq_peaking   control = { "Freq" = 7900.0 "Q" = 6.0000 "Gain" = -5.00 } }
          { type = builtin name = eq5_l      label = bq_peaking   control = { "Freq" = 185.8 "Q" = 0.5470 "Gain" = 8.00 } }
          { type = builtin name = eq6_l      label = bq_peaking   control = { "Freq" = 357.7 "Q" = 1.5390 "Gain" = -5.35 } }
          { type = builtin name = eq7_l      label = bq_peaking   control = { "Freq" = 671.4 "Q" = 3.5990 "Gain" = 2.27 } }
          { type = builtin name = eq8_l      label = bq_peaking   control = { "Freq" = 1259.6 "Q" = 0.8900 "Gain" = -6.80 } }
          { type = builtin name = eq9_l      label = bq_peaking   control = { "Freq" = 1687.3 "Q" = 2.6660 "Gain" = 5.32 } }
          { type = builtin name = eq10_l     label = bq_peaking   control = { "Freq" = 3399.6 "Q" = 1.9050 "Gain" = -2.55 } }
          { type = builtin name = eq11_l     label = bq_peaking   control = { "Freq" = 4300.0 "Q" = 0.4000 "Gain" = -0.47 } }
          { type = builtin name = eq12_l     label = bq_highshelf control = { "Freq" = 8440.6 "Q" = 1.5000 "Gain" = 2.14 } }
          { type = builtin name = xlo0_l     label = bq_lowpass   control = { "Freq" = 3000.0 "Q" = 0.5412 } }
          { type = builtin name = xlo1_l     label = bq_lowpass   control = { "Freq" = 3000.0 "Q" = 1.3065 } }
          { type = builtin name = xhi0_l     label = bq_highpass  control = { "Freq" = 3000.0 "Q" = 0.5412 } }
          { type = builtin name = xhi1_l     label = bq_highpass  control = { "Freq" = 3000.0 "Q" = 1.3065 } }

          { type = builtin name = eq0_r      label = bq_highpass  control = { "Freq" = 100.0 "Q" = 0.7071 } }
          { type = builtin name = eq1_r      label = bq_peaking   control = { "Freq" = 380.0 "Q" = 5.0000 "Gain" = -4.00 } }
          { type = builtin name = eq2_r      label = bq_peaking   control = { "Freq" = 495.0 "Q" = 5.0000 "Gain" = -9.30 } }
          { type = builtin name = eq3_r      label = bq_peaking   control = { "Freq" = 1450.0 "Q" = 4.0000 "Gain" = 4.00 } }
          { type = builtin name = eq4_r      label = bq_peaking   control = { "Freq" = 7900.0 "Q" = 6.0000 "Gain" = -5.00 } }
          { type = builtin name = eq5_r      label = bq_peaking   control = { "Freq" = 185.8 "Q" = 0.5470 "Gain" = 8.00 } }
          { type = builtin name = eq6_r      label = bq_peaking   control = { "Freq" = 357.7 "Q" = 1.5390 "Gain" = -5.35 } }
          { type = builtin name = eq7_r      label = bq_peaking   control = { "Freq" = 671.4 "Q" = 3.5990 "Gain" = 2.27 } }
          { type = builtin name = eq8_r      label = bq_peaking   control = { "Freq" = 1259.6 "Q" = 0.8900 "Gain" = -6.80 } }
          { type = builtin name = eq9_r      label = bq_peaking   control = { "Freq" = 1687.3 "Q" = 2.6660 "Gain" = 5.32 } }
          { type = builtin name = eq10_r     label = bq_peaking   control = { "Freq" = 3399.6 "Q" = 1.9050 "Gain" = -2.55 } }
          { type = builtin name = eq11_r     label = bq_peaking   control = { "Freq" = 4300.0 "Q" = 0.4000 "Gain" = -0.47 } }
          { type = builtin name = eq12_r     label = bq_highshelf control = { "Freq" = 8440.6 "Q" = 1.5000 "Gain" = 2.14 } }
          { type = builtin name = xlo0_r     label = bq_lowpass   control = { "Freq" = 3000.0 "Q" = 0.5412 } }
          { type = builtin name = xlo1_r     label = bq_lowpass   control = { "Freq" = 3000.0 "Q" = 1.3065 } }
          { type = builtin name = xhi0_r     label = bq_highpass  control = { "Freq" = 3000.0 "Q" = 0.5412 } }
          { type = builtin name = xhi1_r     label = bq_highpass  control = { "Freq" = 3000.0 "Q" = 1.3065 } }
          { type   = lv2
            name   = lim_woofer
            plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = {
              # Both default to enabled and add programme-dependent gain; a
              # fixed tuning switches them off so its tone does not drift.
              "alr"   = 0
              "boost" = 0
              "g_in"  = 0.8017
              "th"    = 0.891
            }
          }
          { type   = lv2
            name   = lim_tweeter
            plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = {
              # Both default to enabled and add programme-dependent gain; a
              # fixed tuning switches them off so its tone does not drift.
              "alr"   = 0
              "boost" = 0
              "g_in"  = 0.8017
              "th"    = 0.891
            }
          }
        ]

        links = [
          { output = "eq0_l:Out" input = "eq1_l:In" }
          { output = "eq1_l:Out" input = "eq2_l:In" }
          { output = "eq2_l:Out" input = "eq3_l:In" }
          { output = "eq3_l:Out" input = "eq4_l:In" }
          { output = "eq4_l:Out" input = "eq5_l:In" }
          { output = "eq5_l:Out" input = "eq6_l:In" }
          { output = "eq6_l:Out" input = "eq7_l:In" }
          { output = "eq7_l:Out" input = "eq8_l:In" }
          { output = "eq8_l:Out" input = "eq9_l:In" }
          { output = "eq9_l:Out" input = "eq10_l:In" }
          { output = "eq10_l:Out" input = "eq11_l:In" }
          { output = "eq11_l:Out" input = "eq12_l:In" }
          { output = "eq12_l:Out" input = "xlo0_l:In" }
          { output = "xlo0_l:Out" input = "xlo1_l:In" }
          { output = "xlo1_l:Out" input = "lim_woofer:in_l" }
          { output = "eq12_l:Out" input = "xhi0_l:In" }
          { output = "xhi0_l:Out" input = "xhi1_l:In" }
          { output = "xhi1_l:Out" input = "lim_tweeter:in_l" }
          { output = "eq0_r:Out" input = "eq1_r:In" }
          { output = "eq1_r:Out" input = "eq2_r:In" }
          { output = "eq2_r:Out" input = "eq3_r:In" }
          { output = "eq3_r:Out" input = "eq4_r:In" }
          { output = "eq4_r:Out" input = "eq5_r:In" }
          { output = "eq5_r:Out" input = "eq6_r:In" }
          { output = "eq6_r:Out" input = "eq7_r:In" }
          { output = "eq7_r:Out" input = "eq8_r:In" }
          { output = "eq8_r:Out" input = "eq9_r:In" }
          { output = "eq9_r:Out" input = "eq10_r:In" }
          { output = "eq10_r:Out" input = "eq11_r:In" }
          { output = "eq11_r:Out" input = "eq12_r:In" }
          { output = "eq12_r:Out" input = "xlo0_r:In" }
          { output = "xlo0_r:Out" input = "xlo1_r:In" }
          { output = "xlo1_r:Out" input = "lim_woofer:in_r" }
          { output = "eq12_r:Out" input = "xhi0_r:In" }
          { output = "xhi0_r:Out" input = "xhi1_r:In" }
          { output = "xhi1_r:Out" input = "lim_tweeter:in_r" }
        ]

        inputs  = [ "eq0_l:In" "eq0_r:In" ]
        outputs = [ "lim_woofer:out_l" "lim_woofer:out_r" "lim_tweeter:out_l" "lim_tweeter:out_r" ]
      }

      capture.props = {
        node.name      = "omarchy_speaker_tuning"
        media.class    = Audio/Sink
        audio.channels = 2
        audio.position = [ FL FR ]
      }
      # The speaker sink is 4 channels: woofers on FL/FR, tweeters on RL/RR.
      playback.props = {
        node.name          = "omarchy_speaker_tuning_output"
        node.passive       = true
        node.dont-move     = true
        # Wait for the speaker sink rather than link to whatever default exists
        # when the host starts first. Both are needed: without linger,
        # WirePlumber destroys the node instead of waiting (see the XPS tuning).
        node.dont-fallback = true
        node.linger        = true
        target.object      = "@SPEAKER_SINK@"
        audio.channels     = 4
        audio.position     = [ FL FR RL RR ]
      }
    }
  }
]
