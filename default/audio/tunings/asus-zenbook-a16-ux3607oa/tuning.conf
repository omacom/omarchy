## ASUS Zenbook A16 UX3607OA (Snapdragon X2 Elite) internal speakers.
##
## Four WSA8845 amplifiers, a woofer and a tweeter per side, which the speaker
## sink exposes as four channels: woofers on FL/FR, tweeters on RL/RR. Linux
## sends every channel the full band, so this graph protects the woofers with a
## shared 135 Hz 4th-order Linkwitz-Riley high-pass, splits the pairs with a
## 2 kHz 4th-order Linkwitz-Riley crossover (below the woofers' 2.5-2.7 kHz
## breakup null), applies per-driver resonance correction (all positive boosts
## Q <= 2.2) and makeup gain, and ends each pair in a stereo lookahead limiter
## holding peaks at -1.0 dBFS.

description="ASUS Zenbook A16 (UX3607OA) speakers"

## The model number names this exact machine (product_sku is empty in DMI). The
## speakers only exist with the asus-zenbook-a16-audio package from
## omarchy-pkgs, which gives the card its topology and UCM profile; without it
## there is no speaker sink to match.
match_dmi=("UX3607OA")
## Unescaped dots: this is passed to awk as a string, where a backslash escape
## would be consumed before the regex sees it.
sink_pattern='^alsa_output.*platform-sound.*HiFi__Speaker__sink$'

## Provenance. Replaces the earlier ASUS Dolby Atmos / Qualcomm ACDB
## transcription (which ran at g_in=0.8017 with a -9.3 dB 495 Hz cut and 3 kHz
## Butterworth crossover across the woofer breakup null) with a per-driver
## acoustic tuning measured at a single near-field listening position using a
## Shure MV7+ with all onboard DSP disabled via USB HID (manual mode,
## auto-level/denoiser/HPF/popper-stopper/compressor/limiter/reverb off,
## tone 0) and approximate compensation for the capsule's ~4 kHz presence rise:
##   - Isolated woofer (FL/FR) and tweeter (RL/RR) 98-tone transfer functions
##     (40-16000 Hz) plus polarity verification confirming physical phase
##     alignment between pairs.
##   - Raw driver THD envelopes across -12 to -1 dBFS locating woofer excursion
##     roll-off below ~130 Hz (5-7% THD) and tweeter linearity down to 1.5 kHz
##     (<2% THD), guiding the 135 Hz 4th-order LR4 HPF and 2 kHz LR4 handoff.
##   - Per-driver EQ correcting woofer cabinet resonances (545/1220 Hz) and
##     tweeter peaks (3950/7150 Hz) with wide boosts (Q <= 2.2) and +3.23 dB
##     makeup gain (g_in=1.45), improving 250-8500 Hz flatness from 5.65 to
##     4.50 dB std dev and adding ~8 dB midrange loudness over the prior shipped
##     profile while keeping -6 dBFS acoustic THD below 3.6% from 200 Hz upward.
derived_from="Per-driver acoustic measurement (Shure MV7+, onboard DSP off) and THD envelope on Zenbook A16 UX3607OA"
validated_by="dhh"
validated_on="2026-11-26"
validated_hardware="Zenbook A16 UX3607OA, BIOS UX3607OA.312"

## Measured electrically on a copy of this graph feeding a 48 kHz 4-channel
## null sink (FL,FR,RL,RR; see docs/audio-tuning.md). Matches its analytical RBJ
## biquad design across 104 tones (30-19000 Hz) to 0.00 dB RMS (0.006 dB max,
## 0.000 dB L/R delta).
magnitude_rms_db="0.00"
## Woofer path (135 Hz 4th-order LR4 HPF + 2 kHz LR4 LPF + woofer EQ), 30-300 Hz.
bass_group_delay_swing_ms="2.96"
## On a synthetic hot master (pink noise soft-clipped to -0.1 dBFS peaks,
## -8.8 LUFS): the woofer pair reaches the -1.0 dBFS limiter threshold cleanly
## (-1.0 dBFS peak and true peak) while the tweeter pair peaks at -1.9 dBFS.
## EBU R128 LRA delta is 0.2 LU on the woofer pair, 0.0 LU on the tweeter pair
## (0.1 LU summed).
limiter_headroom_db="0.0"   ## worst-case peak on a hot master vs -1 dBFS
dynamic_range_delta_lu="0.2"
