## ASUS Zenbook A16 UX3607OA (Snapdragon X2 Elite) internal speakers.
##
## Four WSA8845 amplifiers, a woofer and a tweeter per side, which the speaker
## sink exposes as four channels: woofers on FL/FR, tweeters on RL/RR. Windows
## splits them in Qualcomm's DSP; Linux sends every channel the full band, so
## this graph does the split itself, behind ASUS's Dolby speaker voicing and in
## front of a lookahead limiter per pair.

description="ASUS Zenbook A16 (UX3607OA) speakers"

## The model number names this exact machine. The speakers only exist with the
## asus-zenbook-a16-audio package from omarchy-pkgs, which gives the card its
## topology and UCM profile; without it there is no speaker sink to match.
match_dmi=("UX3607OA")
## Unescaped dots: this is passed to awk as a string, where a backslash escape
## would be consumed before the regex sees it.
sink_pattern='^alsa_output.*platform-sound.*HiFi__Speaker__sink$'

## Provenance, all for SUBSYS_16D41043 (this laptop's Qualcomm audio device):
##   - Speaker PEQ (380, 495, 1450 and 7900 Hz) and the 20-band audio-optimizer
##     curve of the internal_speaker endpoint, dynamic profile, in ASUS's Dolby
##     tuning QCASD_DEV_0FCD_SUBSYS_16D41043_AUCD_SUBSYS_16D41043.xml, tuning
##     version 115, from the ASUS Dolby Atmos driver V10.1215.652.38. Music,
##     movie and game carry the same speaker block. The PEQ is used as is; the
##     curve is fitted with eight sections to 0.22 dB RMS.
##   - The 3 kHz 4th-order Butterworth woofer/tweeter crossover (two biquads,
##     Q 0.5412 and 1.3065), read from the MSIIR calibration in the Qualcomm
##     ACDB (acdb_cal.acdb) of ASUS's Qualcomm BSP V1.312.4500.0.
##   - A 100 Hz high-pass that ASUS's curve does not have: the woofers produce
##     almost nothing below about 250 Hz, and Windows' speaker protection, which
##     guards their excursion there, has no Linux counterpart.
## Numbers are transcribed from those files; nothing from the packages is
## redistributed.
derived_from="ASUS Dolby Atmos tuning v115 and Qualcomm ACDB crossover for SUBSYS_16D41043"
validated_by="dhh"
validated_on="2026-10-29"
validated_hardware="Zenbook A16 UX3607OA, BIOS UX3607OA.312"

## Measured electrically on the speaker sink's capture with the speakers muted.
## The graph matches its design to 0.04 dB across stepped tones; the figure
## below is its departure from ASUS's curve from 100 Hz to 20 kHz, all of it the
## fit plus the high-pass corner (-3.1 dB at 100 Hz).
magnitude_rms_db="0.60"
## Woofer path (EQ plus the crossover's low-pass), 30-300 Hz.
bass_group_delay_swing_ms="2.38"
## On a synthetic hot master (pink noise, soft-clipped to -0.1 dBFS peaks): the
## woofers reach the -1 dBFS threshold, so their limiter engages on loud
## masters, while the tweeters peak at -6.3 dBFS. Loudness range is unchanged.
limiter_headroom_db="0.0"   ## worst-case peak on a hot master vs -1 dBFS
dynamic_range_delta_lu="0.0"
