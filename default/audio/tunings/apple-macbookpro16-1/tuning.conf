## Apple MacBook Pro 16-inch (2019), MacBookPro16,1 internal speakers.
##
## Separate woofer/tweeter biquad fits with a provisional 2281 Hz LR4
## crossover, builtin harmonic bass, and stereo-linked band limiters.
## FL SL RL FR SR RR = left woofer, duplicate, tweeter, right equivalents.

description="Apple MacBook Pro 16-inch (2019) speakers"
match_dmi=("MacBookPro16,1")
## UCM exposes separate speaker and headphone sinks; only front the speakers.
sink_pattern='^alsa_output.*HiFi__Speaker__sink$'

## Provenance. Magnitude fitted from the MIT reference's configs/16_1 FIRs,
## with an explicit LR4 split and builtin harmonic bass in place of Bankstown.
## No FIR, WAV, or other binary asset is redistributed.
derived_from="lemmyg/t2-apple-audio-dsp configs/16_1 (MIT, commit 1895a70350e9444a78c63be20830b4813c5eb0f6); biquad fit + LR4 + builtin harmonic bass"

validated_by="Cedric Darne"
validated_on="2026-10-29"
validated_hardware="MacBookPro16,1 (16-inch 2019), linux-t2 7.2.11, t2bce UCM"

## Measured electrically at the muted physical speaker monitor, upstream of
## volume. Settled samples were bit-identical to the same-input null render;
## startup samples differ. Hot programme and gain-reduction taps used null sinks.
## 104-tone unweighted RMS vs lemmyg reference.conf (without Bankstown):
## woofer 40-4305 Hz, tweeter 500-15343 Hz; omit reference tones below -90 dBFS.
## Worst passband RMS below is woofer; tweeter is 0.3521 dB. This includes the
## deliberate V3 harmonic-bass departure. Fit RMS vs V3 is 0.3640/0.3154 dB
## (woofer/tweeter). These are electrical responses, not acoustic summation.
magnitude_rms_db="1.3010"
## Woofer max-minus-min phase-derived delay over 30-300 Hz: 55 single tones
## at 5 Hz spacing, 0.01 input amplitude, input/output captured simultaneously.
## Small-signal linearisation of the nonlinear bass block, not level-independent.
bass_group_delay_swing_ms="12.3668"
## Threshold 0.891 = -1.0024459 dBFS (-1.003 rounded). Hot real music reached
## -1.002456 dBFS: 0.000010 dB headroom, rounded below. Soft-clipped pink noise
## with -0.1 dBFS input peaks reached only -8.3090 dBFS (7.3065 dB margin).
limiter_headroom_db="0.00"
## EBU R128 LRA delta vs reference on the same hot music that set headroom
## (-0.167 LU): arithmetic mean of six separate electrical channel deltas, no
## downmix. The limiter does not engage on the pink master (+0.050 LU).
## Ordinary speech/film/music: +0.067/+0.083/-0.217 LU.
dynamic_range_delta_lu="-0.17"
