          { type = builtin name = w_eq_2_l label = bq_peaking control = { "Freq" = 60.4 "Q" = 1.8 "Gain" = 4 } }
          { type = builtin name = w_eq_3_l label = bq_peaking control = { "Freq" = 150 "Q" = 0.8 "Gain" = 2.98 } }
          { type = builtin name = w_eq_4_l label = bq_peaking control = { "Freq" = 300 "Q" = 0.503 "Gain" = -2.45 } }
          { type = builtin name = w_eq_5_l label = bq_peaking control = { "Freq" = 300 "Q" = 0.804 "Gain" = 3.95 } }
          { type = builtin name = w_eq_6_l label = bq_peaking control = { "Freq" = 539.5 "Q" = 1.437 "Gain" = -12.23 } }
          { type = builtin name = w_eq_7_l label = bq_peaking control = { "Freq" = 891.9 "Q" = 1.133 "Gain" = -5.54 } }
          { type = builtin name = w_eq_8_l label = bq_peaking control = { "Freq" = 1500 "Q" = 1.503 "Gain" = 6.09 } }
          { type = builtin name = w_eq_9_l label = bq_peaking control = { "Freq" = 1550 "Q" = 1.29 "Gain" = -6.13 } }
          { type = builtin name = w_eq_10_l label = bq_peaking control = { "Freq" = 2406.3 "Q" = 1.701 "Gain" = -7.67 } }
          { type = builtin name = w_gain_l label = linear control = { "Mult" = 0.4693 "Add" = 0 } }
          { type = builtin name = w_lr4_0_r label = bq_lowpass control = { "Freq" = 2281 "Q" = 0.707106781187 } }
          { type = builtin name = w_lr4_1_r label = bq_lowpass control = { "Freq" = 2281 "Q" = 0.707106781187 } }
          { type = builtin name = w_eq_0_r label = bq_highpass control = { "Freq" = 92.7 "Q" = 0.921 } }
          { type = builtin name = w_eq_1_r label = bq_highpass control = { "Freq" = 68.9 "Q" = 1.6 } }
          { type = builtin name = w_eq_2_r label = bq_peaking control = { "Freq" = 60.4 "Q" = 1.8 "Gain" = 4 } }
          { type = builtin name = w_eq_3_r label = bq_peaking control = { "Freq" = 150 "Q" = 0.8 "Gain" = 2.98 } }
          { type = builtin name = w_eq_4_r label = bq_peaking control = { "Freq" = 300 "Q" = 0.503 "Gain" = -2.45 } }
          { type = builtin name = w_eq_5_r label = bq_peaking control = { "Freq" = 300 "Q" = 0.804 "Gain" = 3.95 } }
          { type = builtin name = w_eq_6_r label = bq_peaking control = { "Freq" = 539.5 "Q" = 1.437 "Gain" = -12.23 } }
          { type = builtin name = w_eq_7_r label = bq_peaking control = { "Freq" = 891.9 "Q" = 1.133 "Gain" = -5.54 } }
          { type = builtin name = w_eq_8_r label = bq_peaking control = { "Freq" = 1500 "Q" = 1.503 "Gain" = 6.09 } }
          { type = builtin name = w_eq_9_r label = bq_peaking control = { "Freq" = 1550 "Q" = 1.29 "Gain" = -6.13 } }
          { type = builtin name = w_eq_10_r label = bq_peaking control = { "Freq" = 2406.3 "Q" = 1.701 "Gain" = -7.67 } }
          { type = builtin name = w_gain_r label = linear control = { "Mult" = 0.4693 "Add" = 0 } }

          { type = builtin name = t_lr4_0_l label = bq_highpass control = { "Freq" = 2281 "Q" = 0.707106781187 } }
          { type = builtin name = t_lr4_1_l label = bq_highpass control = { "Freq" = 2281 "Q" = 0.707106781187 } }
          { type = builtin name = t_eq_0_l label = bq_lowshelf control = { "Freq" = 1368 "Q" = 0.551 "Gain" = -17.44 } }
          { type = builtin name = t_eq_1_l label = bq_peaking control = { "Freq" = 1550 "Q" = 0.643 "Gain" = -6.78 } }
          { type = builtin name = t_eq_2_l label = bq_peaking control = { "Freq" = 2300 "Q" = 1.055 "Gain" = -2.98 } }
          { type = builtin name = t_eq_3_l label = bq_peaking control = { "Freq" = 4256.6 "Q" = 3 "Gain" = -7.33 } }
          { type = builtin name = t_eq_4_l label = bq_highshelf control = { "Freq" = 7843 "Q" = 1.5 "Gain" = 4.36 } }
          { type = builtin name = t_eq_5_l label = bq_peaking control = { "Freq" = 14507.4 "Q" = 1.128 "Gain" = -14.56 } }
          { type = builtin name = t_gain_l label = linear control = { "Mult" = 0.738 "Add" = 0 } }
          { type = builtin name = t_delay_l label = delay config = { "max-delay" = 0.01 } control = { "Delay (s)" = 0.005 } }
          { type = builtin name = t_lr4_0_r label = bq_highpass control = { "Freq" = 2281 "Q" = 0.707106781187 } }
          { type = builtin name = t_lr4_1_r label = bq_highpass control = { "Freq" = 2281 "Q" = 0.707106781187 } }
          { type = builtin name = t_eq_0_r label = bq_lowshelf control = { "Freq" = 1368 "Q" = 0.551 "Gain" = -17.44 } }
          { type = builtin name = t_eq_1_r label = bq_peaking control = { "Freq" = 1550 "Q" = 0.643 "Gain" = -6.78 } }
          { type = builtin name = t_eq_2_r label = bq_peaking control = { "Freq" = 2300 "Q" = 1.055 "Gain" = -2.98 } }
          { type = builtin name = t_eq_3_r label = bq_peaking control = { "Freq" = 4256.6 "Q" = 3 "Gain" = -7.33 } }
          { type = builtin name = t_eq_4_r label = bq_highshelf control = { "Freq" = 7843 "Q" = 1.5 "Gain" = 4.36 } }
          { type = builtin name = t_eq_5_r label = bq_peaking control = { "Freq" = 14507.4 "Q" = 1.128 "Gain" = -14.56 } }
          { type = builtin name = t_gain_r label = linear control = { "Mult" = 0.738 "Add" = 0 } }
          { type = builtin name = t_delay_r label = delay config = { "max-delay" = 0.01 } control = { "Delay (s)" = 0.005 } }

          # Retained: inactive on ordinary clips, active on hot bass.
          { type = lv2 name = woofer_lim plugin = "http://lsp-plug.in/plugins/lv2/compressor_stereo" control = { "sla" = 5.0 "al" = 1.0 "at" = 1.0 "rt" = 100.0 "cr" = 15.0 "kn" = 0.5 } }

          # Limit after all gain/EQ; do not auto-level or boost to full scale.
          { type = lv2 name = limiterW plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo" control = { "alr" = 0 "boost" = 0 "g_in" = 1.0 "th" = 0.891 "lk" = 15.0 "at" = 15.0 } }
          { type = lv2 name = limiterT plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo" control = { "alr" = 0 "boost" = 0 "g_in" = 1.0 "th" = 0.891 "lk" = 15.0 "at" = 15.0 } }
          { type = builtin label = copy name = LW }
          { type = builtin label = copy name = LW2 }
          { type = builtin label = copy name = RW }
          { type = builtin label = copy name = RW2 }
        ]

        links = [
          { output = "hb_in_l:Out" input = "hb_cl_l:In" }
          { output = "hb_cl_l:Out" input = "hb_hp_l:In" }
          { output = "hb_hp_l:Out" input = "hb_lp_l:In" }
          { output = "hb_lp_l:Out" input = "hb_g_l:In" }
          { output = "hb_g_l:Out" input = "hb_e1_l:In" }
          { output = "hb_e1_l:Out" input = "hb_p1_l:In" }
          { output = "hb_p1_l:Out" input = "hb_ln_l:In" }
          { output = "hb_ln_l:Out" input = "hb_e2_l:In" }
          { output = "hb_e2_l:Out" input = "hb_out_l:In" }
          { output = "hb_out_l:Out" input = "hb_fh_l:In" }
          { output = "hb_fh_l:Out" input = "hb_fl_l:In" }
          { output = "hb_cl_l:Out" input = "hb_mix_l:In 1" }
          { output = "hb_fl_l:Out" input = "hb_mix_l:In 2" }
          { output = "hb_mix_l:Out" input = "splitL:In" }
          { output = "hb_in_r:Out" input = "hb_cl_r:In" }
          { output = "hb_cl_r:Out" input = "hb_hp_r:In" }
          { output = "hb_hp_r:Out" input = "hb_lp_r:In" }
          { output = "hb_lp_r:Out" input = "hb_g_r:In" }
          { output = "hb_g_r:Out" input = "hb_e1_r:In" }
          { output = "hb_e1_r:Out" input = "hb_p1_r:In" }
          { output = "hb_p1_r:Out" input = "hb_ln_r:In" }
          { output = "hb_ln_r:Out" input = "hb_e2_r:In" }
          { output = "hb_e2_r:Out" input = "hb_out_r:In" }
          { output = "hb_out_r:Out" input = "hb_fh_r:In" }
          { output = "hb_fh_r:Out" input = "hb_fl_r:In" }
          { output = "hb_cl_r:Out" input = "hb_mix_r:In 1" }
          { output = "hb_fl_r:Out" input = "hb_mix_r:In 2" }
          { output = "hb_mix_r:Out" input = "splitR:In" }
          { output = "splitL:Out" input = "w_lr4_0_l:In" }
          { output = "w_lr4_0_l:Out" input = "w_lr4_1_l:In" }
          { output = "w_lr4_1_l:Out" input = "w_eq_0_l:In" }
          { output = "w_eq_0_l:Out" input = "w_eq_1_l:In" }
          { output = "w_eq_1_l:Out" input = "w_eq_2_l:In" }
          { output = "w_eq_2_l:Out" input = "w_eq_3_l:In" }
          { output = "w_eq_3_l:Out" input = "w_eq_4_l:In" }
          { output = "w_eq_4_l:Out" input = "w_eq_5_l:In" }
          { output = "w_eq_5_l:Out" input = "w_eq_6_l:In" }
