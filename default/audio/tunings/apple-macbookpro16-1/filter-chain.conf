# Apple MacBook Pro 16-inch (2019), MacBookPro16,1 speaker tuning.
#
# Derived from lemmyg/t2-apple-audio-dsp configs/16_1 (MIT, 1895a703).
# The FIR magnitude is fitted with biquads around a provisional 2281 Hz LR4
# crossover. No convolution assets are distributed. See tuning.conf.
#
# The builtin harmonic-bass block: 40-150 Hz, drive 2.5,
# generated band 120-450 Hz, dry 1 / wet 0.45. No loudness compensation.
# Low-frequency peaking Q is capped at 1.8 to limit bass group-delay swing.
#
# Left/right EQ is mirrored. Each band has a stereo-linked lookahead limiter;
# woofer output copies map FL SL RL FR SR RR to LW LW2 LT RW RW2 RT.
# Electrical coefficients do not establish acoustic summation at the crossover.
# The tweeters are delayed 5 ms to match the woofer compressor's lookahead.
