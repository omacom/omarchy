          { output = "w_gain_l:Out" input = "woofer_lim:in_l" }
          { output = "woofer_lim:out_l" input = "limiterW:in_l" }
          { output = "splitR:Out" input = "w_lr4_0_r:In" }
          { output = "w_lr4_0_r:Out" input = "w_lr4_1_r:In" }
          { output = "w_lr4_1_r:Out" input = "w_eq_0_r:In" }
          { output = "w_eq_0_r:Out" input = "w_eq_1_r:In" }
          { output = "w_eq_1_r:Out" input = "w_eq_2_r:In" }
          { output = "w_eq_2_r:Out" input = "w_eq_3_r:In" }
          { output = "w_eq_3_r:Out" input = "w_eq_4_r:In" }
          { output = "w_eq_4_r:Out" input = "w_eq_5_r:In" }
          { output = "w_eq_5_r:Out" input = "w_eq_6_r:In" }
          { output = "w_eq_6_r:Out" input = "w_eq_7_r:In" }
          { output = "w_eq_7_r:Out" input = "w_eq_8_r:In" }
          { output = "w_eq_8_r:Out" input = "w_eq_9_r:In" }
          { output = "w_eq_9_r:Out" input = "w_eq_10_r:In" }
          { output = "w_eq_10_r:Out" input = "w_gain_r:In" }
          { output = "w_gain_r:Out" input = "woofer_lim:in_r" }
          { output = "woofer_lim:out_r" input = "limiterW:in_r" }
          { output = "splitL:Out" input = "t_lr4_0_l:In" }
          { output = "t_lr4_0_l:Out" input = "t_lr4_1_l:In" }
          { output = "t_lr4_1_l:Out" input = "t_eq_0_l:In" }
          { output = "t_eq_0_l:Out" input = "t_eq_1_l:In" }
          { output = "t_eq_1_l:Out" input = "t_eq_2_l:In" }
          { output = "t_eq_2_l:Out" input = "t_eq_3_l:In" }
          { output = "t_eq_3_l:Out" input = "t_eq_4_l:In" }
          { output = "t_eq_4_l:Out" input = "t_eq_5_l:In" }
          { output = "t_eq_5_l:Out" input = "t_gain_l:In" }
          { output = "t_gain_l:Out" input = "t_delay_l:In" }
          { output = "t_delay_l:Out" input = "limiterT:in_l" }
          { output = "splitR:Out" input = "t_lr4_0_r:In" }
          { output = "t_lr4_0_r:Out" input = "t_lr4_1_r:In" }
          { output = "t_lr4_1_r:Out" input = "t_eq_0_r:In" }
