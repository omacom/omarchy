          { output = "limiterW:out_r" input = "RW:In" }
          { output = "limiterW:out_r" input = "RW2:In" }
        ]

        inputs  = [ "hb_in_l:In" "hb_in_r:In" ]
        outputs = [ "LW:Out" "LW2:Out" "limiterT:out_l" "RW:Out" "RW2:Out" "limiterT:out_r" ]
      }

      capture.props = {
        node.name   = "omarchy_speaker_tuning"
        media.class = Audio/Sink
        audio.channels = 2
        audio.position = [ FL FR ]
        state.default-volume = 1.0
      }
      playback.props = {
        node.name     = "omarchy_speaker_tuning_output"
        node.passive  = true
        target.object = "@SPEAKER_SINK@"
        # Pin the DSP output to the speaker sink, never headphones or itself.
        node.dont-move = true
        node.dont-fallback = true
        node.linger = true
        stream.dont-remix = true
        audio.channels = 6
        audio.position = [ FL SL RL FR SR RR ]
      }
    }
  }
]
