context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Laptop Speakers"
      media.name       = "Laptop Speakers"

      filter.graph = {
        nodes = [
          { type = builtin label = copy name = hb_in_l }
          { type = builtin label = clamp name = hb_cl_l control = { "Min" = -10 "Max" = 10 } }
          { type = builtin label = bq_highpass name = hb_hp_l control = { "Freq" = 40 "Q" = 0.707 } }
          { type = builtin label = bq_lowpass name = hb_lp_l control = { "Freq" = 150 "Q" = 0.707 } }
          { type = builtin label = linear name = hb_g_l control = { "Mult" = 2.5 "Add" = 0 } }
          { type = builtin label = exp name = hb_e1_l control = { "Base" = 0.367879441 } }
          { type = builtin label = linear name = hb_p1_l control = { "Mult" = 1 "Add" = 1 } }
          { type = builtin label = log name = hb_ln_l control = { "Base" = 2.718281828 "M1" = 1 "M2" = 1 } }
          { type = builtin label = exp name = hb_e2_l control = { "Base" = 0.367879441 } }
          { type = builtin label = linear name = hb_out_l control = { "Mult" = 2.830895 "Add" = -1.415448 } }
          { type = builtin label = bq_highpass name = hb_fh_l control = { "Freq" = 120 "Q" = 0.707 } }
          { type = builtin label = bq_lowpass name = hb_fl_l control = { "Freq" = 450 "Q" = 0.707 } }
          { type = builtin label = mixer name = hb_mix_l control = { "Gain 1" = 1 "Gain 2" = 0.45 } }
          { type = builtin label = copy name = hb_in_r }
          { type = builtin label = clamp name = hb_cl_r control = { "Min" = -10 "Max" = 10 } }
          { type = builtin label = bq_highpass name = hb_hp_r control = { "Freq" = 40 "Q" = 0.707 } }
          { type = builtin label = bq_lowpass name = hb_lp_r control = { "Freq" = 150 "Q" = 0.707 } }
          { type = builtin label = linear name = hb_g_r control = { "Mult" = 2.5 "Add" = 0 } }
          { type = builtin label = exp name = hb_e1_r control = { "Base" = 0.367879441 } }
          { type = builtin label = linear name = hb_p1_r control = { "Mult" = 1 "Add" = 1 } }
          { type = builtin label = log name = hb_ln_r control = { "Base" = 2.718281828 "M1" = 1 "M2" = 1 } }
          { type = builtin label = exp name = hb_e2_r control = { "Base" = 0.367879441 } }
          { type = builtin label = linear name = hb_out_r control = { "Mult" = 2.830895 "Add" = -1.415448 } }
          { type = builtin label = bq_highpass name = hb_fh_r control = { "Freq" = 120 "Q" = 0.707 } }
