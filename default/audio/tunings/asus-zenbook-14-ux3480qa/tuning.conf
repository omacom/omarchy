## ASUS Zenbook 14 UX3480QA (Snapdragon X X1-26-100 / Purwa) internal speakers.
##
## Two WSA884x full-range speakers on FL/FR. Protects the drivers with a 135 Hz
## 4th-order Linkwitz-Riley high-pass above their mechanical excursion knee,
## restores clean upper-bass warmth (200 Hz), tames the +6 dB 800 Hz cabinet
## peak, fills the 3.5-6.3 kHz presence/air dip, and applies +2.6 dB makeup
## gain (g_in=1.35) into a stereo lookahead limiter holding peaks at -1.0 dBFS.

description="ASUS Zenbook 14 (UX3480QA) speakers"

## The model number names this exact machine (DMI product_sku is "null"). The
## speakers only exist with asus-zenbook-14-ux3480qa-audio from omarchy-pkgs;
## without it there is no speaker sink to match. Matches both UX3480QA and
## UX3480QAB.
match_dmi=("UX3480QA")
## Unescaped dots: this is passed to awk as a string, where a backslash escape
## would be consumed before the regex sees it.
sink_pattern='^alsa_output.*platform-sound.*HiFi__Speaker__sink$'

## Provenance. Characterised acoustically on the ASUS Zenbook 14 UX3480QA
## (7.3.6-10-omarchy with digital ceiling raised to 0 dB / 84) using the
## built-in DMICs across 80-10000 Hz at -12 and -6 dBFS, cross-checked against
## ASUS's Windows Dolby Atmos tuning for AUCD\VEN_QCOM&DEV_0C29&SUBSYS_1B441043
## (driver 11.529.808.43, tuning version 8):
##   - Raw THD sweep located the excursion knee at 120-140 Hz (33.5% THD at
##     80 Hz, 9.4% at 100 Hz, 3.5-8.7% at 120 Hz -> 1.24% at 140 Hz, 0.70% at
##     160 Hz), guiding the 135 Hz 4th-order LR4 HPF.
##   - Raw L/R polarity check confirmed coherent in-phase stereo summation and
##     identified the +6.1 dB 800 Hz cabinet resonance and 3.15-6.3 kHz dip.
##   - Paired with the 0 dB digital ceiling (omarchy-pkgs#3835), net 200-8000 Hz
##     acoustic loudness rises by +6.8 dB while improving flatness from 8.42 to
##     7.04 dB std dev and keeping 140-250 Hz THD <= 2.0% and >= 1 kHz <= 0.43%
##     at -6 dBFS. Nothing from ASUS's Windows package is redistributed.
derived_from="Measured acoustic FR/THD envelope on ASUS Zenbook 14 UX3480QA (DIG=84), cross-checked with ASUS Dolby Atmos SUBSYS_1B441043"
validated_by="emirb"
validated_on="2026-11-28"
validated_hardware="ASUS Zenbook 14 UX3480QA, BIOS UX3480QA.304"

## Measured electrically on a copy of this graph feeding a 48 kHz stereo null
## sink (see docs/audio-tuning.md). Matches its analytical RBJ biquad design
## across 104 tones (30-19000 Hz) to 0.004 dB RMS (0.009 dB max).
magnitude_rms_db="0.00"
bass_group_delay_swing_ms="2.88"
## On a synthetic dynamic hot master (pink noise alternating quiet/hot passages,
## soft-clipped to -0.1 dBFS peaks, -6.8 LUFS, 2.9 LU LRA): peaks hit the
## -1.0 dBFS limiter threshold cleanly (-1.0 dBFS max_volume) with -0.2 LU LRA
## delta (2.9 -> 2.7 LU).
limiter_headroom_db="0.0"   ## worst-case peak on a hot master vs -1 dBFS
dynamic_range_delta_lu="-0.2"
