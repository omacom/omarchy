# ASUS Zenbook 14 UX3480QA (Snapdragon X X1-26-100 / Purwa) speaker tuning.
#
# Seven biquads and a stereo lookahead limiter in front of the Qualcomm
# WSA884x two-speaker sink (FL/FR).
#
# Acoustic measurements on this machine (built-in DMICs at DIG=84 / 0 dB,
# cross-checked against the ASUS Dolby Atmos tuning for SUBSYS_1B441043)
# showed:
# - Steep mechanical excursion distortion below ~135 Hz (33.5% THD at 80 Hz,
#   9.4% at 100 Hz, 3.5-8.7% at 120 Hz, dropping sharply to 1.24% at 140 Hz),
#   so a 135 Hz 4th-order Linkwitz-Riley high-pass protects the drivers right
#   above the knee.
# - Clean, low-distortion upper-bass headroom across 140-250 Hz (0.7-1.4% THD)
#   sitting ~20 dB below the midrange, restored with a wide Q=1.10 lift at
#   200 Hz paired with a -5.5 dB cut on the sharp +6 dB 800 Hz cabinet peak.
# - A mild upper-mid trim at 1.6 kHz and wide lifts at 3.6 kHz and 6 kHz
#   (all positive boosts Q <= 1.6) filling the 3.15-6.3 kHz presence/air dip,
#   followed by +2.6 dB makeup gain (g_in=1.35) into a stereo lookahead
#   limiter holding peaks at -1.0 dBFS.
#
# Channels are wired explicitly because the limiter is a stereo plugin; a mono
# graph is duplicated per channel and would limit each side independently,
# shifting the stereo image on bass transients.

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Laptop Speakers"
      media.name       = "Laptop Speakers"

      filter.graph = {
        nodes = [
          { type = builtin name = hp0_l label = bq_highpass  control = { "Freq" = 135.0  "Q" = 0.7071 } }
          { type = builtin name = hp1_l label = bq_highpass  control = { "Freq" = 135.0  "Q" = 0.7071 } }
          { type = builtin name = eq0_l label = bq_peaking   control = { "Freq" = 200.0  "Q" = 1.1000 "Gain" = 4.50 } }
          { type = builtin name = eq1_l label = bq_peaking   control = { "Freq" = 800.0  "Q" = 2.4000 "Gain" = -5.50 } }
          { type = builtin name = eq2_l label = bq_peaking   control = { "Freq" = 1600.0 "Q" = 2.0000 "Gain" = -1.00 } }
          { type = builtin name = eq3_l label = bq_peaking   control = { "Freq" = 3600.0 "Q" = 1.6000 "Gain" = 3.00 } }
          { type = builtin name = eq4_l label = bq_highshelf control = { "Freq" = 6000.0 "Q" = 0.7071 "Gain" = 3.00 } }

          { type = builtin name = hp0_r label = bq_highpass  control = { "Freq" = 135.0  "Q" = 0.7071 } }
          { type = builtin name = hp1_r label = bq_highpass  control = { "Freq" = 135.0  "Q" = 0.7071 } }
          { type = builtin name = eq0_r label = bq_peaking   control = { "Freq" = 200.0  "Q" = 1.1000 "Gain" = 4.50 } }
          { type = builtin name = eq1_r label = bq_peaking   control = { "Freq" = 800.0  "Q" = 2.4000 "Gain" = -5.50 } }
          { type = builtin name = eq2_r label = bq_peaking   control = { "Freq" = 1600.0 "Q" = 2.0000 "Gain" = -1.00 } }
          { type = builtin name = eq3_r label = bq_peaking   control = { "Freq" = 3600.0 "Q" = 1.6000 "Gain" = 3.00 } }
          { type = builtin name = eq4_r label = bq_highshelf control = { "Freq" = 6000.0 "Q" = 0.7071 "Gain" = 3.00 } }

          { type   = lv2
            name   = limiter
            plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = {
              # Both default to enabled: "alr" regulates level toward the
              # threshold and "boost" normalises the threshold up to full
              # scale. A fixed tuning must switch them off or its tone drifts
              # with programme level.
              "alr"   = 0
              "boost" = 0
              "g_in"  = 1.3500
              "th"    = 0.891
            }
          }
        ]

        links = [
          { output = "hp0_l:Out" input = "hp1_l:In" }
          { output = "hp1_l:Out" input = "eq0_l:In" }
          { output = "eq0_l:Out" input = "eq1_l:In" }
          { output = "eq1_l:Out" input = "eq2_l:In" }
          { output = "eq2_l:Out" input = "eq3_l:In" }
          { output = "eq3_l:Out" input = "eq4_l:In" }
          { output = "eq4_l:Out" input = "limiter:in_l" }
          { output = "hp0_r:Out" input = "hp1_r:In" }
          { output = "hp1_r:Out" input = "eq0_r:In" }
          { output = "eq0_r:Out" input = "eq1_r:In" }
          { output = "eq1_r:Out" input = "eq2_r:In" }
          { output = "eq2_r:Out" input = "eq3_r:In" }
          { output = "eq3_r:Out" input = "eq4_r:In" }
          { output = "eq4_r:Out" input = "limiter:in_r" }
        ]

        inputs  = [ "hp0_l:In" "hp0_r:In" ]
        outputs = [ "limiter:out_l" "limiter:out_r" ]
      }

      audio.channels = 2
      audio.position = [ FL FR ]

      capture.props = {
        node.name   = "omarchy_speaker_tuning"
        media.class = Audio/Sink
      }
      playback.props = {
        node.name     = "omarchy_speaker_tuning_output"
        node.passive  = true
        target.object = "@SPEAKER_SINK@"
        node.dont-move = true
        node.dont-fallback = true
        node.linger = true
      }
    }
  }
]
