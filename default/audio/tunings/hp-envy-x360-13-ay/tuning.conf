## HP ENVY x360 13-ay0xxx (AMD Ryzen 4000, Realtek ALC245) internal speakers.
##
## HP's own Bang & Olufsen chain for this model, measured stage by stage from
## HP's DSP engine and rebuilt as biquads and LSP dynamics: an upward AGC, the
## EQ, a level hold and a -1 dBFS ceiling. The speakers hang straight off the
## codec with no smart amplifier, so on Linux they otherwise play with none of
## the processing HP voices them with on Windows.

description="HP ENVY x360 13-ay speakers"

## HP keys the tuning on the codec subsystem ID, 103C:876E, and the DMI board
## name carries the same ID. The product SKU is a retail configuration and
## region code that differs between units of this model, and the product name
## ("HP ENVY x360 Convertible PC") also covers 15-inch and Intel models.
## HP's newer driver maps board 8929 to the same preset too, probably the
## 13-ay1xxx; it is not matched here because it has not been verified.
hp_envy_x360_13_ay_board() {
  [[ $(cat /sys/class/dmi/id/sys_vendor 2>/dev/null) == "HP" &&
    $(cat /sys/class/dmi/id/board_name 2>/dev/null) == "876E" ]]
}
match_command=hp_envy_x360_13_ay_board
## Unescaped dots: this is passed to awk as a string, where a backslash escape
## would be consumed before the regex sees it.
sink_pattern='^alsa_output.pci-.*HiFi__Speaker__sink$'

## Provenance. HP's Realtek driver for this model, SoftPaq sp123560
## (6.0.9180.1, July 2021), carries a Sonitude (formerly Sound Research) preset
## per model: SEAPODAT.HDAUDIO.FUNC_01&VEN_10EC&DEV_0245.zip maps SUBSYS_103C876E
## to "Aldrin LPAP", whose Music mode is HP's default. HP's DSP engine from that
## driver (SEHDRA64.dll) was run under Wine with that preset, driven the way
## HP's APO drives it, and measured whole and one component at a time with
## pink noise, sine staircases, level steps, tone bursts and music. This graph
## is fitted to those measurements. The preset format follows
## speaker-tuning-to-easyeffects (MIT). Nothing from the driver is redistributed.
derived_from="HP Sonitude preset Aldrin LPAP (Music) for SUBSYS_103C876E, SoftPaq sp123560, measured from HP's engine under Wine"
validated_by="mirkoruether"
validated_on="2026-10-24"
validated_hardware="ENVY x360 Convertible 13-ay0xxx (board 876E)"

## Measured electrically against HP's engine on the same signals, with the
## graph running in PipeWire and feeding a null sink. The magnitude figure is
## pink noise at -45 dBFS, 1/6-octave bands, 100 Hz to 16 kHz, absolute gain
## included. On a hot master (pink noise stepped -30...-3 dBFS peak), peaks
## reach the -1 dBFS limiter threshold and stop there; HP's own chain lets
## them reach -0.6. On that program the loudness range is 0.2 LU below HP's
## (21.9 against 22.1 LU) and the integrated loudness 0.1 LU below.
magnitude_rms_db="0.21"
bass_group_delay_swing_ms="4.8"
limiter_headroom_db="0.0"   ## worst-case peak vs the -1 dBFS limiter threshold
dynamic_range_delta_lu="-0.2"
