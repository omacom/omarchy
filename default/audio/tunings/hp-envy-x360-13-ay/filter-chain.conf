# HP ENVY x360 13-ay0xxx (AMD Ryzen 4000, Realtek ALC245, SUBSYS 103C876E)
# speaker tuning.
#
# HP's own Bang & Olufsen chain for this model, measured. HP's Windows driver
# (SoftPaq sp123560) carries a per-model Sonitude/Sound Research preset; this
# laptop's is "Aldrin LPAP", Music mode. HP's DSP engine was run under Wine with
# that preset, measured stage by stage, and this graph reproduces it. See
# tuning.conf for provenance and figures. Nothing from HP is redistributed: the
# numbers below are fitted to measurements.
#
# HP's chain, in order, and its counterpart here:
#
# 1. Two mild EQ stages (about +2 dB from 300 Hz to 5 kHz), then an upward AGC:
#    +4 dB on quiet material, fading out as peaks rise above about -18 dBFS
#    (output = input + 0.074 in linear amplitude), attack under 1 ms, release
#    about 0.3 s. Its detector sees the signal after those two EQ stages, so
#    they are applied before the AGC (pre*) and exactly undone after it
#    (post*, the same filters with the gain negated); their tonal effect is in
#    the main EQ. A dyna_processor in peak mode.
# 2. The main EQ, level-independent: two high-pass and twelve peaking sections,
#    0.21 dB RMS, 0.54 dB max against the engine in 1/6-octave bands,
#    100 Hz-16 kHz. The 19.9 kHz section is HP's own top-octave roll-off. The
#    stored preset also holds an 8.45 dB boost at 155 Hz; HP's engine never
#    lets it through, and neither does this.
# 3. A level hold on the EQ'd signal: peaks held at -5 dBFS over about 6 dB of
#    input, then 1:1 again. Fixed gain +5.96 dB. A dyna_processor in peak
#    mode (its peak points sit about 1.9 dB below the level they hold).
# 4. A -1 dBFS ceiling that lets short transients through and recovers within
#    about 100 ms after a burst, but stays down on dense loud material: a
#    dyna_processor with a peak hold. The LSP limiter behind it only catches what
#    gets past.
#
# HP's virtual bass is off in this preset.
#
# Channels are wired explicitly because the dynamics are stereo plugins; a mono
# graph is duplicated per channel and would compress each side independently,
# shifting the stereo image.

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Laptop Speakers"
      media.name       = "Laptop Speakers"

      filter.graph = {
        nodes = [
          { type = builtin name = pre0_l label = bq_peaking control = { "Freq" = 2765.3 "Q" = 0.300 "Gain" = 2.27 } }
          { type = builtin name = pre1_l label = bq_peaking control = { "Freq" = 393.3 "Q" = 1.504 "Gain" = 1.68 } }
          { type = builtin name = pre2_l label = bq_peaking control = { "Freq" = 11846.9 "Q" = 1.262 "Gain" = -1.40 } }
          { type = builtin name = pre0_r label = bq_peaking control = { "Freq" = 2765.3 "Q" = 0.300 "Gain" = 2.27 } }
          { type = builtin name = pre1_r label = bq_peaking control = { "Freq" = 393.3 "Q" = 1.504 "Gain" = 1.68 } }
          { type = builtin name = pre2_r label = bq_peaking control = { "Freq" = 11846.9 "Q" = 1.262 "Gain" = -1.40 } }

          # HP's upward AGC.
          { type   = lv2
            name   = agc
            plugin = "http://lsp-plug.in/plugins/lv2/dyna_processor_stereo"
            control = {
              "scm" = 0  "llr" = 1  "hlr" = 1.069
              "atd" = 0.25  "rtd" = 360
              "pe0" = 1 "tl0" = 0.14919 "gl0" = 0.23646 "kn0" = 0.681
              "pe1" = 1 "tl1" = 0.15136 "gl1" = 0.21349 "kn1" = 0.681
              "pe2" = 1 "tl2" = 0.31081 "gl2" = 0.37746 "kn2" = 0.681
              "pe3" = 1 "tl3" = 0.63826 "gl3" = 0.69984 "kn3" = 0.681
            }
          }

          { type = builtin name = post0_l label = bq_peaking control = { "Freq" = 2765.3 "Q" = 0.300 "Gain" = -2.27 } }
          { type = builtin name = post1_l label = bq_peaking control = { "Freq" = 393.3 "Q" = 1.504 "Gain" = -1.68 } }
          { type = builtin name = post2_l label = bq_peaking control = { "Freq" = 11846.9 "Q" = 1.262 "Gain" = 1.40 } }
          { type = builtin name = hp1_l label = bq_highpass control = { "Freq" = 151.3 "Q" = 0.812 } }
          { type = builtin name = hp2_l label = bq_highpass control = { "Freq" = 126.7 "Q" = 1.389 } }
          { type = builtin name = pk0_l label = bq_peaking control = { "Freq" = 92.0 "Q" = 3.007 "Gain" = 1.19 } }
          { type = builtin name = pk1_l label = bq_peaking control = { "Freq" = 184.7 "Q" = 2.382 "Gain" = -0.91 } }
          { type = builtin name = pk2_l label = bq_peaking control = { "Freq" = 302.2 "Q" = 2.120 "Gain" = 2.98 } }
          { type = builtin name = pk3_l label = bq_peaking control = { "Freq" = 522.9 "Q" = 2.120 "Gain" = -5.07 } }
          { type = builtin name = pk4_l label = bq_peaking control = { "Freq" = 1109.4 "Q" = 1.679 "Gain" = 5.39 } }
          { type = builtin name = pk5_l label = bq_peaking control = { "Freq" = 1612.7 "Q" = 2.525 "Gain" = -13.80 } }
          { type = builtin name = pk6_l label = bq_peaking control = { "Freq" = 2031.9 "Q" = 5.000 "Gain" = 1.42 } }
          { type = builtin name = pk7_l label = bq_peaking control = { "Freq" = 4311.2 "Q" = 3.379 "Gain" = 2.29 } }
          { type = builtin name = pk8_l label = bq_peaking control = { "Freq" = 7121.0 "Q" = 2.382 "Gain" = 1.81 } }
          { type = builtin name = pk9_l label = bq_peaking control = { "Freq" = 9948.5 "Q" = 3.582 "Gain" = -1.61 } }
          { type = builtin name = pk10_l label = bq_peaking control = { "Freq" = 14926.1 "Q" = 0.885 "Gain" = 6.95 } }
          { type = builtin name = pk11_l label = bq_peaking control = { "Freq" = 19924.0 "Q" = 2.634 "Gain" = -35.44 } }
          { type = builtin name = post0_r label = bq_peaking control = { "Freq" = 2765.3 "Q" = 0.300 "Gain" = -2.27 } }
          { type = builtin name = post1_r label = bq_peaking control = { "Freq" = 393.3 "Q" = 1.504 "Gain" = -1.68 } }
          { type = builtin name = post2_r label = bq_peaking control = { "Freq" = 11846.9 "Q" = 1.262 "Gain" = 1.40 } }
          { type = builtin name = hp1_r label = bq_highpass control = { "Freq" = 151.3 "Q" = 0.812 } }
          { type = builtin name = hp2_r label = bq_highpass control = { "Freq" = 126.7 "Q" = 1.389 } }
          { type = builtin name = pk0_r label = bq_peaking control = { "Freq" = 92.0 "Q" = 3.007 "Gain" = 1.19 } }
          { type = builtin name = pk1_r label = bq_peaking control = { "Freq" = 184.7 "Q" = 2.382 "Gain" = -0.91 } }
          { type = builtin name = pk2_r label = bq_peaking control = { "Freq" = 302.2 "Q" = 2.120 "Gain" = 2.98 } }
          { type = builtin name = pk3_r label = bq_peaking control = { "Freq" = 522.9 "Q" = 2.120 "Gain" = -5.07 } }
          { type = builtin name = pk4_r label = bq_peaking control = { "Freq" = 1109.4 "Q" = 1.679 "Gain" = 5.39 } }
          { type = builtin name = pk5_r label = bq_peaking control = { "Freq" = 1612.7 "Q" = 2.525 "Gain" = -13.80 } }
          { type = builtin name = pk6_r label = bq_peaking control = { "Freq" = 2031.9 "Q" = 5.000 "Gain" = 1.42 } }
          { type = builtin name = pk7_r label = bq_peaking control = { "Freq" = 4311.2 "Q" = 3.379 "Gain" = 2.29 } }
          { type = builtin name = pk8_r label = bq_peaking control = { "Freq" = 7121.0 "Q" = 2.382 "Gain" = 1.81 } }
          { type = builtin name = pk9_r label = bq_peaking control = { "Freq" = 9948.5 "Q" = 3.582 "Gain" = -1.61 } }
          { type = builtin name = pk10_r label = bq_peaking control = { "Freq" = 14926.1 "Q" = 0.885 "Gain" = 6.95 } }
          { type = builtin name = pk11_r label = bq_peaking control = { "Freq" = 19924.0 "Q" = 2.634 "Gain" = -35.44 } }

          # HP's level hold.
          { type   = lv2
            name   = hold
            plugin = "http://lsp-plug.in/plugins/lv2/dyna_processor_stereo"
            control = {
              "g_in" = 1.9856    # +5.96 dB
              "scm" = 0  "llr" = 1  "hlr" = 0.85
              "atd" = 5  "rtd" = 680
              "pe0" = 1 "tl0" = 0.63826 "gl0" = 0.63826 "kn0" = 0.688
              "pe1" = 1 "tl1" = 0.96189 "gl1" = 0.4481 "kn1" = 0.688
              "pe2" = 0 "pe3" = 0
            }
          }
          # HP's -1 dBFS ceiling.
          { type   = lv2
            name   = ceiling
            plugin = "http://lsp-plug.in/plugins/lv2/dyna_processor_stereo"
            control = {
              "scm" = 0  "scr" = 0  "hold" = 15  "llr" = 1  "hlr" = 17.5
              "atd" = 0.05  "rtd" = 335
              "pe0" = 1 "tl0" = 0.86596 "gl0" = 0.86596 "kn0" = 0.95
              "pe1" = 0 "pe2" = 0 "pe3" = 0
            }
          }
          # Safety limiter.
          { type   = lv2
            name   = limiter
            plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = {
              # Both default to enabled; a fixed tuning must switch them off
              # or its tone drifts with programme level.
              "alr"   = 0
              "boost" = 0
              "mode"  = 1       # Herm Wide
              "th"    = 0.8913   # -1.0 dBFS
              "rt"    = 20
            }
          }
        ]

        links = [
          { output = "pre0_l:Out" input = "pre1_l:In" }
          { output = "pre1_l:Out" input = "pre2_l:In" }
          { output = "pre2_l:Out" input = "agc:in_l" }
          { output = "agc:out_l" input = "post0_l:In" }
          { output = "post0_l:Out" input = "post1_l:In" }
          { output = "post1_l:Out" input = "post2_l:In" }
          { output = "post2_l:Out" input = "hp1_l:In" }
          { output = "hp1_l:Out" input = "hp2_l:In" }
          { output = "hp2_l:Out" input = "pk0_l:In" }
          { output = "pk0_l:Out" input = "pk1_l:In" }
          { output = "pk1_l:Out" input = "pk2_l:In" }
          { output = "pk2_l:Out" input = "pk3_l:In" }
          { output = "pk3_l:Out" input = "pk4_l:In" }
          { output = "pk4_l:Out" input = "pk5_l:In" }
          { output = "pk5_l:Out" input = "pk6_l:In" }
          { output = "pk6_l:Out" input = "pk7_l:In" }
          { output = "pk7_l:Out" input = "pk8_l:In" }
          { output = "pk8_l:Out" input = "pk9_l:In" }
          { output = "pk9_l:Out" input = "pk10_l:In" }
          { output = "pk10_l:Out" input = "pk11_l:In" }
          { output = "pk11_l:Out" input = "hold:in_l" }
          { output = "pre0_r:Out" input = "pre1_r:In" }
          { output = "pre1_r:Out" input = "pre2_r:In" }
          { output = "pre2_r:Out" input = "agc:in_r" }
          { output = "agc:out_r" input = "post0_r:In" }
          { output = "post0_r:Out" input = "post1_r:In" }
          { output = "post1_r:Out" input = "post2_r:In" }
          { output = "post2_r:Out" input = "hp1_r:In" }
          { output = "hp1_r:Out" input = "hp2_r:In" }
          { output = "hp2_r:Out" input = "pk0_r:In" }
          { output = "pk0_r:Out" input = "pk1_r:In" }
          { output = "pk1_r:Out" input = "pk2_r:In" }
          { output = "pk2_r:Out" input = "pk3_r:In" }
          { output = "pk3_r:Out" input = "pk4_r:In" }
          { output = "pk4_r:Out" input = "pk5_r:In" }
          { output = "pk5_r:Out" input = "pk6_r:In" }
          { output = "pk6_r:Out" input = "pk7_r:In" }
          { output = "pk7_r:Out" input = "pk8_r:In" }
          { output = "pk8_r:Out" input = "pk9_r:In" }
          { output = "pk9_r:Out" input = "pk10_r:In" }
          { output = "pk10_r:Out" input = "pk11_r:In" }
          { output = "pk11_r:Out" input = "hold:in_r" }
          { output = "hold:out_l" input = "ceiling:in_l" }
          { output = "ceiling:out_l" input = "limiter:in_l" }
          { output = "hold:out_r" input = "ceiling:in_r" }
          { output = "ceiling:out_r" input = "limiter:in_r" }
        ]

        inputs  = [ "pre0_l:In" "pre0_r:In" ]
        outputs = [ "limiter:out_l" "limiter:out_r" ]
      }

      audio.channels = 2
      audio.position = [ FL FR ]

      capture.props = {
        node.name   = "omarchy_speaker_tuning"
        media.class = Audio/Sink
      }
      playback.props = {
        node.name     = "omarchy_speaker_tuning_output"
        node.passive  = true
        target.object = "@SPEAKER_SINK@"
        # Pinned for the same reasons as the XPS tuning: rerouting "all
        # streams" must not drag the processing onto another output, and the
        # output must wait for the speaker sink rather than fall back to
        # whatever default exists when the tuning host starts first.
        node.dont-move = true
        node.dont-fallback = true
        node.linger = true
      }
    }
  }
]
