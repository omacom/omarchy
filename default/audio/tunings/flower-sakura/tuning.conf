## Flower Sakura (FRANQE0006) internal speakers.
##
## Ten biquads and a lookahead limiter, applied as a PipeWire filter-chain in
## front of the Realtek ALC285 analog stereo speaker sink. Protects the drivers
## from sub-145 Hz excursion distortion, restores clean 160-350 Hz upper-bass
## warmth, tames the boxy 530 Hz hump and sharp 4.5 kHz resonance peak, and
## opens up the rolled-off 6-13 kHz top end.

description="Flower Sakura (FRANQE0006) speakers"
## Matched on the DMI product SKU (whole value, case-insensitive) so this only
## applies to the FRANQE0006 hardware and cannot widen to unrelated models.
match_sku=("FRANQE0006")
## Unescaped dots: this is passed to awk as a string, where a backslash escape
## would be consumed before the regex sees it.
sink_pattern='^alsa_output.pci-0000_00_1f.3.analog-stereo$'

## Provenance. Bass distortion envelope and acoustic frequency response
## characterised with a Shure MV7+ (onboard DSP disabled via USB HID: manual
## mode, Auto Level/denoiser/HPF/popper-stopper/compressor/limiter/reverb off,
## Tone=0) using Farina exponential sine sweeps, then verified post-EQ on the
## Flower Sakura (FRANQE0006) and auditioned by ear.
derived_from="Measured Farina ESS frequency response and bass THD on Flower Sakura (FRANQE0006), verified acoustically and by ear"
validated_by="dhh"
validated_on="2026-11-26"
validated_hardware="Flower Sakura (FRANQE0006)"

## Measured electrically on a copy of this graph feeding a 48 kHz null sink
## (see docs/audio-tuning.md). Matches its analytical biquad design to 0.00 dB
## RMS (0.01 dB max across 104 tones).
magnitude_rms_db="0.00"
bass_group_delay_swing_ms="3.34"
## On a synthetic hot master (pink noise soft-clipped to -0.1 dBFS peaks):
## peaks reach the -1.0 dBFS limiter threshold cleanly with -2.3 LU LRA delta.
limiter_headroom_db="0.0"   ## worst-case peak on a hot master vs -1 dBFS
dynamic_range_delta_lu="-2.3"
