# Flower Sakura (FRANQE0006) speaker tuning.
#
# Ten biquads and a stereo lookahead limiter in front of the Realtek ALC285
# analog stereo speaker sink.
#
# Acoustic measurements (Shure MV7+ with onboard DSP disabled: manual mode,
# Auto Level, denoiser, HPF, popper stopper, compressor, limiter, and reverb
# off, Tone=0) showed:
# - High mechanical distortion below ~145 Hz (20-75% THD at 63-125 Hz), so a
#   4th-order Butterworth high-pass at 145 Hz protects the drivers while
#   keeping bass group delay well controlled.
# - Clean, low-distortion upper-bass headroom across 160-350 Hz (2-4% THD)
#   sitting 10-26 dB below the midrange, restored with a wide Q=0.70 lift at
#   221.5 Hz paired with a -8.0 dB cut on the boxy 530 Hz cabinet hump.
# - A sharp +8.9 dB grille/cone resonance peak at 4.5 kHz, notched cleanly by
#   a -15.5 dB Q=3.50 cut at 4460 Hz alongside gentle midrange fill at 867 Hz
#   and 2337 Hz and a -6.0 dB broad midband trim at 1574 Hz.
# - Steep high-frequency roll-off above 6 kHz from down-firing enclosure
#   beaming, opened smoothly with wide lifts at 8.06 kHz and 11.45 kHz that
#   taper naturally above 13 kHz.
#
# Channels are wired explicitly because the limiter is a stereo plugin; a mono
# graph is duplicated per channel and would limit each side independently,
# shifting the stereo image on bass transients.

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Laptop Speakers"
      media.name       = "Laptop Speakers"

      filter.graph = {
        nodes = [
          { type = builtin name = s0_l label = bq_highpass control = { "Freq" = 145.0   "Q" = 0.5412 } }
          { type = builtin name = s1_l label = bq_highpass control = { "Freq" = 145.0   "Q" = 1.3066 } }
          { type = builtin name = s2_l label = bq_peaking  control = { "Freq" = 221.5   "Q" = 0.70   "Gain" = 10.00 } }
          { type = builtin name = s3_l label = bq_peaking  control = { "Freq" = 529.3   "Q" = 2.24   "Gain" = -8.00 } }
          { type = builtin name = s4_l label = bq_peaking  control = { "Freq" = 867.2   "Q" = 2.20   "Gain" = 3.81 } }
          { type = builtin name = s5_l label = bq_peaking  control = { "Freq" = 1574.0  "Q" = 0.81   "Gain" = -6.00 } }
          { type = builtin name = s6_l label = bq_peaking  control = { "Freq" = 2336.5  "Q" = 2.20   "Gain" = 3.90 } }
          { type = builtin name = s7_l label = bq_peaking  control = { "Freq" = 4460.0  "Q" = 3.50   "Gain" = -15.50 } }
          { type = builtin name = s8_l label = bq_peaking  control = { "Freq" = 8055.6  "Q" = 1.60   "Gain" = 8.35 } }
          { type = builtin name = s9_l label = bq_peaking  control = { "Freq" = 11448.4 "Q" = 1.20   "Gain" = 9.17 } }

          { type = builtin name = s0_r label = bq_highpass control = { "Freq" = 145.0   "Q" = 0.5412 } }
          { type = builtin name = s1_r label = bq_highpass control = { "Freq" = 145.0   "Q" = 1.3066 } }
          { type = builtin name = s2_r label = bq_peaking  control = { "Freq" = 221.5   "Q" = 0.70   "Gain" = 10.00 } }
          { type = builtin name = s3_r label = bq_peaking  control = { "Freq" = 529.3   "Q" = 2.24   "Gain" = -8.00 } }
          { type = builtin name = s4_r label = bq_peaking  control = { "Freq" = 867.2   "Q" = 2.20   "Gain" = 3.81 } }
          { type = builtin name = s5_r label = bq_peaking  control = { "Freq" = 1574.0  "Q" = 0.81   "Gain" = -6.00 } }
          { type = builtin name = s6_r label = bq_peaking  control = { "Freq" = 2336.5  "Q" = 2.20   "Gain" = 3.90 } }
          { type = builtin name = s7_r label = bq_peaking  control = { "Freq" = 4460.0  "Q" = 3.50   "Gain" = -15.50 } }
          { type = builtin name = s8_r label = bq_peaking  control = { "Freq" = 8055.6  "Q" = 1.60   "Gain" = 8.35 } }
          { type = builtin name = s9_r label = bq_peaking  control = { "Freq" = 11448.4 "Q" = 1.20   "Gain" = 9.17 } }

          { type   = lv2
            name   = limiter
            plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = {
              # Both default to enabled: "alr" regulates level toward the
              # threshold and "boost" normalises the threshold up to full
              # scale. A fixed tuning must switch them off or its tone drifts
              # with programme level.
              "alr"   = 0
              "boost" = 0
              "g_in"  = 0.95
              "th"    = 0.891
            }
          }
        ]

        links = [
          { output = "s0_l:Out" input = "s1_l:In" }
          { output = "s1_l:Out" input = "s2_l:In" }
          { output = "s2_l:Out" input = "s3_l:In" }
          { output = "s3_l:Out" input = "s4_l:In" }
          { output = "s4_l:Out" input = "s5_l:In" }
          { output = "s5_l:Out" input = "s6_l:In" }
          { output = "s6_l:Out" input = "s7_l:In" }
          { output = "s7_l:Out" input = "s8_l:In" }
          { output = "s8_l:Out" input = "s9_l:In" }
          { output = "s9_l:Out" input = "limiter:in_l" }

          { output = "s0_r:Out" input = "s1_r:In" }
          { output = "s1_r:Out" input = "s2_r:In" }
          { output = "s2_r:Out" input = "s3_r:In" }
          { output = "s3_r:Out" input = "s4_r:In" }
          { output = "s4_r:Out" input = "s5_r:In" }
          { output = "s5_r:Out" input = "s6_r:In" }
          { output = "s6_r:Out" input = "s7_r:In" }
          { output = "s7_r:Out" input = "s8_r:In" }
          { output = "s8_r:Out" input = "s9_r:In" }
          { output = "s9_r:Out" input = "limiter:in_r" }
        ]

        inputs  = [ "s0_l:In" "s0_r:In" ]
        outputs = [ "limiter:out_l" "limiter:out_r" ]
      }

      audio.channels = 2
      audio.position = [ FL FR ]

      capture.props = {
        node.name   = "omarchy_speaker_tuning"
        media.class = Audio/Sink
      }
      playback.props = {
        node.name     = "omarchy_speaker_tuning_output"
        node.passive  = true
        target.object = "@SPEAKER_SINK@"
        # Pinned so rerouting streams onto another output never drags the
        # filter's own output onto headphones or into a cycle, and waits for
        # the speaker sink rather than falling back to whatever default exists.
        node.dont-move = true
        node.dont-fallback = true
        node.linger = true
      }
    }
  }
]
