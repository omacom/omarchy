# Framework Laptop 13 Pro (Intel Core Ultra Series 3) speaker tuning.
#
# Biquad chain fitted by omarchy-audio-tuner to the measured response of a
# hand-tuned EasyEffects preset for these speakers, under the dense
# pink-weighted multitone probe, followed by a lookahead limiter. Measures
# 0.83 dB RMS against that reference (0.77 dB over the fit's own
# weighted error metric).
#
# The preset cuts hard where these drivers cannot play and between 400 Hz and
# 4 kHz, lifts a broad band around 130 Hz, and opens up the top octave with a
# high shelf. Below 50 Hz it falls away steeply: there is no output to win
# down there.
#
# The preset also runs a bass enhancer, an exciter, an 8-band compressor and a
# stereo widener. Only their effect on the probe's response survives here; see
# tuning.conf for how much the dynamics mattered.
#
# The speakers share an HDA sink with the headphone jack, so this applies only
# on the speaker port; tuning.conf sets speaker_port for that.
#
# Channels are wired explicitly because the limiter is a stereo plugin; a mono
# graph is duplicated per channel and would limit each side independently,
# shifting the stereo image on bass transients.

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Laptop Speakers"
      media.name       = "Laptop Speakers"

      filter.graph = {
        nodes = [
          { type = builtin name = s0_l      label = bq_highpass  control = { "Freq" = 63.7 "Q" = 1.107 } }
          { type = builtin name = s1_l      label = bq_highpass  control = { "Freq" = 46.9 "Q" = 0.4 } }
          { type = builtin name = s2_l      label = bq_peaking   control = { "Freq" = 84.6 "Q" = 1.775 "Gain" = -2.9 } }
          { type = builtin name = s3_l      label = bq_peaking   control = { "Freq" = 129.7 "Q" = 0.8 "Gain" = 6.94 } }
          { type = builtin name = s4_l      label = bq_peaking   control = { "Freq" = 276.2 "Q" = 2.061 "Gain" = -4.16 } }
          { type = builtin name = s5_l      label = bq_peaking   control = { "Freq" = 449.7 "Q" = 1.191 "Gain" = -6.48 } }
          { type = builtin name = s6_l      label = bq_peaking   control = { "Freq" = 770.5 "Q" = 1.176 "Gain" = -3.41 } }
          { type = builtin name = s7_l      label = bq_peaking   control = { "Freq" = 966.7 "Q" = 2.444 "Gain" = -2.91 } }
          { type = builtin name = s8_l      label = bq_peaking   control = { "Freq" = 1326.4 "Q" = 0.925 "Gain" = -3.29 } }
          { type = builtin name = s9_l      label = bq_peaking   control = { "Freq" = 1890.6 "Q" = 2.735 "Gain" = -6.42 } }
          { type = builtin name = s10_l     label = bq_peaking   control = { "Freq" = 3100.0 "Q" = 0.66 "Gain" = -8.39 } }
          { type = builtin name = s11_l     label = bq_peaking   control = { "Freq" = 3901.8 "Q" = 2.215 "Gain" = -8.0 } }
          { type = builtin name = s12_l     label = bq_highshelf control = { "Freq" = 10000.0 "Q" = 0.551 "Gain" = 9.98 } }

          { type = builtin name = s0_r      label = bq_highpass  control = { "Freq" = 63.7 "Q" = 1.107 } }
          { type = builtin name = s1_r      label = bq_highpass  control = { "Freq" = 46.9 "Q" = 0.4 } }
          { type = builtin name = s2_r      label = bq_peaking   control = { "Freq" = 84.6 "Q" = 1.775 "Gain" = -2.9 } }
          { type = builtin name = s3_r      label = bq_peaking   control = { "Freq" = 129.7 "Q" = 0.8 "Gain" = 6.94 } }
          { type = builtin name = s4_r      label = bq_peaking   control = { "Freq" = 276.2 "Q" = 2.061 "Gain" = -4.16 } }
          { type = builtin name = s5_r      label = bq_peaking   control = { "Freq" = 449.7 "Q" = 1.191 "Gain" = -6.48 } }
          { type = builtin name = s6_r      label = bq_peaking   control = { "Freq" = 770.5 "Q" = 1.176 "Gain" = -3.41 } }
          { type = builtin name = s7_r      label = bq_peaking   control = { "Freq" = 966.7 "Q" = 2.444 "Gain" = -2.91 } }
          { type = builtin name = s8_r      label = bq_peaking   control = { "Freq" = 1326.4 "Q" = 0.925 "Gain" = -3.29 } }
          { type = builtin name = s9_r      label = bq_peaking   control = { "Freq" = 1890.6 "Q" = 2.735 "Gain" = -6.42 } }
          { type = builtin name = s10_r     label = bq_peaking   control = { "Freq" = 3100.0 "Q" = 0.66 "Gain" = -8.39 } }
          { type = builtin name = s11_r     label = bq_peaking   control = { "Freq" = 3901.8 "Q" = 2.215 "Gain" = -8.0 } }
          { type = builtin name = s12_r     label = bq_highshelf control = { "Freq" = 10000.0 "Q" = 0.551 "Gain" = 9.98 } }
          { type   = lv2
            name   = limiter
            plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = {
              # Both default to enabled: "alr" regulates level toward the
              # threshold and "boost" normalises the threshold up to full
              # scale. A fixed tuning must switch them off or its tone drifts
              # with programme level.
              "alr"   = 0
              "boost" = 0
              # Broadband makeup from the fit, carried by the limiter's input
              # gain so no separate gain stage is needed.
              "g_in"  = 1.5676
              "th"    = 0.891
            }
          }
        ]

        links = [
          { output = "s0_l:Out" input = "s1_l:In" }
          { output = "s1_l:Out" input = "s2_l:In" }
          { output = "s2_l:Out" input = "s3_l:In" }
          { output = "s3_l:Out" input = "s4_l:In" }
          { output = "s4_l:Out" input = "s5_l:In" }
          { output = "s5_l:Out" input = "s6_l:In" }
          { output = "s6_l:Out" input = "s7_l:In" }
          { output = "s7_l:Out" input = "s8_l:In" }
          { output = "s8_l:Out" input = "s9_l:In" }
          { output = "s9_l:Out" input = "s10_l:In" }
          { output = "s10_l:Out" input = "s11_l:In" }
          { output = "s11_l:Out" input = "s12_l:In" }
          { output = "s12_l:Out" input = "limiter:in_l" }
          { output = "s0_r:Out" input = "s1_r:In" }
          { output = "s1_r:Out" input = "s2_r:In" }
          { output = "s2_r:Out" input = "s3_r:In" }
          { output = "s3_r:Out" input = "s4_r:In" }
          { output = "s4_r:Out" input = "s5_r:In" }
          { output = "s5_r:Out" input = "s6_r:In" }
          { output = "s6_r:Out" input = "s7_r:In" }
          { output = "s7_r:Out" input = "s8_r:In" }
          { output = "s8_r:Out" input = "s9_r:In" }
          { output = "s9_r:Out" input = "s10_r:In" }
          { output = "s10_r:Out" input = "s11_r:In" }
          { output = "s11_r:Out" input = "s12_r:In" }
          { output = "s12_r:Out" input = "limiter:in_r" }
        ]

        inputs  = [ "s0_l:In" "s0_r:In" ]
        outputs = [ "limiter:out_l" "limiter:out_r" ]
      }

      audio.channels = 2
      audio.position = [ FL FR ]

      capture.props = {
        node.name   = "omarchy_speaker_tuning"
        media.class = Audio/Sink
      }
      playback.props = {
        node.name     = "omarchy_speaker_tuning_output"
        node.passive  = true
        target.object = "@SPEAKER_SINK@"
        # This stream is the filter's output and is a movable sink input like any
        # other, so anything that reroutes "all streams" to a newly selected
        # output would drag the processing along with it -- onto headphones, or
        # into the tuning's own sink, which is a cycle. Pin it.
        node.dont-move = true
        # If the speaker sink is not present yet -- the tuning host can start
        # before the device is discovered -- WirePlumber would otherwise link this
        # output to whatever default exists, quietly tuning the wrong device while
        # the tuning sink still looks healthy. Wait for the named target instead.
        # Both are needed: without linger, WirePlumber destroys the node rather
        # than waiting (see its scripts/linking/find-defined-target.lua).
        node.dont-fallback = true
        node.linger = true
      }
    }
  }
]
