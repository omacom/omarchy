## Framework Laptop 13 Pro (Intel Core Ultra Series 3) internal speakers.
##
## Thirteen biquads and a lookahead limiter, applied as a PipeWire filter-chain
## in front of the internal speaker sink. The Realtek ALC285 drives the speakers
## raw on Linux; this adds a voicing for them.

description="Framework Laptop 13 Pro (Intel Core Ultra Series 3) speakers"
## Matched on the DMI product SKU, compared as a whole value. Only this SKU has
## been measured; add others once they are confirmed to be the same speakers.
match_sku=("FRANVZCP07")
## The speakers and the headphone jack are two ports of one HDA sink, so the sink
## alone cannot tell them apart. Unescaped dots: this is passed to awk as a
## string, where a backslash escape would be consumed before the regex sees it.
## "pci-" keeps USB audio devices, which are also analog-stereo, out.
sink_pattern='^alsa_output.pci-.*analog-stereo$'
## The port the tuning applies to. With headphones plugged in, the sink switches
## to its headphone port and omarchy-speaker-tuning-port.service moves the
## default output off the tuning until they are unplugged.
speaker_port="analog-output-speaker"

## Provenance. Fitted by omarchy-audio-tuner to the measured response of a
## hand-tuned EasyEffects preset for these speakers: a 10-band equalizer, a
## 120 Hz high-pass, a bass enhancer, an exciter (at zero), an 8-band compressor,
## a stereo widener and a limiter. The fit copies the net response the preset
## produces on the probe; the widener does not survive, because a per-channel
## chain cannot widen.
derived_from="Hand-tuned EasyEffects preset for the Framework Laptop 13 Pro speakers"
validated_by="lcd1232"
validated_on="2026-10-18"
validated_hardware="Framework Laptop 13 Pro (Intel Core Ultra Series 3), SKU FRANVZCP07, BIOS 03.02"

## Measured electrically on a copy of this graph feeding a null sink, against
## the preset under the dense pink-weighted multitone of 104 bin-aligned tones.
## See docs/audio-tuning.md for how to reproduce these.
magnitude_rms_db="0.83"
bass_group_delay_swing_ms="9.2"
## On a synthetic hot master (pink noise, soft-clipped to -0.1 dBFS peaks) and
## on a commercial-loudness track, peaks reach the -1 dBFS threshold, so the
## limiter engages on loud masters.
limiter_headroom_db="0.0"   ## worst-case peak on a hot master vs -1 dBFS
## Loudness range against the preset: +0.4 LU on a dynamic track (7.3 -> 7.7 LU)
## and -0.2 LU on a loud one (4.3 -> 4.1 LU). The preset's compressor shows up
## as level-dependent gain rather than in loudness range: against this chain it
## plays quiet material about 3.6 dB louder and loud material 1.5 dB quieter.
dynamic_range_delta_lu="0.4"
