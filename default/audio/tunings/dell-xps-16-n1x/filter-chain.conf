# Dell XPS 16 DX16263 (NVIDIA N1x, SKU 0D8E) speaker tuning.
#
# Nine biquads and a stereo lookahead limiter in front of the MT8901 SoundWire
# speaker sink (2x Realtek RT1321, each driving one side's woofer + tweeter).
#
# Acoustic measurements (Shure MV7+ with onboard DSP disabled) showed:
# - High distortion below ~85 Hz (47-120% THD at 60-80 Hz), so a 4th-order
#   high-pass at 70 Hz protects the woofers while keeping bass group delay
#   swing low (6.14 ms across 30-300 Hz).
# - Clean woofer headroom across 120-200 Hz (1.5-2.5% THD at 95% volume)
#   sitting 15-26 dB below a boxy 450-570 Hz cabinet hump, corrected by broad
#   low-Q lifts at 125 Hz and 210 Hz paired with a -5.5 dB cut at 495 Hz.
# - Midrange smoothing around 1.1-1.45 kHz, gentle -2.5 dB tame at 4.8 kHz, and
#   a +2.5 dB high shelf at 8.5 kHz for top-end air.
#
# Channels are wired explicitly because the limiter is a stereo plugin; a mono
# graph is duplicated per channel and would limit each side independently,
# shifting the stereo image on bass transients.

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Laptop Speakers"
      media.name       = "Laptop Speakers"

      filter.graph = {
        nodes = [
          { type = builtin name = s0_l label = bq_highpass  control = { "Freq" = 70.0   "Q" = 0.7071 } }
          { type = builtin name = s1_l label = bq_highpass  control = { "Freq" = 70.0   "Q" = 0.7071 } }
          { type = builtin name = s2_l label = bq_peaking   control = { "Freq" = 125.0  "Q" = 1.0    "Gain" = 8.5 } }
          { type = builtin name = s3_l label = bq_peaking   control = { "Freq" = 210.0  "Q" = 1.1    "Gain" = 4.0 } }
          { type = builtin name = s4_l label = bq_peaking   control = { "Freq" = 495.0  "Q" = 1.6    "Gain" = -5.5 } }
          { type = builtin name = s5_l label = bq_peaking   control = { "Freq" = 1100.0 "Q" = 2.0    "Gain" = -2.0 } }
          { type = builtin name = s6_l label = bq_peaking   control = { "Freq" = 1450.0 "Q" = 1.8    "Gain" = 3.0 } }
          { type = builtin name = s7_l label = bq_peaking   control = { "Freq" = 4800.0 "Q" = 1.5    "Gain" = -2.5 } }
          { type = builtin name = s8_l label = bq_highshelf control = { "Freq" = 8500.0 "Q" = 0.7071 "Gain" = 2.5 } }

          { type = builtin name = s0_r label = bq_highpass  control = { "Freq" = 70.0   "Q" = 0.7071 } }
          { type = builtin name = s1_r label = bq_highpass  control = { "Freq" = 70.0   "Q" = 0.7071 } }
          { type = builtin name = s2_r label = bq_peaking   control = { "Freq" = 125.0  "Q" = 1.0    "Gain" = 8.5 } }
          { type = builtin name = s3_r label = bq_peaking   control = { "Freq" = 210.0  "Q" = 1.1    "Gain" = 4.0 } }
          { type = builtin name = s4_r label = bq_peaking   control = { "Freq" = 495.0  "Q" = 1.6    "Gain" = -5.5 } }
          { type = builtin name = s5_r label = bq_peaking   control = { "Freq" = 1100.0 "Q" = 2.0    "Gain" = -2.0 } }
          { type = builtin name = s6_r label = bq_peaking   control = { "Freq" = 1450.0 "Q" = 1.8    "Gain" = 3.0 } }
          { type = builtin name = s7_r label = bq_peaking   control = { "Freq" = 4800.0 "Q" = 1.5    "Gain" = -2.5 } }
          { type = builtin name = s8_r label = bq_highshelf control = { "Freq" = 8500.0 "Q" = 0.7071 "Gain" = 2.5 } }

          { type   = lv2
            name   = limiter
            plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = {
              # Both default to enabled: "alr" regulates level toward the
              # threshold and "boost" normalises the threshold up to full
              # scale. A fixed tuning must switch them off or its tone drifts
              # with programme level.
              "alr"   = 0
              "boost" = 0
              "g_in"  = 0.95
              "th"    = 0.891
            }
          }
        ]

        links = [
          { output = "s0_l:Out" input = "s1_l:In" }
          { output = "s1_l:Out" input = "s2_l:In" }
          { output = "s2_l:Out" input = "s3_l:In" }
          { output = "s3_l:Out" input = "s4_l:In" }
          { output = "s4_l:Out" input = "s5_l:In" }
          { output = "s5_l:Out" input = "s6_l:In" }
          { output = "s6_l:Out" input = "s7_l:In" }
          { output = "s7_l:Out" input = "s8_l:In" }
          { output = "s8_l:Out" input = "limiter:in_l" }

          { output = "s0_r:Out" input = "s1_r:In" }
          { output = "s1_r:Out" input = "s2_r:In" }
          { output = "s2_r:Out" input = "s3_r:In" }
          { output = "s3_r:Out" input = "s4_r:In" }
          { output = "s4_r:Out" input = "s5_r:In" }
          { output = "s5_r:Out" input = "s6_r:In" }
          { output = "s6_r:Out" input = "s7_r:In" }
          { output = "s7_r:Out" input = "s8_r:In" }
          { output = "s8_r:Out" input = "limiter:in_r" }
        ]

        inputs  = [ "s0_l:In" "s0_r:In" ]
        outputs = [ "limiter:out_l" "limiter:out_r" ]
      }

      audio.channels = 2
      audio.position = [ FL FR ]

      capture.props = {
        node.name   = "omarchy_speaker_tuning"
        media.class = Audio/Sink
      }
      playback.props = {
        node.name     = "omarchy_speaker_tuning_output"
        node.passive  = true
        target.object = "@SPEAKER_SINK@"
        # Pinned so rerouting streams onto another output never drags the
        # filter's own output onto headphones or into a cycle, and waits for
        # the speaker sink rather than falling back to whatever default exists.
        node.dont-move = true
        node.dont-fallback = true
        node.linger = true
      }
    }
  }
]
