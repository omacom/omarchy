## Dell XPS 16 DX16263 (NVIDIA N1x, SKU 0D8E) internal speakers.
##
## Nine biquads and a lookahead limiter, applied as a PipeWire filter-chain in
## front of the internal speaker sink. Unlike the Intel XPS 14/16 (Cirrus
## CS35L56 with Dell's amplifier firmware), the N1x XPS 16 uses two Realtek
## RT1321 smart amplifiers running without vendor RAE speaker voicing on Linux.
## This protects the woofers from sub-bass excursion, fills in the clean
## 100-220 Hz bass band, tames the 450-570 Hz cabinet hump, and balances the
## midrange and top end.

description="Dell XPS 16 (DX16263, N1x) speakers"
## Matched on the DMI product SKU (whole value, case-insensitive) so this only
## applies to the N1x XPS 16 (2x RT1321 + RT713) and cannot widen to the Intel
## XPS 14/16 (0DB9/0DBA) or other XPS models.
match_sku=("0D8E")
## Unescaped dots: this is passed to awk as a string, where a backslash escape
## would be consumed before the regex sees it.
sink_pattern='^alsa_output.*mtk_sdw_mc.*HiFi__Speaker__sink$'

## Provenance. Bass excursion envelope and cabinet resonances characterised with
## omarchy-audio-tuner (Shure MV7+ with onboard DSP disabled: manual mode,
## denoiser/HPF/popper-stopper/limiter off) across 60-160 Hz distortion sweeps
## and a 104-tone multitone probe, then voiced by ear on the XPS 16 DX16263.
derived_from="Measured bass THD envelope and multitone response on XPS 16 DX16263 (0D8E), voiced by ear"
validated_by="dhh"
validated_on="2026-11-25"
validated_hardware="XPS 16 DX16263 (0D8E)"

## Measured electrically on a copy of this graph feeding a 48 kHz null sink
## (see docs/audio-tuning.md). Matches its analytical biquad design to 0.00 dB
## RMS (0.01 dB max across 104 tones).
magnitude_rms_db="0.00"
bass_group_delay_swing_ms="6.14"
## On a synthetic hot master (pink noise soft-clipped to -0.1 dBFS peaks):
## peaks reach the -1.0 dBFS limiter threshold cleanly with -0.2 LU LRA delta.
limiter_headroom_db="0.0"   ## worst-case peak on a hot master vs -1 dBFS
dynamic_range_delta_lu="-0.2"
