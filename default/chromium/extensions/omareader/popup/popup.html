<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Omareader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1 class="wordmark" aria-label="Omareader"><i class="logo-o"></i><pre class="banner" aria-hidden="true"><span>█▄ ▄█ ▄▀▀▄</span> <b>█▀▀▄ █▀▀▀ ▄▀▀▄ █▀▀▄ █▀▀▀ █▀▀▄</b>
<span>█ ▀ █ █▄▄█</span> <b>█▄▄▀ █▀▀  █▄▄█ █  █ █▀▀  █▄▄▀</b>
<span>█   █ █  █</span> <b>█ ▀▄ █▄▄▄ █  █ █▄▄▀ █▄▄▄ █ ▀▄</b></pre></h1>
  </header>
  <section class="box">
    <div class="title">all sites</div>
    <div class="modes" id="modes" role="radiogroup" aria-label="Mode for all sites">
      <button type="button" role="radio" data-mode="normal" title="Pages as they are">Normal</button>
      <button type="button" role="radio" data-mode="dark" title="Pitch black, page colors keep their hue">Dark</button>
      <button type="button" role="radio" data-mode="omarchy" title="Follow your current Omarchy theme">Follow Omarchy</button>
    </div>
  </section>
  <div class="siterow">
    <span class="site" id="site">—</span>
    <button type="button" role="switch" id="siteToggle" aria-checked="false" aria-label="Theme this site" title="Theme this site · Alt+Shift+O">off</button>
  </div>
  <div id="swatches" class="swatches" aria-hidden="true"></div>
  <footer id="status"></footer>
  <script src="../src/color.js"></script>
  <script src="../src/theme.js"></script>
  <script src="popup.js"></script>
</body>
</html>
