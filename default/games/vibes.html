<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Vibes</title>
<!-- Written to ~/Games/vibes/index.html by omarchy-games-vibes-install, which fills in GAMES. -->
<style>
  html, body { margin: 0; min-height: 100%; background: var(--background); color: var(--foreground); font-family: ui-monospace, "JetBrainsMono Nerd Font", monospace; }
  main { max-width: 1100px; margin: 0 auto; padding: 56px 32px; }
  h1 { margin: 0 0 8px; font-size: 48px; letter-spacing: 4px; color: var(--accent); }
  .dim { color: color-mix(in srgb, var(--foreground) 55%, var(--background)); }
  #games { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; margin-top: 40px; }
  a { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 24px 16px; border-radius: 14px; color: inherit; text-decoration: none; font-size: 18px; text-align: center; background: color-mix(in srgb, var(--foreground) 5%, transparent); outline: none; }
  a:hover, a:focus { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  a img, a .letter { width: 112px; height: 112px; border-radius: 24px; }
  a .letter { display: grid; place-items: center; font-size: 56px; font-weight: bold; background: var(--accent); color: var(--background); }
  #empty { margin-top: 40px; font-size: 18px; }
</style>
</head>
<body>
<main>
  <h1>GAME VIBES</h1>
  <p class="dim">Arrows and Enter to play · Esc on a game's title screen, or Q when it's paused, comes back here</p>
  <div id="games"></div>
  <p id="empty" hidden>No games yet.</p>
  <p class="dim">Make a new one, or keep working on one of these, from the agents panel: <span style="color: var(--accent)">Make something cool → Game</span>.</p>
</main>
<script>
const GAMES = /*GAMES*/[];

// omarchy-games-vibes-launch opens this page with the current theme's palette in the fragment.
const palette = { background: '#1a1b26', foreground: '#a9b1d6', accent: '#7aa2f7' };
try {
  const current = JSON.parse(new URLSearchParams(location.hash.slice(1)).get('palette') ?? '{}');
  for (const key of Object.keys(palette)) if (/^#[0-9a-f]{6}$/i.test(current[key] ?? '')) palette[key] = current[key];
} catch {}
for (const [key, value] of Object.entries(palette)) document.documentElement.style.setProperty(`--${key}`, value);

// omarchy-games-vibes-launch <game> adds open=<game>: go straight to it, and take open out of
// this page's address first, so coming back with Esc lands on the list rather than the game again.
const params = new URLSearchParams(location.hash.slice(1));
const open = GAMES.find(game => game.name === params.get('open'));
params.delete('open');
history.replaceState(null, '', `#${params}`);

const list = document.getElementById('games');
for (const game of GAMES) {
  const link = document.createElement('a');
  // The fragment goes along, so each game opens in the theme too.
  link.href = `${game.url}/index.html${location.hash}`;
  if (game.icon) {
    const img = document.createElement('img');
    img.src = `${game.url}/icon.svg`;
    img.alt = '';
    link.append(img);
  } else {
    const letter = document.createElement('span');
    letter.className = 'letter';
    letter.textContent = game.title.trim().charAt(0).toUpperCase();
    link.append(letter);
  }
  link.append(game.title);
  list.append(link);
}
document.getElementById('empty').hidden = GAMES.length > 0;
list.querySelector('a')?.focus();
// After load: Chrome makes a navigation started while the page loads replace it, which would leave no list to go back to.
if (open) addEventListener('load', () => setTimeout(() => { location.href = `${open.url}/index.html${location.hash}`; }));

// Arrows move through the grid as it is laid out.
addEventListener('keydown', event => {
  const links = [...list.querySelectorAll('a')];
  const at = links.indexOf(document.activeElement);
  if (at < 0 || !links.length) return;
  const columns = getComputedStyle(list).gridTemplateColumns.split(' ').length;
  const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -columns, ArrowDown: columns }[event.key];
  if (step === undefined) return;
  event.preventDefault();
  links[Math.min(links.length - 1, Math.max(0, at + step))].focus();
});
</script>
</body>
</html>
