# CIX Sky1 / Radxa Orion audio node naming and default-sink priority.
#
# 1. sky1-card names its DAI links "soc:i2s-m5a i2s-hifi-0" .. "m5e" and does
#    not populate HDMI ELD product names, so WirePlumber otherwise uses the raw
#    DAI string as node.nick.
# 2. Radxa Orion boards expose a 4-pin PCB speaker header without jack sense
#    ("Speaker"). Keep its session priority below connected DisplayPort/HDMI
#    outputs and 3.5mm jacks so plugged-in monitors and headphones win by
#    default while chassis speakers remain selectable.

monitor.alsa.rules = [
  {
    matches = [ { alsa.driver_name = "snd_soc_sky1_sound_card", node.name = "~alsa_output.*HiFi__HDMI1__sink" } ]
    actions = { update-props = { node.nick = "HDMI / DisplayPort 1", node.description = "HDMI / DisplayPort 1", priority.driver = 1104, priority.session = 1104 } }
  }
  {
    matches = [ { alsa.driver_name = "snd_soc_sky1_sound_card", node.name = "~alsa_output.*HiFi__HDMI2__sink" } ]
    actions = { update-props = { node.nick = "HDMI / DisplayPort 2", node.description = "HDMI / DisplayPort 2", priority.driver = 1103, priority.session = 1103 } }
  }
  {
    matches = [ { alsa.driver_name = "snd_soc_sky1_sound_card", node.name = "~alsa_output.*HiFi__HDMI3__sink" } ]
    actions = { update-props = { node.nick = "HDMI / DisplayPort 3", node.description = "HDMI / DisplayPort 3", priority.driver = 1102, priority.session = 1102 } }
  }
  {
    matches = [ { alsa.driver_name = "snd_soc_sky1_sound_card", node.name = "~alsa_output.*HiFi__HDMI4__sink" } ]
    actions = { update-props = { node.nick = "HDMI / DisplayPort 4", node.description = "HDMI / DisplayPort 4", priority.driver = 1101, priority.session = 1101 } }
  }
  {
    matches = [ { alsa.driver_name = "snd_soc_sky1_sound_card", node.name = "~alsa_output.*HiFi__HDMI5__sink" } ]
    actions = { update-props = { node.nick = "HDMI / DisplayPort 5", node.description = "HDMI / DisplayPort 5", priority.driver = 1100, priority.session = 1100 } }
  }
  {
    matches = [ { alsa.driver_name = "snd_hda_cix_ipbloq", node.name = "~alsa_output.*HiFi__Speaker__sink" } ]
    actions = { update-props = { node.nick = "Speaker", node.description = "Speaker", priority.driver = 650, priority.session = 650 } }
  }
  {
    matches = [ { alsa.driver_name = "snd_hda_cix_ipbloq", node.name = "~alsa_output.*HiFi__Line__sink" } ]
    actions = { update-props = { node.nick = "Line Output", node.description = "Line Output", priority.driver = 1150, priority.session = 1150 } }
  }
  {
    matches = [ { alsa.driver_name = "snd_hda_cix_ipbloq", node.name = "~alsa_output.*HiFi__Headphones__sink" } ]
    actions = { update-props = { node.nick = "Headphones", node.description = "Headphones", priority.driver = 1200, priority.session = 1200 } }
  }
  {
    matches = [ { alsa.driver_name = "snd_hda_cix_ipbloq", node.name = "~alsa_input.*HiFi__Mic1__source" } ]
    actions = { update-props = { node.nick = "Headset Microphone", node.description = "Headset Microphone" } }
  }
  {
    matches = [ { alsa.driver_name = "snd_hda_cix_ipbloq", node.name = "~alsa_input.*HiFi__Mic2__source" } ]
    actions = { update-props = { node.nick = "Front Microphone", node.description = "Front Microphone" } }
  }
]
