# Decode video on the GPU through mpv's list of reliable hardware decoders,
# falling back to software when none applies. ~/.config/mpv/mpv.conf overrides this.
hwdec=auto-safe
# Keep mpv's newer Vulkan-only decoders (ProRes, FFV1, DPX) in software:
# alpha ProRes aborts libplacebo on the first frame (#18613).
hwdec-codecs=h264,vc1,hevc,vp8,vp9,av1
