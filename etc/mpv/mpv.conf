# Decode video on the GPU through mpv's list of reliable hardware decoders,
# falling back to software when none applies. ~/.config/mpv/mpv.conf overrides this.
hwdec=auto-safe
# Keep playing where the only renderer is a software one (llvmpipe, as on a
# Mac whose GPU has no driver yet, or a VM). mpv 0.41 rejects it and then
# aborts in its X11 fallback; with a hardware renderer this changes nothing.
gpu-sw=yes
