# Delegate cgroup v2 memory.low down to session.slice, and lower the user
# manager's OOMScoreAdjust floor to -200 so wayland-wm@.service can shield
# Hyprland and Quickshell from the kernel OOM killer. Normal user apps keep
# +200 via /etc/systemd/user.conf.d/30-omarchy-oom.conf.
[Service]
MemoryLow=768M
OOMScoreAdjust=-200
