# Wait for boot-time app.slice MemoryMax generation so every user@<uid>.service
# instance sees /run/systemd/user/app.slice.d/10-omarchy-high-memory.conf on
# startup, and delegate cgroup v2 memory.low down to session.slice; see
# /etc/systemd/system/user.slice.d/10-omarchy-memory.conf.
[Unit]
After=omarchy-high-memory.service

[Service]
MemoryLow=768M
