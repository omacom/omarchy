# Pull in boot-time app-graphical.slice MemoryMax generation before any
# user@<uid>.service starts (no-op below 56 GiB via ConditionMemory), and
# delegate cgroup v2 memory.low down to session.slice; see
# /etc/systemd/system/user.slice.d/10-omarchy-memory.conf.
[Unit]
Wants=omarchy-high-memory.service
After=omarchy-high-memory.service

[Service]
MemoryLow=768M
