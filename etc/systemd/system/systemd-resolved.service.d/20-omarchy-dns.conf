[Service]
# NetworkManager republishes link DNS when resolved starts. Refresh first so
# our live override follows that update. The helper is a no-op in DHCP mode.
# At boot NetworkManager may not be running yet; its dispatcher applies later.
# A failed DNS preference must never prevent the resolver itself from starting.
ExecStartPost=-+/usr/bin/python3 -I /usr/share/omarchy/default/dns/dns.py apply --refresh
