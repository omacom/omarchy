[Service]
# Hardening for the kernel-modules-hook cleanup oneshot. It only needs to
# remove stale, pacman-unowned module trees under /usr/lib/modules; the rest
# of the filesystem can stay read-only and private.
ProtectSystem=strict
ReadWritePaths=/usr/lib/modules
ProtectHome=yes
PrivateNetwork=yes
PrivateTmp=yes
ProtectClock=yes
ProtectKernelLogs=yes
ProtectKernelTunables=yes
ProtectControlGroups=yes
ProtectHostname=yes
NoNewPrivileges=yes
RestrictNamespaces=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
