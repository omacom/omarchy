[Service]
# Only the handler writes here; user watchers need names, not file contents.
RuntimeDirectory=omarchy-crash-events
RuntimeDirectoryMode=0755
RuntimeDirectoryPreserve=yes
# Emitted after processing, independent of Storage= and core size limits.
# Each invocation is unique; deleting the marker does not erase its inotify event.
# Notification plumbing must never make coredump processing fail.
ExecStopPost=-/usr/bin/touch -- /run/omarchy-crash-events/${INVOCATION_ID}
ExecStopPost=-/usr/bin/rm -f -- /run/omarchy-crash-events/${INVOCATION_ID}
