[Unit]
# Pacman runs ldconfig at the end of every transaction, so rebuilding
# /etc/ld.so.cache again synchronously before sysinit.target whenever /usr is
# newer than /etc/.updated is redundant. Re-declare ConditionFileNotEmpty
# because resetting any Condition*= clears all Condition*= entries.
ConditionNeedsUpdate=
ConditionFileNotEmpty=|!/etc/ld.so.cache
