# Omarchy owns the power profile: omarchy-powerprofiles-set restores the
# profile remembered for AC or battery through power-profiles-daemon, which
# also sets the CPU energy performance preference (EPP) for that profile. By
# default asusd does the same jobs on its own: it switches the platform profile
# when the charger is plugged in or out, and after every profile change, by
# whoever made it, it rewrites the EPP from its own table. The two then race on
# every plug, and asusd's EPP replaces the one power-profiles-daemon chose.
# Turn those three asusd settings off whenever it starts (asusd saves them in
# /etc/asusd/asusd.ron); everything else asusd does is unchanged.
[Service]
ExecStartPost=-/usr/bin/busctl --system set-property xyz.ljones.Asusd /xyz/ljones xyz.ljones.Platform ChangePlatformProfileOnAc b false
ExecStartPost=-/usr/bin/busctl --system set-property xyz.ljones.Asusd /xyz/ljones xyz.ljones.Platform ChangePlatformProfileOnBattery b false
ExecStartPost=-/usr/bin/busctl --system set-property xyz.ljones.Asusd /xyz/ljones xyz.ljones.Platform PlatformProfileLinkedEpp b false
