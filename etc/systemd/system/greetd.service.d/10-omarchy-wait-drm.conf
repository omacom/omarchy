[Service]
# Wait for the real DRM driver to replace simpledrm before greetd starts.
# Without early KMS (e.g., prebuilt UKI first boot or hardware that keeps its
# GPU driver out of the initramfs), Hyprland, for the login screen or the
# autologin session, would start on simpledrm's card, which the real driver
# then takes away from under it.
ExecStartPre=-/usr/bin/omarchy-system-wait-drm
