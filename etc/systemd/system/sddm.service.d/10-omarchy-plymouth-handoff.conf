[Unit]
# omarchy-plymouth-handoff fades the splash to black and quits Plymouth once
# the login screen has drawn, as GDM does. Waiting for plymouth-quit.service
# instead drops the display to the console, and the firmware logo it still
# holds, until Hyprland starts.
Conflicts=plymouth-quit.service
Wants=omarchy-plymouth-handoff.service
OnFailure=plymouth-quit.service
