# Decide at every SDDM start, not once at boot, whose desktop it opens. The
# first step turns any autologin off and must succeed, or SDDM does not start
# into someone else's desktop; the second names the one account, or the one
# whose key slot unlocked the disk this boot, and may fail into the login
# screen.
[Service]
ExecStartPre=/usr/bin/omarchy-login-select --clear
ExecStartPre=-/usr/bin/omarchy-login-select
