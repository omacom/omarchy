# Keep user apps at the standard +200 OOMScoreAdjust even though user@.service
# lowers its own floor to -200 to shield wayland-wm@.service. Without this,
# systemd --user defaults DefaultOOMScoreAdjust to manager + 100 (-100), which
# would put user apps below system daemons.
[Manager]
DefaultOOMScoreAdjust=200
