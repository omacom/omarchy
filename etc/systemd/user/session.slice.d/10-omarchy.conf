# Keep the compositor, shell, audio daemon, and session helpers resident in RAM
# and responsive under heavy app.slice memory or CPU load.
#
# Hyprland, Quickshell, PipeWire, and desktop portals run in session.slice,
# while browsers, builds, and local AI models run in app.slice. Without this,
# MGLRU swaps out hundreds of megabytes of the compositor and shell under
# app.slice pressure, stalling the desktop when you open the menu, click the
# bar, or switch workspaces. MemoryMax stays infinity so session.slice never
# hits a cgroup OOM; app.slice absorbs all swap and remains the sole
# systemd-oomd kill candidate.
[Slice]
MemorySwapMax=0
CPUWeight=500
