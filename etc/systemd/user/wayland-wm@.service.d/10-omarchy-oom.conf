# Shield the Wayland compositor and shell (Hyprland, Quickshell, Xwayland) from
# the kernel OOM killer. wayland-wm@hyprland.desktop.service sets OOMPolicy=stop,
# so a kernel OOM kill on any child tears down the whole desktop session. Paired
# with OOMScoreAdjust=-200 on user@.service and DefaultOOMScoreAdjust=200 in
# user.conf.d, this puts the session 400 points below every app in app.slice.
[Service]
OOMScoreAdjust=-200
