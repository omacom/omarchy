[Service]
# The boot splash may still be fading to black as an autologin starts the
# session; Hyprland can't open the display until Plymouth lets go of it
# (bin/omarchy-plymouth-handoff).
ExecStartPre=-/bin/sh -c '[ ! -S /run/omarchy-plymouth-handoff.sock ] || exec /usr/bin/omarchy-plymouth-release'
