[Service]
# limine-snapper-sync autostarts limine-restore-notify.desktop to offer a restore
# after booting into a snapshot. That runs as soon as the session starts, usually
# before the shell has claimed org.freedesktop.Notifications, and the shell has
# no D-Bus activation file, so the offer is dropped and nothing says the system
# is running from a snapshot. Wait for the shell, but only so long: the leading
# - sends the offer anyway when the shell never comes up.
ExecStartPre=-/usr/bin/omarchy-notification-wait 30
