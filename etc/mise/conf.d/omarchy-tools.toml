# Managed by Omarchy through the omarchy-settings package. Override individual tools in ~/.config/mise/config.toml.

[settings]
locked_scopes = ["project", "global"]
system_installs_dir = "~/.local/share/mise/installs"
system_shims_dir = "~/.local/share/mise/shims"

# Agent CLIs update themselves before they run, at most once every four hours (mise auto_update).
# Backend options go inside a tool's table, never in a "tool[...]" key: mise drops bracket options from a
# key whose value is a table, so a tool declared that way installs without them.
[tools]
amp = { version = "latest", lazy = true, auto_update = "4h", lazy_bins = ["amp"] }
antigravity-cli = { version = "latest", lazy = true, auto_update = "4h" }
basecamp = { version = "latest", lazy = true }
claude = { version = "latest", lazy = true, auto_update = "4h" }
codex = { version = "latest", lazy = true, auto_update = "4h" }
copilot = { version = "latest", lazy = true, auto_update = "4h" }
crush = { version = "latest", lazy = true, auto_update = "4h" }
cursor-agent = { version = "latest", lazy = true, auto_update = "4h" }
gh = { version = "latest", lazy = true }
ghui = { version = "latest", lazy = true }
grok = { version = "latest", lazy = true, auto_update = "4h" }
hey-cli = { version = "latest", lazy = true }
"http:devin" = { version = "latest", lazy = true, auto_update = "4h", lazy_bins = ["devin"], platforms_linux_x64_url = "https://static.devin.ai/cli/{{ version }}/devin-{{ version }}-x86_64-unknown-linux.tar.gz", platforms_linux_arm64_url = "https://static.devin.ai/cli/{{ version }}/devin-{{ version }}-aarch64-unknown-linux.tar.gz", bin_path = "bin", version_list_url = "https://static.devin.ai/cli/current/manifest.json", version_json_path = ".version" }
"http:kiro-cli" = { version = "latest", lazy = true, auto_update = "4h", lazy_bins = ["kiro-cli"], platforms_linux_x64_url = "https://prod.download.cli.kiro.dev/stable/{{version}}/kirocli-x86_64-linux.tar.gz", platforms_linux_arm64_url = "https://prod.download.cli.kiro.dev/stable/{{version}}/kirocli-aarch64-linux.tar.gz", version_list_url = "https://prod.download.cli.kiro.dev/stable/latest/manifest.json", version_json_path = ".version" }
hunk = { version = "latest", lazy = true }
muse = { version = "latest", lazy = true, auto_update = "4h" }
node = { version = "latest", lazy = true }
"npm:@deepseek-ai/dsh" = { version = "latest", lazy = true, auto_update = "4h", lazy_bins = ["dsh"] }
"npm:@kilocode/cli" = { version = "latest", lazy = true, auto_update = "4h", lazy_bins = ["kilo"] }
"npm:@minimax-ai/code" = { version = "latest", lazy = true, auto_update = "4h", lazy_bins = ["mcode"], allow_builds = "better-sqlite3" }
"npm:@moonshot-ai/kimi-code" = { version = "latest", lazy = true, auto_update = "4h", lazy_bins = ["kimi"] }
"npm:cf" = { version = "latest", lazy = true, lazy_bins = ["cf"] }
"npm:command-code" = { version = "latest", lazy = true, auto_update = "4h", lazy_bins = ["commandcode"] }
"npm:freebuff" = { version = "latest", lazy = true, auto_update = "4h", lazy_bins = ["freebuff"] }
oh-my-pi = { version = "latest", lazy = true, auto_update = "4h" }
opencode = { version = "latest", lazy = true, auto_update = "4h" }
ori = { version = "latest", lazy = true }
pi = { version = "latest", lazy = true, auto_update = "4h" }
playwright = { version = "latest", lazy = true }
qwen = { version = "latest", lazy = true, auto_update = "4h" }
uv = { version = "latest", lazy = true }
