# Upgrades must not delete the version a running process is executing from:
# mise up would prune the old install dir out from under a live session.
#
# Agents start through mise's command wrappers, and mise builds the wrapper's
# PATH by putting the tool directories where the shims directory sits, which
# env-bootstrap places after the system directories. Inside Claude, Codex and
# Grok the system ruby, python, node and go then beat the versions mise pins,
# while tools with no system copy (npm, pip) still come from mise. Keep
# mise's tools in front wherever mise builds a PATH, as the shell hook does.
[settings]
upgrade.auto_prune = false
activate_aggressive = true

# Keep Cursor optional while applying these options whenever mise installs it.
# Expose only its launcher so the bundled Node cannot shadow the user's Node.
[tool_alias]
cursor-agent = 'http:cursor-agent[bin_path=bin,postinstall=mkdir -p "$MISE_TOOL_INSTALL_PATH/bin" && ln -sfn ../dist-package/cursor-agent "$MISE_TOOL_INSTALL_PATH/bin/cursor-agent"]'

# Coding agents get herdr's status and session-restore hooks when mise installs or upgrades them.
[hooks]
postinstall = "omarchy-agent-integrate-herdr"
