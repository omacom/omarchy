# Stop broadcasting the machine's identity to every network it joins: no
# hostname in DHCP, a stable per-network MAC instead of the permanent
# hardware address, and RFC 4941 IPv6 privacy addresses. `stable` keeps one
# MAC per network, so reservations and captive-portal logins still work.
[connection]
ipv4.dhcp-send-hostname = 0
ipv6.dhcp-send-hostname = 0
wifi.cloned-mac-address = stable
ethernet.cloned-mac-address = stable
ipv6.ip6-privacy = 2
