# Check connectivity against Omarchy's own endpoint instead of Arch's. It must
# stay plain HTTP so a captive portal can intercept it, and the network panel
# opens the same URL to reach the portal's sign-in page. That is why it lives
# on omacom.io: archlinux.org is HSTS-preloaded for every subdomain, and
# omarchy.org has sent includeSubDomains, so browsers force those to HTTPS.
# omacom.io must never send HSTS with includeSubDomains or join the preload
# list. The endpoint answers 204 with "X-NetworkManager-Status: online", so no
# body is expected.
[connectivity]
uri=http://ping.omacom.io/nm-check.txt
response=
