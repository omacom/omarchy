# Keep Realtek RTL8922AE off Wi-Fi 7 multi-link (MLO): rtw89 drops MLO links
# every few minutes ("Failed to get MLO link info", deauth by local choice).
# MLO requires PMF, so disabling PMF makes it associate as a single link while
# keeping EHT rates. Remove once rtw89 MLO is stable.
[connection-omarchy-rtl8922ae]
match-device=driver:rtw89_8922ae
wifi-sec.pmf=1
