# Bundle the mount-event burst override into systemd initramfs images:
# mkinitcpio's systemd hook does not copy /etc/systemd/system.conf.d/, so PID 1
# in the initrd otherwise hits the default 5/s mount-monitor-dispatch rate limit
# and stalls sysroot.mount for 1.0 s (systemd/systemd#28264).
if [[ " ${HOOKS[*]:-} " == *" systemd "* && -f /etc/systemd/system.conf.d/20-mount-events.conf &&
  " ${FILES[*]:-} " != *" /etc/systemd/system.conf.d/20-mount-events.conf "* ]]; then
  FILES+=(/etc/systemd/system.conf.d/20-mount-events.conf)
fi
