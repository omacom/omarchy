# The platform's HOOKS baseline. mkinitcpio sources mkinitcpio.conf and then
# every drop-in here in name order, so the baseline sorts first and the drop-ins
# after it add their hooks to it instead of being overwritten by it.
#
# Apple Silicon boots a systemd initramfs, and its platform package adds the
# firmware and encryption hooks. Every other machine keeps the busybox line, as
# does one without the runtime's detector. A detector that cannot place the
# machine stops the build rather than let it produce an image for the wrong
# platform.
_omarchy_platform=""
if _omarchy_detector=$(command -v omarchy-hw-platform); then
  _omarchy_platform=$("$_omarchy_detector") || return 1
fi
# omarchy-settings can update before the omarchy runtime whose detector still
# says apple-silicon.
[[ $_omarchy_platform != "apple-silicon" ]] || _omarchy_platform=aarch64-apple

# A Mac whose mkinitcpio.conf carries the asahi hook, or the busybox encrypt
# hook that unlocks it through cryptdevice= (sd-encrypt cannot parse that), boots
# the initramfs its platform set up without the Apple boot package, as a legacy
# install does. That line is kept: replacing it would drop asahi or hand
# cryptdevice= to sd-encrypt. The asahi hook also marks such a root off a Mac,
# as in a chroot or a VM.
#
# Plymouth is the exception on a busybox encrypt line (#18009). Before 4.5 the
# Omarchy drop-in overwrote HOOKS with a line that included it, so the graphical
# LUKS prompt worked even though mkinitcpio.conf itself never listed plymouth.
# A legacy line has no systemd hook, and the Apple boot package only inserts
# plymouth after systemd, so leaving the line untouched put the prompt on the
# text console. Insert it once when that install hook is on disk: after udev,
# or immediately before encrypt when udev is absent or comes later. An
# unencrypted line has no passphrase prompt and stays untouched, as does a line
# that already carries plymouth, and a machine with no plymouth hook must not
# gain one mkinitcpio cannot build.
if [[ " ${HOOKS[*]:-} " == *" asahi "* ]] ||
  [[ $_omarchy_platform == "aarch64-apple" && " ${HOOKS[*]:-} " == *" encrypt "* ]]; then
  _omarchy_platform=platform-owned
fi

case $_omarchy_platform in
  platform-owned)
    _omarchy_plymouth_install=${OMARCHY_INITCPIO_INSTALL:-/usr/lib/initcpio/install}/plymouth
    if [[ -f $_omarchy_plymouth_install && " ${HOOKS[*]:-} " == *" encrypt "* && " ${HOOKS[*]:-} " != *" plymouth "* ]]; then
      _omarchy_hooks=()
      _omarchy_plymouth_added=false
      for _omarchy_hook in "${HOOKS[@]}"; do
        if [[ $_omarchy_hook == encrypt && $_omarchy_plymouth_added == false ]]; then
          _omarchy_hooks+=(plymouth)
          _omarchy_plymouth_added=true
        fi
        _omarchy_hooks+=("$_omarchy_hook")
        if [[ $_omarchy_hook == udev && $_omarchy_plymouth_added == false ]]; then
          _omarchy_hooks+=(plymouth)
          _omarchy_plymouth_added=true
        fi
      done
      HOOKS=("${_omarchy_hooks[@]}")
    fi
    unset _omarchy_hooks _omarchy_hook _omarchy_plymouth_added _omarchy_plymouth_install
    ;;
  aarch64-apple)
    HOOKS=(base systemd plymouth autodetect microcode modconf kms keyboard sd-vconsole block filesystems fsck)
    ;;
  *)
    HOOKS=(base udev plymouth keyboard autodetect microcode modconf kms keymap consolefont block encrypt filesystems fsck btrfs-overlayfs)
    ;;
esac
unset _omarchy_platform _omarchy_detector
