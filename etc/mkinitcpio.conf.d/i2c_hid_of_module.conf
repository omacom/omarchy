# Early-load the I2C HID transport on Snapdragon laptops, where the kernel
# builds it as a module. Their internal keyboards sit on I2C, and mkinitcpio's
# keyboard hook adds only drivers/hid/hid-*, so the disk unlock prompt took no
# keys. As with thunderbolt, the module is named without ? and only when the
# kernel has it, since a systemd initramfs copies MODULES as written into
# modules-load.d. omarchy-settings can update before the omarchy runtime that
# carries the detector; without it the module stays out, as on any machine the
# detector doesn't call Snapdragon.
if command -v omarchy-hw-aarch64-qualcomm >/dev/null && omarchy-hw-aarch64-qualcomm &&
  [[ $(modinfo -k "${KERNELVERSION:-$(uname -r)}" -F filename i2c-hid-of 2>/dev/null) == /* ]]; then
  MODULES+=(i2c-hid-of)
fi
