# Adjusts the baseline HOOKS from 00-omarchy-hooks.conf. It stays apart from
# the baseline because it reads what the hardware drop-ins sorting before it set.

# The proprietary NVIDIA driver does early KMS itself: nvidia.conf (written by
# install/hardware/nvidia.sh, sourced before this file) early-loads nvidia_drm
# with modeset=1. Keeping the kms hook on such a system makes autodetect pull
# in nouveau — and ~100 MB of its GSP firmware — for a driver that never runs.
# Drop kms only when nvidia_drm is early-loaded and NVIDIA owns every display
# controller. Hybrid systems keep kms: their iGPU still needs it for early
# KMS at the LUKS prompt. So does anything unexpected, like a PCI tree that
# cannot be read.
#
# This reads MODULES midway through mkinitcpio's drop-in sourcing, so a
# later-sorting drop-in that resets MODULES outright — surface_device_modules.conf
# does — would strip nvidia_drm after kms was already dropped. Every machine
# Omarchy writes such a file for carries an Intel iGPU, which keeps kms here
# through the scan below; keep it that way.
#
# Hybrid laptops whose NVIDIA GPU drives no display get the same treatment the
# other way round. The panel and every port hang off the iGPU, so nothing needs
# NVIDIA before the root filesystem is up: drop the early nvidia modules (with
# the GSP firmware they declare) and replace kms with the iGPU's own driver, so
# autodetect stops adding nouveau and its firmware too. NVIDIA still loads from
# the root filesystem as on any other boot. Only when it is certain: the dGPU
# must expose a DRM card with no outputs and not be the boot display, and every
# other display controller must be bound to a loadable driver. Replacing kms
# relies on MODULES surviving the rest of the drop-ins, so a later-sorting one
# that resets MODULES keeps kms and the nvidia modules as before.
if [[ " ${MODULES[*]:-} " == *" nvidia_drm "* ]]; then
  _omarchy_nvidia_gpu=0
  _omarchy_other_gpu=0
  _omarchy_nvidia_display=0
  _omarchy_igpu_modules=()
  _omarchy_igpu_known=1
  for _omarchy_pci in "${OMARCHY_PCI_DEVICES_PATH:-/sys/bus/pci/devices}"/*; do
    if [[ ! -r $_omarchy_pci/class || ! -r $_omarchy_pci/vendor ]]; then
      # An unreadable device could be another GPU. Inconclusive keeps kms.
      _omarchy_other_gpu=1
      _omarchy_igpu_known=0
      continue
    fi
    [[ $(<"$_omarchy_pci/class") == "0x03"* ]] || continue
    if [[ $(<"$_omarchy_pci/vendor") == "0x10de" ]]; then
      _omarchy_nvidia_gpu=1
      # No DRM card means nvidia_drm hasn't bound it, so its outputs are
      # unknown: count it as driving a display.
      _omarchy_outputs=1
      for _omarchy_card in "$_omarchy_pci"/drm/card*; do
        [[ -d $_omarchy_card ]] || continue
        _omarchy_outputs=0
        for _omarchy_output in "$_omarchy_card"/card*-*; do
          [[ -e $_omarchy_output ]] && _omarchy_outputs=1
        done
      done
      if ((_omarchy_outputs)) || [[ -r $_omarchy_pci/boot_vga && $(<"$_omarchy_pci/boot_vga") == "1" ]]; then
        _omarchy_nvidia_display=1
      fi
    else
      _omarchy_other_gpu=1
      if [[ -L $_omarchy_pci/driver/module ]]; then
        _omarchy_module=$(readlink "$_omarchy_pci/driver/module")
        _omarchy_igpu_modules+=("${_omarchy_module##*/}")
      else
        _omarchy_igpu_known=0
      fi
    fi
  done

  # mkinitcpio appends every drop-in to mkinitcpio.conf and sources the result
  # once, so this file cannot find its neighbours from its own path. Walk the
  # drop-in directory in mkinitcpio's own order instead. Not finding this file
  # there (a relocated config, an unreadable directory) counts as a reset.
  _omarchy_modules_reset=1
  _omarchy_after=0
  _omarchy_conf_dir="${OMARCHY_MKINITCPIO_CONF_DIR:-/etc/mkinitcpio.conf.d}"
  while IFS= read -r -d '' _omarchy_conf; do
    if ((_omarchy_after)); then
      grep -Eq '^[[:space:]]*MODULES=\(' "$_omarchy_conf_dir/$_omarchy_conf" 2>/dev/null && _omarchy_modules_reset=1
    elif [[ $_omarchy_conf == "omarchy_hooks.conf" ]]; then
      _omarchy_after=1
      _omarchy_modules_reset=0
    fi
  done < <(LC_ALL=C.UTF-8 find "$_omarchy_conf_dir" -maxdepth 1 -xtype f -name '*.conf' -print0 2>/dev/null |
    sed -z 's/.*\///' | LC_ALL=C.UTF-8 sort -zVu)

  _omarchy_drop_kms=0
  if ((_omarchy_nvidia_gpu && !_omarchy_other_gpu)); then
    _omarchy_drop_kms=1
  elif ((_omarchy_nvidia_gpu && !_omarchy_nvidia_display && _omarchy_igpu_known && ${#_omarchy_igpu_modules[@]} && !_omarchy_modules_reset)); then
    _omarchy_modules=()
    for _omarchy_module in "${MODULES[@]}"; do
      [[ $_omarchy_module == "nvidia" || $_omarchy_module == "nvidia_"* ]] || _omarchy_modules+=("$_omarchy_module")
    done
    MODULES=("${_omarchy_modules[@]}" "${_omarchy_igpu_modules[@]}")
    _omarchy_drop_kms=1
  fi

  if ((_omarchy_drop_kms)); then
    _omarchy_hooks=()
    for _omarchy_hook in "${HOOKS[@]}"; do
      [[ $_omarchy_hook == "kms" ]] || _omarchy_hooks+=("$_omarchy_hook")
    done
    HOOKS=("${_omarchy_hooks[@]}")
  fi
  unset _omarchy_nvidia_gpu _omarchy_other_gpu _omarchy_nvidia_display _omarchy_igpu_modules _omarchy_igpu_known
  unset _omarchy_pci _omarchy_card _omarchy_output _omarchy_outputs _omarchy_module _omarchy_modules
  unset _omarchy_conf _omarchy_conf_dir _omarchy_after _omarchy_modules_reset _omarchy_drop_kms _omarchy_hooks _omarchy_hook
fi

# Bundle vconsole.conf so Plymouth uses the configured keyboard layout at the
# LUKS prompt, but only when that layout types Latin letters. Passphrases are
# Latin characters, so bundling a Hebrew/Greek/Cyrillic/Arabic layout would
# make the correct passphrase untypeable and lock the user out.
if [[ -f /etc/vconsole.conf ]]; then
  case $(. /etc/vconsole.conf && echo "${XKBLAYOUT%%,*}") in
    af | am | ara | bd | bg | by | et | ge | gr | il | in | iq | ir | kg | kh | kz | la | lk | mk | mm | mn | mv | np | rs | ru | sy | th | tj | ua) ;;
    *) FILES+=(/etc/vconsole.conf) ;;
  esac
fi
