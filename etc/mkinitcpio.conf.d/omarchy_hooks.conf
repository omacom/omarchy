HOOKS=(base udev plymouth keyboard autodetect microcode modconf kms keymap consolefont block encrypt filesystems fsck btrfs-overlayfs)

# The proprietary NVIDIA driver does early KMS itself: nvidia.conf (written by
# install/hardware/nvidia.sh, sourced before this file) early-loads nvidia_drm
# with modeset=1. Keeping the kms hook on such a system makes autodetect pull
# in nouveau — and ~100 MB of its GSP firmware — for a driver that never runs.
# Drop kms when nvidia_drm is early-loaded and every *connected* display is on
# NVIDIA. Hybrid laptops keep kms: their panel hangs off the iGPU. Desktops
# with an idle iGPU (present in PCI, nothing plugged in) drop it — that idle
# chip would otherwise pull ~100 MB of amdgpu/nouveau firmware into every UKI
# and exhaust a small ESP (#13357). Anything unexpected (unreadable PCI or DRM
# sysfs) keeps kms.
#
# This reads MODULES midway through mkinitcpio's drop-in sourcing, so a
# later-sorting drop-in that resets MODULES outright — surface_device_modules.conf
# does — would strip nvidia_drm after kms was already dropped. Every machine
# Omarchy writes such a file for carries an Intel iGPU with a connected panel,
# which keeps kms here through the scan below; keep it that way.

# True when this PCI display controller drives at least one connected DRM
# connector. Missing or unreadable DRM state is inconclusive and returns true
# so kms stays. Writeback-only / disconnected cards return false.
_omarchy_gpu_has_connected_output() {
  local pci_path=$1
  local drm_root card connector card_pci status
  local saw_card=0

  drm_root="${OMARCHY_DRM_PATH:-/sys/class/drm}"
  [[ -d $drm_root ]] || return 0

  for card in "$drm_root"/card[0-9]*; do
    [[ -e $card/device ]] || continue
    card_pci=$(readlink -f "$card/device" 2>/dev/null) || return 0
    [[ $card_pci == "$(readlink -f "$pci_path" 2>/dev/null)" ]] || continue
    saw_card=1

    for connector in "$card"/card[0-9]*-*; do
      [[ -e $connector ]] || continue
      # Only a disconnected port, or amdgpu's always-"unknown" Writeback-1,
      # counts as idle; any other state is inconclusive.
      [[ -r $connector/status ]] || return 0
      status=$(<"$connector/status")
      [[ $status == "disconnected" ]] && continue
      [[ $status == "unknown" && $connector == *-Writeback-* ]] && continue
      return 0
    done
  done

  # PCI GPU with no DRM card yet (pre-driver) is inconclusive.
  ((saw_card)) || return 0
  return 1
}

if [[ " ${MODULES[*]:-} " == *" nvidia_drm "* ]]; then
  _omarchy_nvidia_gpu=0
  _omarchy_other_gpu=0
  for _omarchy_pci in "${OMARCHY_PCI_DEVICES_PATH:-/sys/bus/pci/devices}"/*; do
    if [[ ! -r $_omarchy_pci/class || ! -r $_omarchy_pci/vendor ]]; then
      # An unreadable device could be another GPU. Inconclusive keeps kms.
      _omarchy_other_gpu=1
      continue
    fi
    [[ $(<"$_omarchy_pci/class") == "0x03"* ]] || continue
    if [[ $(<"$_omarchy_pci/vendor") == "0x10de" ]]; then
      _omarchy_nvidia_gpu=1
    elif _omarchy_gpu_has_connected_output "$_omarchy_pci"; then
      _omarchy_other_gpu=1
    fi
  done
  if ((_omarchy_nvidia_gpu && !_omarchy_other_gpu)); then
    _omarchy_hooks=()
    for _omarchy_hook in "${HOOKS[@]}"; do
      [[ $_omarchy_hook == "kms" ]] || _omarchy_hooks+=("$_omarchy_hook")
    done
    HOOKS=("${_omarchy_hooks[@]}")
  fi
  unset _omarchy_nvidia_gpu _omarchy_other_gpu _omarchy_pci _omarchy_hooks _omarchy_hook
fi
unset -f _omarchy_gpu_has_connected_output

# Bundle vconsole.conf so Plymouth uses the configured keyboard layout at the
# LUKS prompt, but only when that layout types Latin letters. Passphrases are
# Latin characters, so bundling a Hebrew/Greek/Cyrillic/Arabic layout would
# make the correct passphrase untypeable and lock the user out.
if [[ -f /etc/vconsole.conf ]]; then
  case $(. /etc/vconsole.conf && echo "${XKBLAYOUT%%,*}") in
    af | am | ara | bd | bg | by | et | ge | gr | il | in | iq | ir | kg | kh | kz | la | lk | mk | mm | mn | mv | np | rs | ru | sy | th | tj | ua) ;;
    *) FILES+=(/etc/vconsole.conf) ;;
  esac
fi
