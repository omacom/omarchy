# Early-load the NVIDIA driver wherever its modules are installed for this
# kernel, as nvidia.conf from install/hardware/nvidia.sh does for machines that
# had the GPU at install. Otherwise the driver loads late, and Hyprland can
# start first and render on another GPU. Only installing or removing the
# modules changes this decision, and both rebuild the initramfs, so it holds
# when a GPU comes or goes. Never on N1x, where install/hardware/n1x.sh
# decides. Sorts after nvidia.conf and before omarchy_hooks.conf, which reads
# MODULES.
if [[ " ${MODULES[*]:-} " != *" nvidia_drm "* ]] &&
  command -v omarchy-hw-aarch64-n1x >/dev/null && ! omarchy-hw-aarch64-n1x &&
  modinfo -k "${KERNELVERSION:-$(uname -r)}" -F filename nvidia nvidia_modeset nvidia_uvm nvidia_drm &>/dev/null; then
  MODULES+=(nvidia nvidia_modeset nvidia_uvm nvidia_drm)
fi
