# Enable early-boot authorization for already-enrolled (policy=auto)
# Thunderbolt peripheral docks so dock-attached keyboards and mice work at the
# Plymouth/LUKS unlock prompt.
#
# When no policy=auto peripheral devices are enrolled in /var/lib/boltd/devices,
# HOOKS stays untouched so non-dock machines incur zero build or boot overhead.
# When enrolled devices exist, insert omarchy-thunderbolt-dock right after udev
# (before plymouth/keyboard/encrypt) on busybox initramfs, or right after
# systemd on systemd initramfs (where the hook installs only the udev rule and
# dock USB/HID modules, skipping the busybox runscript).
_omarchy_tb_dir=/var/lib/boltd/devices
if (( EUID != 0 )) && [[ -n ${OMARCHY_BOLTD_DEVICES_DIR:-} ]]; then
  _omarchy_tb_dir=$OMARCHY_BOLTD_DEVICES_DIR
fi

_omarchy_tb_enrolled=0
if [[ -d $_omarchy_tb_dir && " ${HOOKS[*]:-} " != *" omarchy-thunderbolt-dock "* ]]; then
  for _omarchy_tb_file in "$_omarchy_tb_dir"/*; do
    [[ -f $_omarchy_tb_file && ! -L $_omarchy_tb_file && -r $_omarchy_tb_file ]] || continue
    _omarchy_tb_uuid=${_omarchy_tb_file##*/}
    [[ $_omarchy_tb_uuid =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || continue

    _omarchy_tb_section=""
    _omarchy_tb_type=""
    _omarchy_tb_policy=""
    while IFS= read -r _omarchy_tb_line || [[ -n $_omarchy_tb_line ]]; do
      _omarchy_tb_line=${_omarchy_tb_line%$'\r'}
      _omarchy_tb_line=${_omarchy_tb_line#"${_omarchy_tb_line%%[![:space:]]*}"}
      _omarchy_tb_line=${_omarchy_tb_line%"${_omarchy_tb_line##*[![:space:]]}"}
      [[ -z $_omarchy_tb_line || $_omarchy_tb_line == \#* || $_omarchy_tb_line == \;* ]] && continue
      if [[ $_omarchy_tb_line == \[*\] ]]; then
        _omarchy_tb_section=${_omarchy_tb_line:1:${#_omarchy_tb_line}-2}
        continue
      fi
      if [[ $_omarchy_tb_line == *=* ]]; then
        _omarchy_tb_key=${_omarchy_tb_line%%=*}
        _omarchy_tb_val=${_omarchy_tb_line#*=}
        _omarchy_tb_key=${_omarchy_tb_key%"${_omarchy_tb_key##*[![:space:]]}"}
        _omarchy_tb_val=${_omarchy_tb_val#"${_omarchy_tb_val%%[![:space:]]*}"}
        if [[ $_omarchy_tb_section == "device" && $_omarchy_tb_key == "type" ]]; then
          _omarchy_tb_type=$_omarchy_tb_val
        elif [[ $_omarchy_tb_section == "user" && $_omarchy_tb_key == "policy" ]]; then
          _omarchy_tb_policy=$_omarchy_tb_val
        fi
      fi
    done <"$_omarchy_tb_file"

    if [[ $_omarchy_tb_type == "peripheral" && $_omarchy_tb_policy == "auto" ]]; then
      _omarchy_tb_enrolled=1
      break
    fi
  done
fi

if (( _omarchy_tb_enrolled )); then
  _omarchy_tb_anchor=""
  if [[ " ${HOOKS[*]:-} " == *" udev "* ]]; then
    _omarchy_tb_anchor=udev
  elif [[ " ${HOOKS[*]:-} " == *" systemd "* ]]; then
    _omarchy_tb_anchor=systemd
  fi
  if [[ -n $_omarchy_tb_anchor ]]; then
    _omarchy_tb_hooks=()
    for _omarchy_tb_hook in "${HOOKS[@]}"; do
      _omarchy_tb_hooks+=("$_omarchy_tb_hook")
      if [[ $_omarchy_tb_hook == "$_omarchy_tb_anchor" ]]; then
        _omarchy_tb_hooks+=(omarchy-thunderbolt-dock)
        _omarchy_tb_anchor=""
      fi
    done
    HOOKS=("${_omarchy_tb_hooks[@]}")
  fi
fi

unset _omarchy_tb_dir _omarchy_tb_enrolled _omarchy_tb_file _omarchy_tb_uuid \
  _omarchy_tb_section _omarchy_tb_type _omarchy_tb_policy _omarchy_tb_line \
  _omarchy_tb_key _omarchy_tb_val _omarchy_tb_anchor _omarchy_tb_hooks _omarchy_tb_hook
