# Internal keyboard at the LUKS prompt on a T2 Mac. t2bce_vhci is the virtual
# USB host the keyboard hangs off, t2bce_dma and t2bce_core are the modules
# modprobe resolves for it, and the HID and xHCI modules bind the USB device
# it exposes.
#
# The installer's zz-omarchy-kernel-modules.conf sorts earlier under
# mkinitcpio's `sort -V` and drops a module when any installed kernel lacks it.
# linux-omarchy has no t2bce stack, so that file was also taking t2bce_vhci out
# of the linux-t2 image. This file has to keep a name that sorts after
# zz-omarchy-kernel-modules.conf. A name is added only when this kernel ships
# it as a loadable file: a systemd initramfs copies MODULES into modules-load.d
# as written, and a missing name fails the other kernel's build.
_omarchy_t2_keyboard=(t2bce_dma t2bce_core t2bce_vhci usbhid hid_apple hid_generic xhci_pci xhci_hcd)
for _omarchy_t2_module in "${_omarchy_t2_keyboard[@]}"; do
  if [[ " ${MODULES[*]:-} " != *" $_omarchy_t2_module "* ]] &&
    [[ $(modinfo -k "${KERNELVERSION:-$(uname -r)}" -F filename "$_omarchy_t2_module" 2>/dev/null) == /* ]]; then
    MODULES+=("$_omarchy_t2_module")
  fi
done
unset _omarchy_t2_keyboard _omarchy_t2_module
