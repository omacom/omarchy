# Early-load thunderbolt where the kernel builds it as a module, placed ahead
# of nvidia_drm (nvidia.conf sorts before this drop-in) so the Thunderbolt
# router initializes before early KMS probes DisplayPort connectors. The
# optional form, thunderbolt?, is not enough: a systemd initramfs copies
# MODULES as written into modules-load.d, where "thunderbolt?" names no module,
# and a kernel without the module would still list it there.
if [[ $(modinfo -k "${KERNELVERSION:-$(uname -r)}" -F filename thunderbolt 2>/dev/null) == /* ]]; then
  if [[ " ${MODULES[*]:-} " != *" thunderbolt "* ]]; then
    MODULES=(thunderbolt ${MODULES[@]+"${MODULES[@]}"})
  fi
fi
