# Early-load thunderbolt where the kernel builds it as a module. The optional
# form, thunderbolt?, is not enough: a systemd initramfs copies MODULES as
# written into modules-load.d, where "thunderbolt?" names no module, and a
# kernel without the module would still list it there.
if [[ $(modinfo -k "${KERNELVERSION:-$(uname -r)}" -F filename thunderbolt 2>/dev/null) == /* ]]; then
  MODULES+=(thunderbolt)
fi
