# Keep /etc/vconsole.conf out of the initramfs unless FILES lists it.
#
# omarchy_hooks.conf leaves the file out of FILES when the first keyboard layout
# types no Latin letters, so the LUKS passphrase stays typeable at the Plymouth
# prompt (#6229). Since 26.134.222-3, Arch's plymouth hook copies the file
# itself (#14246), so refuse it in add_file, which hooks copy files with.
#
# This sits in its own file, which the package does not keep as configuration,
# so it also reaches a machine whose omarchy_hooks.conf was edited or predates
# the package, and so never takes an update.
#
# FILES is read when a file is added, not here, so a drop-in sorting after this
# one can still list the file. A hook runs with FILES local and empty, so its
# copy is refused; the configuration's FILES is added after the hooks run.
#
# Wrap add_file only once: mkinitcpio sources this file again after the hooks
# run, and the systemd hook sources it before calling add_file, where a second
# wrap would make _omarchy_add_file call itself.
#
# Only a first layout that types no Latin letters is refused, the same list
# omarchy_hooks.conf keeps out of FILES. An omarchy_hooks.conf from before the
# package never lists the file at all, and there Plymouth's own copy is what
# brings a Latin layout like German to the prompt; refusing it would switch the
# prompt to US and lock out a passphrase typed in that layout.
if [[ -f /etc/vconsole.conf ]] && declare -F add_file >/dev/null && ! declare -F _omarchy_add_file >/dev/null; then
  eval "_omarchy_$(declare -f add_file)"
  _omarchy_vconsole_nonlatin() {
    case $(unset XKBLAYOUT; . /etc/vconsole.conf 2>/dev/null && echo "${XKBLAYOUT%%,*}") in
      af | am | ara | bd | bg | by | et | ge | gr | il | in | iq | ir | kg | kh | kz | la | lk | mk | mm | mn | mv | np | rs | ru | sy | th | tj | ua) return 0 ;;
    esac
    return 1
  }
  add_file() {
    if [[ ${2:-$1} == "/etc/vconsole.conf" && " ${FILES[*]:-} " != *" /etc/vconsole.conf "* ]] && _omarchy_vconsole_nonlatin; then
      return 0
    fi
    _omarchy_add_file "$@"
  }
fi
