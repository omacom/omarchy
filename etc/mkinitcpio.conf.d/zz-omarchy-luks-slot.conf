# Once Setup > Users has given more than one person a key to the disk, the
# unlock records which key slot opened it (omarchy-luks-slot, after encrypt),
# so omarchy-login-select can open that person's desktop. A machine with one
# person never carries the wrapper. Its own file, sorting after every other
# drop-in: an omarchy_hooks.conf from before the baseline, or edited by hand,
# sets HOOKS whole and would drop the hook added any earlier.
if [[ -d ${OMARCHY_USERS_DIR:-/etc/omarchy/users} && " ${HOOKS[*]} " == *" encrypt "* && " ${HOOKS[*]} " != *" omarchy-luks-slot "* ]]; then
  _omarchy_hooks=()
  for _omarchy_hook in "${HOOKS[@]}"; do
    _omarchy_hooks+=("$_omarchy_hook")
    [[ $_omarchy_hook == "encrypt" ]] && _omarchy_hooks+=(omarchy-luks-slot)
  done
  HOOKS=("${_omarchy_hooks[@]}")
  unset _omarchy_hooks _omarchy_hook
fi
