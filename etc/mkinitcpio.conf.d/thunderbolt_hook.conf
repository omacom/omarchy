# Authorize the Thunderbolt devices Bolt approves on its own at the disk unlock
# prompt, so a keyboard on a dock or display types the passphrase (see
# /etc/initcpio/install/omarchy-thunderbolt). It sorts after omarchy_hooks.conf
# and joins whatever line that file, the baseline or a platform set, including
# an omarchy_hooks.conf that pacman kept from before the baseline. The hook
# adds no modules and nothing at all without such a device.
HOOKS+=(omarchy-thunderbolt)
