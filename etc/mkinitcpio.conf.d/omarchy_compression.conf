# Compress the initramfs with zstd on every platform. Arch's mkinitcpio falls
# back to zstd when nothing sets COMPRESSION, but Arch Linux ARM patches that
# fallback to gzip (0001-use-gzip-for-compression-by-default.patch), which runs
# on one core. On a Snapdragon X Zenbook, one build took 17.9 s with gzip and
# 12.4 s with zstd, at every install, kernel update and firmware change.
#
# Every kernel Omarchy installs unpacks zstd (CONFIG_RD_ZSTD=y): linux-omarchy,
# linux-asahi, linux-aurora, linux-aarch64, and linux-rpi through its Kconfig
# default. A COMPRESSION set in mkinitcpio.conf, or in a drop-in sorting before
# this one, stays as it is.
[[ -v COMPRESSION ]] || COMPRESSION="zstd"
