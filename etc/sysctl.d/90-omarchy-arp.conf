# Answer ARP only for the interface's own address, and announce from it. With
# a dock's Ethernet and Wi-Fi on the same network, the kernel default lets each
# answer for the other's address: Wi-Fi claims the wired address while
# NetworkManager is still checking it for conflicts, so NetworkManager takes the
# wired routes down and traffic stays on Wi-Fi.
net.ipv4.conf.all.arp_ignore=1
net.ipv4.conf.default.arp_ignore=1
net.ipv4.conf.all.arp_announce=2
net.ipv4.conf.default.arp_announce=2
