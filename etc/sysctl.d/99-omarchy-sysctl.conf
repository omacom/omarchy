# Solve common flakiness with SSH (MTU discovery on flaky links).
net.ipv4.tcp_mtu_probing=1

# BBR estimates bottleneck bandwidth and minimum RTT and paces to them, where
# cubic keeps pushing until packets drop. That cuts queueing latency
# (bufferbloat) on fast links. fq is the qdisc BBR is built to pace through.
net.core.default_qdisc=fq
net.ipv4.tcp_congestion_control=bbr

# Tune reclaim for fast desktop responsiveness alongside swap on zram.

# Balance file page cache vs anonymous reclaim for in-RAM zram swap.
# session.slice already pins compositor and shell anonymous pages with
# MemorySwapMax=0; swappiness=100 lets MGLRU compress cold app.slice pages
# into zram instead of evicting active executable and file caches to disk or
# hitting a direct-reclaim cliff when physical RAM fills.
vm.swappiness=100

# Read one page per swap-in fault. The default of 8 pays for a seek that zram
# doesn't have, and every extra page costs a separate decompression.
vm.page-cluster=0

# Don't let external fragmentation raise the watermarks, which produces
# reclaim bursts while memory is still free.
vm.watermark_boost_factor=0

# Keep ~1.25% of memory free instead of 0.1%, so kswapd reclaims in the
# background rather than letting allocations stall in direct reclaim.
vm.watermark_scale_factor=125

# Cap dirty pages at 64M/256M instead of the default 10%/20% of RAM, which
# lets gigabytes of writeback pile up and flush in stalling bursts.
vm.dirty_background_bytes=67108864
vm.dirty_bytes=268435456

# With bursts bounded above, the flusher can wake every 15s instead of 5s.
vm.dirty_writeback_centisecs=1500
