# Keep Bluetooth USB controllers awake when TLP manages USB power.
#
# TLP's USB autosuspend suspends Bluetooth combo controllers about two
# seconds after they go idle. A runtime-suspended btusb drops the BLE
# advertisements that bonded peripherals send when they try to reconnect,
# so mice and keyboards only come back after they are removed and paired
# again. Excluding the controllers keeps the radios reachable without
# changing TLP's policy for other USB devices.
#
# Covers the Intel wireless combo cards shipped in most Omarchy laptops.
# Append more vid:pid pairs to cover other controllers.
USB_DENYLIST="8087:0025 8087:0026 8087:0029 8087:0032 8087:0033 8087:0036 8087:0aaa"
