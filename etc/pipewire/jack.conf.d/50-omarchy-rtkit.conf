# Ask rtkit for realtime directly, as PipeWire's own pipewire.conf does, rather
# than through xdg-desktop-portal. A portal started before rtkit was installed
# reports a realtime budget of zero, and module-rt applies that as a hard
# RLIMIT_RTTIME of 0, which the kernel enforces with SIGKILL as soon as a
# thread runs realtime or a CPU-time timer fires. Without rtkit, a client
# gets realtime only if its own limits allow it, and never a zero limit.
# Flatpak apps read their runtime's own jack.conf and are not affected.
module.rt.args = {
  rtportal.enabled = false
}
