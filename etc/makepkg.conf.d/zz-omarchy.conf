# With this file, makepkg compiles local packages (AUR, makepkg -si) for the
# CPU of this computer. With the Arch flags, it compiles for all x86-64 CPUs.
#
# This file changes only the CPU flags. All other Arch flags stay the same.
#
# The name starts with "zz-" so that makepkg reads this file after rust.conf
# and fortran.conf. Those files set RUSTFLAGS and FFLAGS. If this file loads
# first, those files replace our flags.
#
# Packages that you compile with these flags operate only on CPUs of the same
# type. Do not install these packages on other computers.
#
# To change these flags, do not edit this file. Put your flags in
# ~/.config/pacman/makepkg.conf. makepkg reads that file last.

# C and C++
CFLAGS=${CFLAGS/-march=x86-64 -mtune=generic/-march=native}
CXXFLAGS=${CXXFLAGS/-march=x86-64 -mtune=generic/-march=native}

# Rust
RUSTFLAGS="$RUSTFLAGS -C target-cpu=native"

# Fortran
FFLAGS=${FFLAGS/-march=x86-64 -mtune=generic/-march=native}
FCFLAGS=${FCFLAGS/-march=x86-64 -mtune=generic/-march=native}
