# Some displays drop HDMI hotplug-detect (HPD) when the link enters DPMS
# power save, then re-assert it as an input-source "autoscan" a moment later.
# The kernel sees a disconnect->reconnect with an identical EDID and raises a
# hotplug event, so a DPMS-off output is removed and re-added with DPMS back
# on -- e.g. the screen relighting while locked. amdgpu's HDMI HPD debounce
# (upstream "drm/amd/display: Add an HPD filter for HDMI", default off)
# defers the disconnect detection and skips the hotplug when the same EDID
# returns within the window.
#
# Only HDMI is filtered; DisplayPort is unaffected, and the option is inert
# when amdgpu is not loaded. Value is the debounce window in ms (max 5000).
options amdgpu hdmi_hpd_debounce_delay_ms=1500