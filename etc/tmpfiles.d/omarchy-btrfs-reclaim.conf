# Let btrfs compact partly used data block groups on its own. Without it, data
# chunks can claim the whole device over time, metadata has no room to grow, and
# writes fail with ENOSPC while df still shows free space. Data only: metadata
# reclaim stays off. Kernels before 6.11 have no such files, so the globs match
# nothing there.
w /sys/fs/btrfs/*/allocation/data/dynamic_reclaim - - - - 1
w /sys/fs/btrfs/*/allocation/data/periodic_reclaim - - - - 1
