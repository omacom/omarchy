# Boost Intel HWP frequency immediately on I/O wakeups for snappier interactive
# bursts under the powersave governor (including balanced mode). Boot-only
# (w!), so manual overrides stick until reboot, and a silent no-op on systems
# without Intel HWP (AMD, ARM, older Intel CPUs).
w! /sys/devices/system/cpu/intel_pstate/hwp_dynamic_boost - - - - 1
