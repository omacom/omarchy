# Arch's kernel enables zswap by default. In front of swap-on-zram the
# tradeoff is hardware-dependent — measured 2026-10-12 with a 12GB
# anonymous-memory hog capped at 3G RAM via cgroup memory.max, two runs
# per state, same workload on both machines:
#
#   Apple M2 Pro (aarch64, 16K pages, zram0 zstd over swapfile):
#     zswap on:  alloc 2.4-2.5s    churn 3.2s       task CPU 5.87-5.90s
#     zswap off: alloc 3.0-3.1s    churn 3.7-3.8s   task CPU 6.83s
#     -> the lzo front cache absorbs the hot working set and batches the
#        zstd writeback: ~20% faster, ~14% less CPU
#
#   Intel MacBook Pro 2015 (x86_64 i5-5257U, 4K pages, same layout):
#     zswap on:  alloc 40.0-41.8s  churn 34.2-57.5s  task CPU 75.3-93.1s
#     zswap off: alloc 24.9-32.9s  churn 45.0-49.7s  task CPU 56.6-60.1s
#     -> double compression burns CPU those machines cannot spare:
#        ~35% slower alloc, up to +55% task CPU under churn
#
# Compile-type loads (abseil-cpp -j8, 1.5G cap) are identical either way.
# With zswap on, zramctl misses whatever sits in the zswap pool (measured
# ~130MB of ~4GB during churn; bounded by max_pool_percent, inspectable
# via /sys/kernel/debug/zswap/pool_total_size).
#
# Default stays OFF: the safer choice across the mixed-age x86 fleet.
# On fast CPUs enabling it is a measured win — flip it live to try (this
# rule is boot-only `w!`, so a manual flip sticks until reboot):
#   echo Y | sudo tee /sys/module/zswap/parameters/enabled
w! /sys/module/zswap/parameters/enabled - - - - N
