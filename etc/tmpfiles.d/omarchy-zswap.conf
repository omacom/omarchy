# Arch's kernel enables zswap by default. In front of swap-on-zram the tradeoff
# depends on the hardware: in one memory-pressure test it was faster on an Apple
# Silicon machine and slower on a 2015 Intel laptop, so the default stays off.
# With zswap on, zramctl doesn't count pages held in the zswap pool.
# Boot-only (w!), so flipping it on live sticks until reboot:
#   echo Y | sudo tee /sys/module/zswap/parameters/enabled
w! /sys/module/zswap/parameters/enabled - - - - N
