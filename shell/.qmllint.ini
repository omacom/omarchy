# Shared qmllint settings for omarchy-shell (Qt 6.12 + Quickshell).
# Enforced in CI by test/shell.d/qmllint-test.sh and picked up automatically
# by qmllint and qmlls in editors.
#
# High-signal syntax, import, unresolved-type, required-property, layout,
# equality, and unused-import checks are enabled. Categories disabled below
# either reflect Quickshell .qmltypes limitations across many call sites or
# existing shell debt to tighten in follow-up PRs.

[General]
DisableDefaultImports=false
MaxWarnings=0
OnlyExplicitCategories=false
Warnings=warning

[Warnings]
UnusedImports=warning

# Quickshell .qmltypes limitations (PanelWindow non-creatable, flag enum
# bitmasks, Window.contentItem non-notifiable).
IncompatibleType=disable
StalePropertyRead=disable
UncreatableType=disable

# Legacy shell debt (tighten incrementally in focused PRs)
BlockScopeVarDeclaration=disable
IdShadowsMember=disable
MissingProperty=disable
PropertyOverride=disable
RenamedType=disable
UnqualifiedAccess=disable
