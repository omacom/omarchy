# Paper Harbor — theme-only shell visuals; shell.json remains user-owned.
[bar]
background = "#fff6e6"
background-alpha = 0.97
text = "#24333a"
active = "#b82f21"
scale-with-font = true
size-horizontal = 28
size-vertical = 30

[hyprland]
active-border = "#b82f21"
active-border-foreground = "#b82f21"

[controls]
normal-color = "#24333a"
normal-fill-alpha = 0.04
normal-border = "#696b62"
normal-border-width = 1
normal-border-alpha = 0.62
hover-cursor-color = "#101c22"
hover-cursor-fill-alpha = 0.10
hover-cursor-border = "#356582"
hover-cursor-border-width = 2
hover-cursor-border-alpha = 0.90
focus-color = "#101c22"
focus-fill-alpha = 0.13
focus-border = "hyprland.active-border"
focus-border-width = 2
focus-border-alpha = 1.0
selected-color = "foreground"
selected-fill-alpha = 0.14
selected-border = "#101c22"
selected-border-width = 2
selected-border-alpha = 0.86
pressed-fill-alpha = 0.24
selection-fill-alpha = 0.40

[spacing]
scale = 1.0
scale-with-font = true
control-height = 30
popup-row-height = 32
panel-gap = 14
panel-padding = 14
popup-padding = 12

[font]
base-size = 12
caption = 10
body-small = 11
body = 12
subtitle = 13
heading = 15

[popups]
background = "#f6ead6"
background-alpha = 0.98
text = "#24333a"
border = "#805537"
border-alpha = 0.96
border-width = 2

[tooltip]
background = "#fff6e6"
background-alpha = 0.99
text = "#24333a"
border = "#696b62"
border-alpha = 0.90

[notifications]
background = "#f6ead6"
background-alpha = 0.98
text = "#24333a"
border = "#805537"
border-alpha = 0.96
border-width = 2
countdown = "#805537"

[launcher]
background = "#f6ead6"
background-alpha = 0.97
text = "#24333a"
border = "#805537"
border-alpha = 0.98
border-width = 2
scrim = "#f8ecd7"
scrim-alpha = 0.28
selected-background = "#b82f21"
selected-background-alpha = 1.0
selected-text = "#fff6e6"
selected-border = "#101c22"
selected-border-alpha = 0.85
selected-border-width = 2

[menu]
background = "#f6ead6"
background-alpha = 0.98
text = "#24333a"
border = "#805537"
border-alpha = 0.98
border-width = 2
scrim = "#f8ecd7"
scrim-alpha = 0.28
selected-background = "#b82f21"
selected-background-alpha = 1.0
selected-text = "#fff6e6"
selected-border = "#101c22"
selected-border-alpha = 0.85
selected-border-width = 2

[polkit]
background = "#f6ead6"
background-alpha = 0.99
text = "#24333a"
text-error = "#a43b2e"
border = "#805537"
border-error = "#a43b2e"
border-alpha = 1.0
scrim = "#f8ecd7"
scrim-alpha = 0.36
accent = "#356582"

[lock]
background = "#f6ead6"
background-alpha = 0.96
text = "#24333a"
placeholder = "#4a5960"
text-error = "#a43b2e"
border = "#696b62"
border-active = "hyprland.active-border"
border-error = "#a43b2e"
border-alpha = 1.0
selection = "#b82f21"
selection-alpha = 0.55

[image-picker]
scrim = "#f8ecd7"
scrim-alpha = 0.28
text = "#24333a"
selected-border = "#b82f21"
selected-border-alpha = 1.0
unselected-border = "#696b62"
unselected-border-alpha = 0.72
