# Weather Parade — theme-only shell visuals; shell.json remains user-owned.
[bar]
background = "#eaf7ff"
background-alpha = 0.97
text = "#20314a"
active = "#5b58c9"
scale-with-font = true
size-horizontal = 28
size-vertical = 30

[hyprland]
active-border = "#5b58c9 #168a9d 90deg"
active-border-foreground = "#ee6e63 #1aa3b9 90deg"

[controls]
normal-color = "#20314a"
normal-fill-alpha = 0.04
normal-border = "#65768a"
normal-border-width = 1
normal-border-alpha = 0.62
hover-cursor-color = "#101d31"
hover-cursor-fill-alpha = 0.10
hover-cursor-border = "#168a9d"
hover-cursor-border-width = 2
hover-cursor-border-alpha = 0.90
focus-color = "#101d31"
focus-fill-alpha = 0.13
focus-border = "hyprland.active-border"
focus-border-width = 2
focus-border-alpha = 1.0
selected-color = "foreground"
selected-fill-alpha = 0.14
selected-border = "#101d31"
selected-border-width = 2
selected-border-alpha = 0.86
pressed-fill-alpha = 0.24
selection-fill-alpha = 0.40

[spacing]
scale = 1.0
scale-with-font = true
control-height = 30
popup-row-height = 32
panel-gap = 16
panel-padding = 14
popup-padding = 12

[font]
base-size = 12
caption = 10
body-small = 11
body = 12
subtitle = 13
heading = 15

[popups]
background = "#d9effa"
background-alpha = 0.98
text = "#20314a"
border = "#5b58c9"
border-alpha = 0.96
border-width = 2

[tooltip]
background = "#d9effa"
background-alpha = 0.99
text = "#20314a"
border = "#65768a"
border-alpha = 0.90

[notifications]
background = "#d9effa"
background-alpha = 0.98
text = "#20314a"
border = "#5b58c9"
border-alpha = 0.96
border-width = 2
countdown = "#865a47"

[launcher]
background = "#d9effa"
background-alpha = 0.97
text = "#20314a"
border = "#5b58c9"
border-alpha = 0.98
border-width = 2
scrim = "#f7e7aa"
scrim-alpha = 0.28
selected-background = "#5b58c9"
selected-background-alpha = 1.0
selected-text = "#eaf7ff"
selected-border = "#101d31"
selected-border-alpha = 0.85
selected-border-width = 2

[menu]
background = "#d9effa"
background-alpha = 0.98
text = "#20314a"
border = "#5b58c9"
border-alpha = 0.98
border-width = 2
scrim = "#f7e7aa"
scrim-alpha = 0.28
selected-background = "#5b58c9"
selected-background-alpha = 1.0
selected-text = "#eaf7ff"
selected-border = "#101d31"
selected-border-alpha = 0.85
selected-border-width = 2

[polkit]
background = "#d9effa"
background-alpha = 0.99
text = "#20314a"
text-error = "#a83c36"
border = "#5b58c9"
border-error = "#a83c36"
border-alpha = 1.0
scrim = "#f7e7aa"
scrim-alpha = 0.36
accent = "#168a9d"

[lock]
background = "#d9effa"
background-alpha = 0.96
text = "#20314a"
placeholder = "#40556d"
text-error = "#a83c36"
border = "#65768a"
border-active = "hyprland.active-border"
border-error = "#a83c36"
border-alpha = 1.0
selection = "#5b58c9"
selection-alpha = 0.55

[image-picker]
scrim = "#f7e7aa"
scrim-alpha = 0.28
text = "#20314a"
selected-border = "#5b58c9"
selected-border-alpha = 1.0
unselected-border = "#65768a"
unselected-border-alpha = 0.72
