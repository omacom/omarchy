# Night Transit — theme-only shell visuals; shell.json remains user-owned.
[bar]
background = "#112b4d"
background-alpha = 0.97
text = "#f8e5c5"
active = "#f06f65"
scale-with-font = true
size-horizontal = 28
size-vertical = 30

[hyprland]
active-border = "#f06f65 #39a3aa 90deg"
active-border-foreground = "#f07a6d #43c0c9 90deg"

[controls]
normal-color = "#f8e5c5"
normal-fill-alpha = 0.04
normal-border = "#7896a3"
normal-border-width = 1
normal-border-alpha = 0.62
hover-cursor-color = "#fff4dc"
hover-cursor-fill-alpha = 0.10
hover-cursor-border = "#39a3aa"
hover-cursor-border-width = 2
hover-cursor-border-alpha = 0.90
focus-color = "#fff4dc"
focus-fill-alpha = 0.13
focus-border = "hyprland.active-border"
focus-border-width = 2
focus-border-alpha = 1.0
selected-color = "foreground"
selected-fill-alpha = 0.14
selected-border = "#fff4dc"
selected-border-width = 2
selected-border-alpha = 0.86
pressed-fill-alpha = 0.24
selection-fill-alpha = 0.40

[spacing]
scale = 1.0
scale-with-font = true
control-height = 30
popup-row-height = 32
panel-gap = 12
panel-padding = 14
popup-padding = 12

[font]
base-size = 12
caption = 10
body-small = 11
body = 12
subtitle = 13
heading = 15

[popups]
background = "#193c5b"
background-alpha = 0.98
text = "#f8e5c5"
border = "#f06f65"
border-alpha = 0.96
border-width = 2

[tooltip]
background = "#193c5b"
background-alpha = 0.99
text = "#f8e5c5"
border = "#7896a3"
border-alpha = 0.90

[notifications]
background = "#193c5b"
background-alpha = 0.98
text = "#f8e5c5"
border = "#f06f65"
border-alpha = 0.96
border-width = 2
countdown = "#d39a30"

[launcher]
background = "#193c5b"
background-alpha = 0.97
text = "#f8e5c5"
border = "#f06f65"
border-alpha = 0.98
border-width = 2
scrim = "#0b203b"
scrim-alpha = 0.28
selected-background = "#f06f65"
selected-background-alpha = 1.0
selected-text = "#112b4d"
selected-border = "#fff4dc"
selected-border-alpha = 0.85
selected-border-width = 2

[menu]
background = "#193c5b"
background-alpha = 0.98
text = "#f8e5c5"
border = "#f06f65"
border-alpha = 0.98
border-width = 2
scrim = "#0b203b"
scrim-alpha = 0.28
selected-background = "#f06f65"
selected-background-alpha = 1.0
selected-text = "#112b4d"
selected-border = "#fff4dc"
selected-border-alpha = 0.85
selected-border-width = 2

[polkit]
background = "#193c5b"
background-alpha = 0.99
text = "#f8e5c5"
text-error = "#f98d7e"
border = "#f06f65"
border-error = "#f07a6d"
border-alpha = 1.0
scrim = "#0b203b"
scrim-alpha = 0.36
accent = "#39a3aa"

[lock]
background = "#193c5b"
background-alpha = 0.96
text = "#f8e5c5"
placeholder = "#b8c9c5"
text-error = "#f98d7e"
border = "#7896a3"
border-active = "hyprland.active-border"
border-error = "#f07a6d"
border-alpha = 1.0
selection = "#f06f65"
selection-alpha = 0.55

[image-picker]
scrim = "#0b203b"
scrim-alpha = 0.28
text = "#f8e5c5"
selected-border = "#f06f65"
selected-border-alpha = 1.0
unselected-border = "#7896a3"
unselected-border-alpha = 0.72
