# The modules the display gate waits for before the root is unlocked; an image's initramfs is
# built away from the Mac, so autodetect misses them (external displays fail with -110).
# Each is added only when modinfo names it as a module of the target kernel.
for _omarchy_mac_display_module in phy-apple-t6040-usb2 mux-apple-display-crossbar atc-t6050-dp phy-apple-atc phy-apple-dptx; do
  _omarchy_mac_display_path=$(modinfo -k "${KERNELVERSION:-$(uname -r)}" -F filename "$_omarchy_mac_display_module" 2>/dev/null) &&
    [[ $_omarchy_mac_display_path == /* ]] && MODULES+=("$_omarchy_mac_display_module")
done
unset _omarchy_mac_display_module _omarchy_mac_display_path
