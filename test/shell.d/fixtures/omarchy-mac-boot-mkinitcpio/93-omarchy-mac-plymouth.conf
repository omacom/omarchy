# Plymouth draws the disk password prompt and the boot splash, as on x86
# Omarchy. It goes right after systemd so its initrd units order correctly,
# only when the hook is installed, and never twice.
if [[ -f /usr/lib/initcpio/install/plymouth && " ${HOOKS[*]} " != *" plymouth "* ]]; then
  _omarchy_mac_plymouth_hooks=()
  _omarchy_mac_plymouth_added=false
  for _omarchy_mac_plymouth_hook in "${HOOKS[@]}"; do
    _omarchy_mac_plymouth_hooks+=("$_omarchy_mac_plymouth_hook")
    if [[ $_omarchy_mac_plymouth_hook == systemd && $_omarchy_mac_plymouth_added == false ]]; then
      _omarchy_mac_plymouth_hooks+=(plymouth)
      _omarchy_mac_plymouth_added=true
    fi
  done
  if [[ $_omarchy_mac_plymouth_added == true ]]; then
    HOOKS=("${_omarchy_mac_plymouth_hooks[@]}")
  fi
  unset _omarchy_mac_plymouth_hooks _omarchy_mac_plymouth_added _omarchy_mac_plymouth_hook
fi
