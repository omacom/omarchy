# The boot kernel freezes every bound GPU while restoring a hibernation image.
# With PreserveVideoMemoryAllocations=1 this driver returns -EIO from that
# freeze, and the saved image is discarded. nvidia.conf still lists these
# modules so omarchy_hooks.conf can drop the kms hook on an NVIDIA-only
# machine; this file is sourced later and removes them. nvidia-resume.service
# restores video memory after the saved session is running.
_filtered=()
for _m in ${MODULES[@]+"${MODULES[@]}"}; do
  case $_m in
    nvidia | nvidia_modeset | nvidia_uvm | nvidia_drm | nvidia_peermem) ;;
    *) _filtered+=("$_m") ;;
  esac
done
MODULES=("${_filtered[@]}")
unset _filtered _m
