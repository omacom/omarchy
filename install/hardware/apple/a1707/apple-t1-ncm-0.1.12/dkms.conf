# Standalone build of T1Bridge's apple_t1_ncm (CDC-NCM link to the Apple T1).
# Source: t1bridge-dkms 0.1.12, kernel/apple-t1-ncm/. Only this module is built
# so the Seborider mbp-t1-touchbar appletbdrm stack keeps driving the Touch Bar.
PACKAGE_NAME="apple-t1-ncm"
PACKAGE_VERSION="0.1.12"
MAKE[0]="make KDIR=/lib/modules/${kernelver}/build"
CLEAN="make KDIR=/lib/modules/${kernelver}/build clean"
BUILT_MODULE_NAME[0]="apple_t1_ncm"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
